[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vsa"
version = "0.1.0"
description = "Veri Sözlüğü Asistanı — iş birimi taleplerini veri sözlüğüne karşı eşleştirir"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1.5",
    "defusedxml>=0.7.1",  # openpyxl parses uploaded workbooks with it (XML attacks)
    "pyyaml>=6.0.2",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "types-PyYAML", "types-openpyxl", "types-defusedxml"]

[project.scripts]
vsa = "vsa.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vsa = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM905"]  # "a b c".split() is the readable form for word lists

[tool.ruff.lint.per-file-ignores]
"src/vsa/web/settings_schema.py" = ["E501"]  # Turkish help texts (a data table)

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
strict = true
mypy_path = "src"
