server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;

  # Content-hashed build files carry no data and may be cached (user-accounts Decision 14).
  location /assets/ {
    include /etc/nginx/conf.d/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # index.html and every client-side route are never cached.
  location / {
    include /etc/nginx/conf.d/security-headers.conf;
    add_header Cache-Control "no-store" always;
    try_files $uri $uri/ /index.html;
  }
}
