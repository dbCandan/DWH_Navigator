name: dwhnavigator

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17.10@sha256:7958605b474b3d264a969cb3a123d6aa00ad1e1fe9da8a69984dabb704d93317}
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?start the stack through scripts/stack.sh}
      POSTGRES_DB: dwhnavigator_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d dwhnavigator_db"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Cache slot: starts only when an accepted PRD enables the `cache` profile.
  redis:
    profiles: ["cache"]
    image: ${REDIS_IMAGE:-redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2}
    environment:
      # redis-cli reads REDISCLI_AUTH, so the healthcheck sends no password on a command line.
      REDISCLI_AUTH: ${REDIS_PASSWORD:?start the stack through scripts/stack.sh}
    # The password reaches the server as configuration on standard input, never as a process
    # argument; the image entrypoint still drops to the unprivileged redis user.
    entrypoint:
      - sh
      - -c
      - |
        exec docker-entrypoint.sh redis-server - --save "" --appendonly no <<EOF
        requirepass $$REDISCLI_AUTH
        EOF
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -qx PONG"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  backend:
    build:
      context: ../..
      dockerfile: app/backend/Dockerfile.dev
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.14-alpine3.23@sha256:218761489de417a6eb0808e264cbdd7043ec6659fe5a61898815e9848536541d}
        DEPENDENCY_MODE: ${DEPENDENCY_MODE:-connected}
      additional_contexts:
        python_wheelhouse: ${PYTHON_WHEELHOUSE_CONTEXT:-../frontend}
    environment:
      DWHNAVIGATOR_ENVIRONMENT: development
      DWHNAVIGATOR_DEBUG: "true"
      DWHNAVIGATOR_LOG_LEVEL: INFO
      DWHNAVIGATOR_PROJECT_NAME: "DWH Navigator"
      DWHNAVIGATOR_API_PREFIX: "/api/dwhnavigator/v1"
      DWHNAVIGATOR_TENANT_HEADER: "x-tenant-id"
      DWHNAVIGATOR_CORS_ALLOW_ORIGINS: "http://localhost:3000,http://localhost:8080"
      DWHNAVIGATOR_DATABASE_URL: "postgresql+asyncpg://app:${POSTGRES_PASSWORD:?start the stack through scripts/stack.sh}@postgres:5432/dwhnavigator_db"
      DWHNAVIGATOR_JWT_PRIVATE_KEY: "${JWT_PRIVATE_KEY:?start the stack through scripts/stack.sh}"
      DWHNAVIGATOR_JWT_ALGORITHM: ES256
      DWHNAVIGATOR_JWT_ISSUER: "dwhnavigator"
      DWHNAVIGATOR_JWT_AUDIENCE: "dwhnavigator-api"
      DWHNAVIGATOR_ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      DWHNAVIGATOR_REFRESH_SESSION_IDLE_MINUTES: "60"
      DWHNAVIGATOR_REFRESH_SESSION_ABSOLUTE_HOURS: "8"
      DWHNAVIGATOR_ONE_TIME_PASSWORD_TTL_HOURS: "72"
      DWHNAVIGATOR_PUBLIC_ORIGIN: "http://localhost:${APP_HTTP_PORT:-8080}"
      DWHNAVIGATOR_TRUSTED_PROXY_CIDRS: ""
      # Secret; supplied from the shell or the Git-ignored app/infra/.env until the factory's local
      # secret generation provides it. Empty means no setting can be stored encrypted.
      DWHNAVIGATOR_SETTINGS_ENCRYPTION_KEY: "${DWHNAVIGATOR_SETTINGS_ENCRYPTION_KEY:-}"
      # Model server connections are entered on the AI page (data-dictionary/PRDs/003-llm-connection).
      # The default local network has no egress; a model server is reached only through the opt-in
      # local-egress gate below. Empty trust store: the image's system trust store.
      DWHNAVIGATOR_LLM_CA_BUNDLE: ""
      DWHNAVIGATOR_LLM_MAX_CONCURRENT_CALLS: "5"
      DWHNAVIGATOR_LLM_CALL_LOG_DAYS: "7"
      # ERPDM is not among the local backups; an update leaves it out and keeps its records.
      DWHNAVIGATOR_DICTIONARY_IGNORED_DATABASES: "ERPDM"
      DWHNAVIGATOR_DICTIONARY_IGNORED_COLUMNS: "PersonnelFlag"
      # The dictionary update writes with the model the gold set measured best (2026-11-08).
      DWHNAVIGATOR_DICTIONARY_LLM_MODEL: "qwen/qwen3.8-27b"
      DWHNAVIGATOR_DICTIONARY_LLM_REASONING_EFFORT: "none"
      DWHNAVIGATOR_DICTIONARY_JUDGE_REASONING_EFFORT: "low"
      # An update with changes waits for an admin's approval; the verifier scores 40 changed texts.
      DWHNAVIGATOR_DICTIONARY_SYNC_REQUIRES_APPROVAL: "true"
      DWHNAVIGATOR_DICTIONARY_JUDGE_SAMPLE: "40"
      # Empty: the bundled dictionary_curation/decisions.json.
      DWHNAVIGATOR_DICTIONARY_DECISIONS_PATH: ""
      # No hand-confirmed names: the dictionary carries the warehouse's own schemas and names.
      DWHNAVIGATOR_DICTIONARY_OBJECT_ALIASES: ""
      # Question analysis jobs: up to 4 owners in parallel, one job per owner, at most 20 waiting
      # (004-question-analysis Decision 27).
      DWHNAVIGATOR_ANALYSIS_CONCURRENCY: "4"
      DWHNAVIGATOR_ANALYSIS_QUEUE_LIMIT: "20"
      # OpenTelemetry export stays off here; the observability overlay sets its collector address.
      DWHNAVIGATOR_OTEL_EXPORTER_OTLP_ENDPOINT: "${DWHNAVIGATOR_OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      DWHNAVIGATOR_OTEL_SERVICE_NAME: "dwhnavigator-backend"
      DWHNAVIGATOR_OTEL_TRACES_SAMPLE_RATIO: "1.0"
      DWHNAVIGATOR_OTEL_METRIC_EXPORT_INTERVAL_SECONDS: "15"
      DWHNAVIGATOR_BOOTSTRAP_SUPER_ADMIN_USERNAME: "${DWHNAVIGATOR_BOOTSTRAP_SUPER_ADMIN_USERNAME:-super-admin}"
      # Optional start-up password from the Git-ignored app/infra/.env; empty opens no account.
      DWHNAVIGATOR_BOOTSTRAP_SUPER_ADMIN_PASSWORD: "${DWHNAVIGATOR_BOOTSTRAP_SUPER_ADMIN_PASSWORD:-}"
    volumes:
      - ../backend:/workspace/app/backend
      - ../../schema:/workspace/schema
      - ../../specs:/workspace/specs
    networks:
      - default
      - host-gate
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Opt-in local egress (specs/application-foundation/PRDs/002-kubernetes-delivery Requirement 17,
  # Decision 14): starts only when app/infra/.env sets COMPOSE_PROFILES=local-egress. The gate
  # forwards one port to one model server: LOCAL_EGRESS_MODEL_PORT on LOCAL_EGRESS_MODEL_ADDRESS
  # (an IPv4 address; empty is this computer). The backend reaches it on the internal host-gate
  # network under LOCAL_EGRESS_MODEL_HOST (default host.docker.internal), the host name of the
  # integration's address, so a TLS certificate is still checked against that name. Without the
  # profile the name does not resolve in the backend and nothing leaves the stack.
  local-egress:
    profiles: ["local-egress"]
    image: ${NGINX_IMAGE:-nginx:1.31.6-alpine-slim@sha256:f761b94f2cb9e8e05e2943d5f773609596113ef69b54e2433a996d109a8f78b7}
    environment:
      MODEL_PORT: "${LOCAL_EGRESS_MODEL_PORT:-}"
      MODEL_ADDRESS: "${LOCAL_EGRESS_MODEL_ADDRESS:-}"
    # Docker maps host.docker.internal to an IPv4 and an IPv6 address of this computer, but the
    # egress bridge has no IPv6 route; the gate forwards to an IPv4 address only.
    entrypoint:
      - /bin/sh
      - -ec
      - |
        case "$$MODEL_PORT" in
          ''|*[!0-9]*) echo "local-egress: LOCAL_EGRESS_MODEL_PORT must be a port number" >&2; exit 1 ;;
        esac
        if [ "$$MODEL_PORT" -lt 1 ] || [ "$$MODEL_PORT" -gt 65535 ]; then
          echo "local-egress: LOCAL_EGRESS_MODEL_PORT must be 1-65535" >&2; exit 1
        fi
        address="$$MODEL_ADDRESS"
        if [ -z "$$address" ]; then
          address="$$(awk '$$2 == "host.docker.internal" && $$1 !~ /:/ { print $$1; exit }' /etc/hosts)"
        fi
        if ! printf '%s\n' "$$address" | grep -Eq '^([0-9]{1,3}[.]){3}[0-9]{1,3}$$'; then
          echo "local-egress: LOCAL_EGRESS_MODEL_ADDRESS must be an IPv4 address" >&2; exit 1
        fi
        source_address="$$(awk '$$2 == "host.docker.internal" && $$1 !~ /:/ { print $$1; exit }' /etc/hosts)"
        sed -e "s/MODEL_ADDRESS/$$address/" -e "s/MODEL_PORT/$$MODEL_PORT/g" \
          -e "s/127[.]0[.]0[.]1:14333/$${source_address:-127.0.0.1}:14333/" \
          /etc/nginx/local-egress.conf > /tmp/local-egress.conf
        exec nginx -c /tmp/local-egress.conf -g "daemon off;"
    user: "101:101"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    # The model server may listen on a port below 1024 (https on 443); the unprivileged user may
    # bind it inside the gate's own network namespace only.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    tmpfs:
      - /tmp
    volumes:
      - ./nginx/nginx.local-egress.conf:/etc/nginx/local-egress.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 127.0.0.1
    networks:
      host-gate:
        aliases:
          - ${LOCAL_EGRESS_MODEL_HOST:-host.docker.internal}
          # SQL Server on this computer's port 14333, as dwh-source:1433 (011-dictionary-sync).
          - dwh-source
      egress: {}
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
      args:
        FRONTEND_NODE_BASE_IMAGE: ${FRONTEND_NODE_BASE_IMAGE:-node:22.23.2-alpine3.23@sha256:46825fbbd4e996a78b7a2cdc08d75e38a5a505bdab95dcda55605359bf124bc6}
        DEPENDENCY_MODE: ${DEPENDENCY_MODE:-connected}
      additional_contexts:
        npm_cache: ${NPM_CACHE_CONTEXT:-.}
    volumes:
      - ../frontend/src:/app/src:ro
      - ../frontend/components.json:/app/components.json:ro
      - ../frontend/eslint.config.js:/app/eslint.config.js:ro
      - ../frontend/index.html:/app/index.html:ro
      - ../frontend/package.json:/app/package.json:ro
      - ../frontend/package-lock.json:/app/package-lock.json:ro
      - ../frontend/tsconfig.app.json:/app/tsconfig.app.json:ro
      - ../frontend/tsconfig.json:/app/tsconfig.json:ro
      - ../frontend/tsconfig.node.json:/app/tsconfig.node.json:ro
      - ../frontend/vite.config.ts:/app/vite.config.ts:ro
      - ../frontend/vitest.config.ts:/app/vitest.config.ts:ro
      - frontend_dependencies:/app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: ${NGINX_IMAGE:-nginx:1.31.6-alpine-slim@sha256:f761b94f2cb9e8e05e2943d5f773609596113ef69b54e2433a996d109a8f78b7}
    volumes:
      - ./nginx/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${APP_HTTP_PORT:-8080}:8080"
    networks:
      - default
      - edge
    dns:
      - 127.0.0.1
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:
  frontend_dependencies:

networks:
  default:
    internal: true
  # Docker Desktop does not publish ports from an internal-only bridge. Only the
  # reverse proxy joins this host-facing bridge; application and data services do not.
  edge:
    driver: bridge
  # Only the backend and the opt-in local-egress gate join this network.
  host-gate:
    internal: true
  # Only the local-egress gate joins this outbound bridge; it exists only with the profile.
  egress:
    driver: bridge
