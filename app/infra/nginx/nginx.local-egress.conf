# Local egress gate of the `local-egress` Compose profile
# (specs/application-foundation/PRDs/002-kubernetes-delivery Requirement 17, Decision 14).
#
# The backend reaches this gate under the model server's host name on the internal host-gate
# network. The gate forwards one port to one address and nothing else: the entrypoint replaces
# MODEL_PORT with LOCAL_EGRESS_MODEL_PORT and MODEL_ADDRESS with LOCAL_EGRESS_MODEL_ADDRESS (or
# this computer's IPv4 address) after checking both. It is a TCP relay, so TLS stays end to end.
worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr notice;

events {
  worker_connections 256;
}

stream {
  proxy_connect_timeout 10s;
  # Longer than the longest chat read (timeout_seconds is at most 3600 s), so a slow,
  # non-streaming model answer is not cut by the gate.
  proxy_timeout 65m;

  server {
    listen MODEL_PORT;
    proxy_pass MODEL_ADDRESS:MODEL_PORT;
  }

  # The dictionary source (data-dictionary/PRDs/011-dictionary-sync): the backend reaches SQL Server
  # on this computer as dwh-source:1433. The entrypoint replaces the loopback address below with
  # this computer's IPv4 address.
  server {
    listen 1433;
    proxy_pass 127.0.0.1:14333;
  }
}
