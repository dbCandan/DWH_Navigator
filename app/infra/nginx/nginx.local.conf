map $http_upgrade $kt_websocket_upgrade {
  default "";
  ~*^websocket$ websocket;
}

map $kt_websocket_upgrade $kt_connection_upgrade {
  default close;
  websocket upgrade;
}

server {
  listen 8080;
  server_name _;
  client_max_body_size 4m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /openapi.json {
    proxy_pass http://backend:8000/openapi.json;
    proxy_set_header Host $host;
  }

  location / {
    proxy_pass http://frontend:3000;
    # Upgrade is reduced to the literal websocket token by the maps above; arbitrary h2c is dropped.
    proxy_http_version 1.1; # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
    proxy_set_header Host $host;
    proxy_set_header Upgrade $kt_websocket_upgrade;
    proxy_set_header Connection $kt_connection_upgrade;
  }
}
