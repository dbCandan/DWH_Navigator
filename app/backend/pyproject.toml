[project]
name = "dwhnavigator-backend"
version = "0.1.0"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["app"]

[tool.mypy]
python_version = "3.12"
packages = ["app"]
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["jwt.*", "pwdlib.*", "yaml.*", "openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = "-ra"
markers = [
  "unit: hermetic tests with no external service",
  "integration: tests against a disposable PostgreSQL database",
]
