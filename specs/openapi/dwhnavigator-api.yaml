{
  "components": {
    "schemas": {
      "AuthenticatedUser": {
        "properties": {
          "is_super_admin": {
            "default": false,
            "type": "boolean"
          },
          "permissions": {
            "items": {
              "type": "string"
            },
            "type": "array"
          },
          "public_id": {
            "format": "uuid",
            "type": "string"
          },
          "roles": {
            "items": {
              "type": "string"
            },
            "type": "array"
          },
          "tenant_id": {
            "format": "uuid",
            "type": "string"
          },
          "username": {
            "type": "string"
          }
        },
        "required": [
          "public_id",
          "username",
          "tenant_id"
        ],
        "type": "object"
      },
      "HTTPValidationError": {
        "properties": {
          "detail": {
            "items": {
              "$ref": "#/components/schemas/ValidationError"
            },
            "type": "array"
          }
        },
        "type": "object"
      },
      "LoginRequest": {
        "properties": {
          "password": {
            "format": "password",
            "maxLength": 128,
            "type": "string",
            "writeOnly": true
          },
          "username": {
            "maxLength": 320,
            "minLength": 1,
            "type": "string"
          }
        },
        "required": [
          "username",
          "password"
        ],
        "type": "object"
      },
      "LoginResponse": {
        "properties": {
          "access_token": {
            "type": "string"
          },
          "token_type": {
            "const": "bearer",
            "default": "bearer",
            "type": "string"
          },
          "user": {
            "$ref": "#/components/schemas/AuthenticatedUser"
          }
        },
        "required": [
          "access_token",
          "user"
        ],
        "type": "object"
      },
      "ValidationError": {
        "properties": {
          "ctx": {
            "type": "object"
          },
          "input": {},
          "loc": {
            "items": {
              "anyOf": [
                {
                  "type": "string"
                },
                {
                  "type": "integer"
                }
              ]
            },
            "type": "array"
          },
          "msg": {
            "type": "string"
          },
          "type": {
            "type": "string"
          }
        },
        "required": [
          "loc",
          "msg",
          "type"
        ],
        "type": "object"
      }
    },
    "securitySchemes": {
      "HTTPBearer": {
        "scheme": "bearer",
        "type": "http"
      },
      "tenant": {
        "in": "header",
        "name": "x-tenant-id",
        "type": "apiKey"
      }
    }
  },
  "info": {
    "description": "Platform API for dwhnavigator",
    "title": "DWH Navigator",
    "version": "0.1.0"
  },
  "openapi": "3.1.0",
  "paths": {
    "/api/dwhnavigator/v1/auth/login": {
      "post": {
        "description": "Authenticate by username or email and issue a signed access token.",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/LoginRequest"
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/LoginResponse"
                }
              }
            },
            "description": "Successful Response"
          },
          "422": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            },
            "description": "Validation Error"
          }
        },
        "summary": "Login",
        "tags": [
          "authentication"
        ]
      }
    },
    "/api/dwhnavigator/v1/auth/me": {
      "get": {
        "description": "Return the active user and tenant after authoritative token validation.",
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AuthenticatedUser"
                }
              }
            },
            "description": "Successful Response"
          }
        },
        "security": [
          {
            "HTTPBearer": [],
            "tenant": []
          }
        ],
        "summary": "Me",
        "tags": [
          "authentication"
        ]
      }
    },
    "/api/dwhnavigator/v1/liveness": {
      "get": {
        "description": "The process can serve requests.",
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "additionalProperties": {
                    "type": "string"
                  },
                  "type": "object"
                }
              }
            },
            "description": "Successful Response"
          }
        },
        "summary": "Liveness",
        "tags": [
          "health"
        ]
      }
    },
    "/api/dwhnavigator/v1/readiness": {
      "get": {
        "description": "Return 503 until the runtime role connects and the schema reaches the image's head.",
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {}
              }
            },
            "description": "Successful Response"
          }
        },
        "summary": "Readiness",
        "tags": [
          "health"
        ]
      }
    }
  }
}
