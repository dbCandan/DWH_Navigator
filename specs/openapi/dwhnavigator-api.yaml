{
  "components": {
    "schemas": {
      "ActiveChange": {
        "properties": {
          "active": {
            "type": "boolean"
          }
        },
        "required": [
          "active"
        ],
        "type": "object"
      },
      "AuthenticatedUser": {
        "properties": {
          "display_name": {
            "type": "string"
          },
          "is_super_admin": {
            "default": false,
            "type": "boolean"
          },
          "permissions": {
            "items": {
              "type": "string"
            },
            "type": "array"
          },
          "public_id": {
            "format": "uuid",
            "type": "string"
          },
          "role": {
            "anyOf": [
              {
                "enum": [
                  "kullanici",
                  "yonetici",
                  "super_admin"
                ],
                "type": "string"
              },
              {
                "type": "null"
              }
            ]
          },
          "roles": {
            "items": {
              "type": "string"
            },
            "type": "array"
          },
          "tenant_id": {
            "format": "uuid",
            "type": "string"
          },
          "username": {
            "type": "string"
          }
        },
        "required": [
          "public_id",
          "username",
          "display_name",
          "tenant_id"
        ],
        "type": "object"
      },
      "ErrorDetail": {
        "properties": {
          "code": {
            "type": "string"
          },
          "message": {
            "type": "string"
          }
        },
        "required": [
          "code",
          "message"
        ],
        "type": "object"
      },
      "ErrorResponse": {
        "properties": {
          "detail": {
            "$ref": "#/components/schemas/ErrorDetail"
          }
        },
        "required": [
          "detail"
        ],
        "type": "object"
      },
      "LoginRequest": {
        "properties": {
          "password": {
            "format": "password",
            "maxLength": 128,
            "type": "string",
            "writeOnly": true
          },
          "username": {
            "maxLength": 64,
            "minLength": 1,
            "type": "string"
          }
        },
        "required": [
          "username",
          "password"
        ],
        "type": "object"
      },
      "LoginResponse": {
        "properties": {
          "access_token": {
            "type": "string"
          },
          "expires_in": {
            "description": "Access-token lifetime in seconds.",
            "type": "integer"
          },
          "token_type": {
            "const": "bearer",
            "default": "bearer",
            "type": "string"
          },
          "user": {
            "$ref": "#/components/schemas/AuthenticatedUser"
          }
        },
        "required": [
          "access_token",
          "expires_in",
          "user"
        ],
        "type": "object"
      },
      "OneTimePassword": {
        "description": "Shown once in this response; no endpoint can read it again.",
        "properties": {
          "one_time_password": {
            "type": "string"
          },
          "one_time_password_expires_at": {
            "format": "date-time",
            "type": "string"
          }
        },
        "required": [
          "one_time_password",
          "one_time_password_expires_at"
        ],
        "type": "object"
      },
      "PasswordChangeRequest": {
        "properties": {
          "current_password": {
            "format": "password",
            "maxLength": 128,
            "type": "string",
            "writeOnly": true
          },
          "new_password": {
            "format": "password",
            "maxLength": 1024,
            "type": "string",
            "writeOnly": true
          },
          "username": {
            "maxLength": 64,
            "minLength": 1,
            "type": "string"
          }
        },
        "required": [
          "username",
          "current_password",
          "new_password"
        ],
        "type": "object"
      },
      "RoleChange": {
        "properties": {
          "role": {
            "enum": [
              "kullanici",
              "yonetici"
            ],
            "type": "string"
          }
        },
        "required": [
          "role"
        ],
        "type": "object"
      },
      "UserCreateRequest": {
        "properties": {
          "display_name": {
            "type": "string"
          },
          "role": {
            "enum": [
              "kullanici",
              "yonetici"
            ],
            "type": "string"
          },
          "username": {
            "type": "string"
          }
        },
        "required": [
          "username",
          "display_name",
          "role"
        ],
        "type": "object"
      },
      "UserCreated": {
        "properties": {
          "one_time_password": {
            "type": "string"
          },
          "one_time_password_expires_at": {
            "format": "date-time",
            "type": "string"
          },
          "user": {
            "$ref": "#/components/schemas/UserSummary"
          }
        },
        "required": [
          "one_time_password",
          "one_time_password_expires_at",
          "user"
        ],
        "type": "object"
      },
      "UserPage": {
        "properties": {
          "items": {
            "items": {
              "$ref": "#/components/schemas/UserSummary"
            },
            "type": "array"
          },
          "page": {
            "type": "integer"
          },
          "size": {
            "type": "integer"
          },
          "total": {
            "type": "integer"
          }
        },
        "required": [
          "items",
          "page",
          "size",
          "total"
        ],
        "type": "object"
      },
      "UserSummary": {
        "properties": {
          "active": {
            "type": "boolean"
          },
          "created_at": {
            "format": "date-time",
            "type": "string"
          },
          "display_name": {
            "type": "string"
          },
          "last_login_at": {
            "anyOf": [
              {
                "format": "date-time",
                "type": "string"
              },
              {
                "type": "null"
              }
            ]
          },
          "password_change_required": {
            "type": "boolean"
          },
          "public_id": {
            "format": "uuid",
            "type": "string"
          },
          "role": {
            "anyOf": [
              {
                "enum": [
                  "kullanici",
                  "yonetici",
                  "super_admin"
                ],
                "type": "string"
              },
              {
                "type": "null"
              }
            ]
          },
          "username": {
            "type": "string"
          }
        },
        "required": [
          "public_id",
          "username",
          "display_name",
          "role",
          "active",
          "password_change_required",
          "last_login_at",
          "created_at"
        ],
        "type": "object"
      }
    },
    "securitySchemes": {
      "HTTPBearer": {
        "scheme": "bearer",
        "type": "http"
      },
      "tenant": {
        "in": "header",
        "name": "x-tenant-id",
        "type": "apiKey"
      }
    }
  },
  "info": {
    "description": "Platform API for dwhnavigator",
    "title": "DWH Navigator",
    "version": "0.1.0"
  },
  "openapi": "3.1.0",
  "paths": {
    "/api/dwhnavigator/v1/admin/users": {
      "get": {
        "description": "List the accounts ordered by username; ``q`` searches username and display name.",
        "parameters": [
          {
            "in": "query",
            "name": "page",
            "required": false,
            "schema": {
              "default": 1,
              "minimum": 1,
              "type": "integer"
            }
          },
          {
            "in": "query",
            "name": "size",
            "required": false,
            "schema": {
              "default": 50,
              "maximum": 100,
              "minimum": 1,
              "type": "integer"
            }
          },
          {
            "in": "query",
            "name": "q",
            "required": false,
            "schema": {
              "anyOf": [
                {
                  "maxLength": 128,
                  "type": "string"
                },
                {
                  "type": "null"
                }
              ]
            }
          }
        ],
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/UserPage"
                }
              }
            },
            "description": "Successful Response"
          },
          "401": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            },
            "description": "not_authenticated: oturum yok"
          },
          "403": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            },
            "description": "forbidden: s\u00fcper y\u00f6netici de\u011fil; cross_site_request: istek ba\u015fka bir siteden geldi"
          },
          "422": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            },
            "description": "invalid_request: istek de\u011ferleri ge\u00e7ersiz"
          }
        },
        "security": [
          {
            "HTTPBearer": [],
            "tenant": []
          }
        ],
        "summary": "List Users",
        "tags": [
          "user-administration"
        ]
      },
      "post": {
        "description": "Open an account; the one-time password appears only in this response.",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/UserCreateRequest"
              }
            }
          },
          "required": true
        },
        "responses": {
          "201": {
