# Golden set — HANDOVER §13.3 ve Ek A.
# KURAL: Mevcut maddeler silinmez, yalnızca eklenir.
#
# expected_objects: Bu talebe doğru cevap sayılan tablolar (herhangi biri yeterli).
# primary_object:   Tam sözlükte 1. sırada beklenen tablo (MRR ve recall@1 için).

- id: q001
  query: >-
    Müşterilerin risk bilgilerini aylık bazda ve kırılımlı olarak
    (kredi kartı, gayrimenkul, ihtiyaç kredisi vb.) gösteren bir tablo mevcut mudur?
  mode: ask
  primary_object: EDWDM.MDL.vPRCArrayAllotment
  expected_objects:
    - EDWDM.MDL.vPRCArrayAllotment
    - EDWDM.MDL.vPRCArrayCard
    - EDWDM.IDM.vKKBGGCI
    - EDWDM.CON.vProjectRisk
    - EDWDM.CON.vProductRiskInfo
  expected_columns:
    - EDWDM.MDL.vPRCArrayAllotment.ConsumerBalance
    - EDWDM.MDL.vPRCArrayAllotment.HousingFinanceBalance
    - EDWDM.MDL.vPRCArrayAllotment.Period
  notes: >-
    Kredi kartı kırılımı vPRCArrayAllotment'ta yok; vPRCArrayCard ile
    CustomerPartyId + Period üzerinden birleştirilmeli. vProjectRisk ve
    vProductRiskInfo, vPRC* hariç tutulan kapsamda öne çıkan cevaplardır.
  source: manuel-analiz-2026-09

- id: q002
  query: "Kredi kartı limit doluluk oranı verisine ihtiyacımız var, nerede?"
  mode: ask
  primary_object: EDWDM.MDL.vPRCCard
  expected_objects:
    - EDWDM.MDL.vPRCCard
    - EDWDM.CMP.vCardLimitFullness
    - EDWDM.MDL.vPRCArrayCard
  expected_columns:
    - EDWDM.MDL.vPRCCard.CreditCardLimitRate
    - EDWDM.CMP.vCardLimitFullness.CardLimitFullnessToday
    - EDWDM.MDL.vPRCArrayCard.CreditCardLimitRate
  traps:
    # not_lead: ilk 3 önerinin hiçbirinde lider (en güçlü) kolon olmamalı.
    # caveat:   listelenebilir ama mutlaka kısıt notu taşımalı.
    - column: EDWDM.CON.vCreditCardLimit.CardLimitRatio
      rule: not_lead
    - column: EDWDM.CMP.vCardLimitFullness.TotalLimitFullness
      rule: caveat
  notes: >-
    vCreditCardLimit.CardLimitRatio doluluk oranı DEĞİLDİR (referans değere oran).
    vCardLimitFullness.TotalLimitFullness kart değil tüm limitleri kapsar.
  source: manuel-analiz-2026-09

- id: q003
  query: >-
    Müşteri bazında aylık para transferi özeti: transfer tipi, transfer adedi,
    toplam transfer tutarı TL, işlem yapılan farklı kişi sayısı, farklı banka sayısı,
    kendi hesabına transfer adedi ve tutarı
  mode: ask
  primary_object: EDWDM.TRX.vCustomerMoneyTransferSummary
  expected_objects:
    - EDWDM.TRX.vCustomerMoneyTransferSummary
    - EDWDM.MDL.vPRCArrayMoneyTransfer
    - EDWDM.TRX.vFASTOutgoing
  expected_columns:
    - EDWDM.TRX.vCustomerMoneyTransferSummary.Period
    - EDWDM.TRX.vCustomerMoneyTransferSummary.VirmanIntrabankMoneyTransferAmountTL
  notes: >-
    Aslen 10 alanlık hedef tablo talebi (batch modu, M5). M1'de tek soru olarak
    özetlenmiş hali ile test edilir. Alan bazlı beklentiler batch golden setine taşınacak.
  source: manuel-analiz-2026-09

# --------------------------------------------------------------------------------------
# Ek A'nın geri kalanı (2026-09-26): kapsam varyantı ve alan bazlı hedef tablo talebi.
# --------------------------------------------------------------------------------------

- id: q001-kapsam
  query: >-
    Müşterilerin risk bilgilerini aylık bazda ve kırılımlı olarak
    (kredi kartı, gayrimenkul, ihtiyaç kredisi vb.) gösteren bir tablo mevcut mudur?
  mode: ask
  # ADR-001: uygulamada filtre yoktur. Değerlendirme, vPRC* objeleri çıkarılmış ayrı bir
  # sözlük dosyasını simüle eder (iş biriminin istediği kapsam).
  scope:
    exclude_object_prefix: vPRC
  primary_object: EDWDM.CON.vProjectRisk
  expected_objects:
    - EDWDM.CON.vProjectRisk
    - EDWDM.CON.vProductRiskInfo
    - EDWDM.IDM.vKKBGGCI
  expected_columns:
    - EDWDM.CON.vProjectRisk.DataDate
    - EDWDM.CON.vProjectRisk.ProductName
    - EDWDM.CON.vProjectRisk.RiskAmountTL
  notes: Ek A.1 — aynı talep, vPRC* hariç tutulduğunda.
  source: manuel-analiz-2026-09

- id: b001
  mode: batch
  # Alan metinleri iş biriminin gerçek talep dosyasından (QuestionList-1). Beklenen
  # cevaplar yalnız Ek A.3'te doğrulanmış 10 alan için var; yeni alanlar eklenmedi.
  context: Müşteri bazında aylık para transferi özeti
  notes: >-
    Ek A.3 — 10 alanlık hedef tablo talebi. Genel sonuç: kısmen var; çekirdek
    vCustomerMoneyTransferSummary (müşteri + periyot bazında hazır). Kişi/banka sayıları
    vFASTOutgoing'den DISTINCT ile türetilmeli. CustomerId için ADR-009 gereği özet
    tablodaki müşteri anahtarları da kabul edilir.
  source: manuel-analiz-2026-09
  fields:
    - name: CustomerId
      tr: "CustomerId"
      description: "Müşteri numarası"
      status: Hazır
      expected_objects: [EDWDM.MDL.vPRCArrayMoneyTransfer, EDWDM.TRX.vCustomerMoneyTransferSummary]
      expected_columns:
        - EDWDM.MDL.vPRCArrayMoneyTransfer.CustomerId
        - EDWDM.TRX.vCustomerMoneyTransferSummary.CustomerPartyId
        - EDWDM.TRX.vCustomerMoneyTransferSummary.AccountNumber
    - name: TransferType
      tr: "Tür"
      description: "Gelen/giden transfer türünü belirtir."
      status: Kısmen hazır
      expected_objects: [EDWDM.TRX.vCustomerMoneyTransferSummary]
    - name: Period
      tr: "Period"
      description: "Ay, yıl örn: 202604"
      status: Hazır
      expected_objects: [EDWDM.TRX.vCustomerMoneyTransferSummary]
      expected_columns: [EDWDM.TRX.vCustomerMoneyTransferSummary.Period]
    - name: TransferCount
      tr: "Transfer Sayısı"
      description: "Para transferi sayısıdır"
      status: Hazır
      expected_objects: [EDWDM.TRX.vCustomerMoneyTransferSummary]
    - name: TotalTransferAmountTL
      tr: "Transfer Toplamı TL"
      description: "Para transferi miktarının ilgili güne göre TL cinsinden toplamı"
      status: Hazır
      expected_objects: [EDWDM.TRX.vCustomerMoneyTransferSummary]
    - name: DistinctTransactionPersonCount
      tr: "Farklı Alıcı Sayısı"
      description: "Gelen/giden farklı alıcı sayısı"
      status: Türetilmeli
      expected_objects: [EDWDM.TRX.vFASTOutgoing]
      expected_columns: [EDWDM.TRX.vFASTOutgoing.ReceiverIdentityNumber]
    - name: DistinctBankCount
      tr: "Farklı Banka Sayısı"
      description: "Gönderilen farklı banka sayısı"
      status: Türetilmeli
      expected_objects: [EDWDM.TRX.vFASTOutgoing]
      expected_columns: [EDWDM.TRX.vFASTOutgoing.ReceiverBankName]
    - name: OwnAccountTransferCount
      tr: "Kendi Hesabına Para Transferi Sayısı"
      description: "Kendi hesabına gönderilen  para transferi sayısı"
      status: Kısmen hazır
      expected_objects: [EDWDM.TRX.vFASTOutgoing, EDWDM.TRX.vCustomerMoneyTransferSummary]
    - name: OwnAccountTransferDistinctBankCount
      tr: "Kendi Hesabı Transfer Farklı Banka Sayısı"
      description: "Kişinin kendi hesabına gönderdiği para transferlerinin farklı banka sayısı"
      status: Türetilmeli
      expected_objects: [EDWDM.TRX.vFASTOutgoing]
    - name: OwnAccountTotalAmountTL
      tr: "Kendi Hesabına Para Transfer Toplamı TL"
      description: "Kendi hesabına gönderilen para transferleri miktarının ilgili güne göre TL cinsinden toplamı"
      status: Kısmen hazır
      expected_objects: [EDWDM.TRX.vCustomerMoneyTransferSummary]
      expected_columns:
        - EDWDM.TRX.vCustomerMoneyTransferSummary.VirmanIntrabankMoneyTransferAmountTL
    # Talep dosyasındaki diğer alanlar — doğrulanmış beklenen cevap yok, metriğe girmez;
    # çekirdek tablo analizi talebin tamamına baktığı için listede durmaları gerekir.
    - name: TransferMethod
      tr: "Para Transferi Türü"
      description: "Havale/FAST/EFT/SWIFT/Global Para Transferi/Moneygram türlerini belirtir."
    - name: FEC
      tr: "FEC"
      description: "Dolar, euro, altın vs Fec türünü belirtir."
    - name: TotalTransferAmountOriginal
      tr: "Transfer Toplamı Original Amount"
      description: "Para transferi miktarının ilgili fec cinsinde toplamıdır"
    - name: OwnAccountTotalAmountOriginal
      tr: "Kendi Hesabına Para Transfer Toplamı Original Amount"
      description: "Kendi hesabına gönderilen para transferlerinin kendi cinsinden toplamı"
