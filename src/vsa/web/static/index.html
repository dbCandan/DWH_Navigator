<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DWH Navigator</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%231F3864'/%3E%3Cpath d='M16 5l4 11-4 11-4-11z' fill='%23F2B84B'/%3E%3C/svg%3E">
<style>
:root {
  color-scheme: dark;
  --paper: #03040b; --surface: rgba(14, 18, 40, .58); --surface-2: rgba(130, 150, 255, .09);
  --line: rgba(140, 165, 255, .2); --text: #eef1ff; --muted: #a3acd6; --faint: #6f78a3;
  --ink: #ffffff; --ink-2: #8b5cff; --accent: #7cf4ff; --accent-soft: rgba(124, 244, 255, .13);
  --high: #3dfcb4; --high-bg: rgba(61, 252, 180, .13); --mid: #ffd166; --mid-bg: rgba(255, 209, 102, .13);
  --low: #ff5d8f; --low-bg: rgba(255, 93, 143, .14); --derive: #ff9f5a; --derive-bg: rgba(255, 159, 90, .14);
  --shadow: 0 0 0 1px rgba(124, 244, 255, .05), 0 24px 70px rgba(0, 0, 0, .55);
  --radius: 20px;
  --glow: 0 0 24px rgba(124, 244, 255, .35), 0 0 60px rgba(139, 92, 255, .25);
  --grad: linear-gradient(120deg, #7cf4ff 0%, #8b5cff 45%, #ff5dd6 75%, #7cf4ff 100%);
  --mono: "Cascadia Code", "Cascadia Mono", Consolas, "SFMono-Regular", Menlo, monospace;
  --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --display: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper); color: var(--text); font: 15px/1.55 var(--sans);
  -webkit-font-smoothing: antialiased;
  /* app shell: exactly one screen tall until the content needs more */
  min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column;
}
body > main { flex: 1 0 auto; width: 100%; display: flex; flex-direction: column; }
body > main > section { flex: 1 0 auto; }
#tab-ask { display: flex; flex-direction: column; }
button, input, textarea { font: inherit; color: inherit; }
a { color: inherit; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px; }

/* ---------- top bar ---------- */
header.top {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--paper) 86%, transparent);
  backdrop-filter: blur(10px); border-bottom: 1px solid var(--line);
}
header.top .wrap { display: flex; align-items: center; gap: 14px; height: 60px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); }
.brand b { font-size: 17px; letter-spacing: .2px; }
.brand > div { display: flex; flex-direction: column; line-height: 1.2; }
.brand span { color: var(--muted); font-size: 12px; letter-spacing: .2px; white-space: nowrap; }
.status { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: nowrap; min-width: 0; }
.pill {
  display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted);
  border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; background: var(--surface);
  white-space: nowrap;
}
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.dot.on { background: var(--high); box-shadow: 0 0 0 3px var(--high-bg); }
.icon-btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 9px; width: 34px; height: 34px;
  cursor: pointer; display: grid; place-items: center; text-decoration: none; color: inherit; flex: none;
}

/* ---------- hero / search ---------- */
.hero { padding: 54px 0 22px; text-align: center; transition: padding .35s ease; }
/* landing: the hero fills the free screen height and centres the title and search bar */
#hero:not(.compact) { flex: 1 0 auto; display: flex; flex-direction: column; justify-content: center;
  /* +8vh at the bottom: the optical centre sits a little above the geometric one */
  padding: calc(24px + var(--shift-top, 0px)) 0 calc(24px + 8vh + var(--shift-bottom, 0px)); transition: none; }
#hero > .searchbox { width: 100%; }
.hero h1 {
  font-family: var(--display); font-size: clamp(26px, min(4vw, 6vh), 40px); line-height: 1.15; font-weight: 700;
  margin: 0 0 28px; letter-spacing: -.8px; color: var(--ink);
}
.hero.compact h1 { display: none; }
.searchbox {
  display: flex; align-items: flex-end; gap: 10px; background: var(--surface); border: 1px solid var(--line);
  border-radius: 18px; padding: 10px 10px 10px 18px; box-shadow: var(--shadow); max-width: 860px; margin: 0 auto;
  transition: border-color .2s, box-shadow .2s;
}
.searchbox:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft), var(--shadow); }
.searchbox textarea {
  flex: 1; border: 0; outline: 0; resize: none; background: transparent; font-size: 17px;
  min-height: 30px; max-height: 180px; padding: 6px 0;
}
.primary {
  border: 0; border-radius: 12px; padding: 10px 18px; cursor: pointer; font-weight: 700;
  background: var(--ink-2); color: #fff; display: inline-flex; gap: 8px; align-items: center;
}
.primary:disabled { opacity: .55; cursor: wait; }
.ghost {
  border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 12px;
  cursor: pointer; font-size: 13px; font-weight: 600; display: inline-flex; gap: 6px; align-items: center;
}
.ghost:hover, .icon-btn:hover { border-color: var(--accent); }

.loader { display: none; text-align: center; padding: 40px 0 10px; color: var(--muted); }
.loader.on { display: block; }
.loader .stage { margin-top: 10px; font-weight: 600; color: var(--text); min-height: 24px; }
.loader .sub { font-size: 13px; }

/* ---------- results ---------- */
main { padding-bottom: 0; }
#ask-out:not(:empty) { padding-bottom: 30px; }
.verdict {
  display: grid; grid-template-columns: auto 1fr auto; gap: 18px; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 18px 20px; box-shadow: var(--shadow); margin: 22px 0 14px; position: relative; overflow: hidden;
}
.verdict::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 6px; background: var(--vc, var(--faint)); }
.verdict .word { font-family: var(--display); font-weight: 800; font-size: 22px; color: var(--vc); letter-spacing: .5px; padding-left: 6px; white-space: nowrap; }
.verdict .summary { font-size: 15px; }
.verdict .meta { font-size: 12px; color: var(--faint); margin-top: 4px; }
.v-VAR { --vc: var(--high); } .v-KISMEN { --vc: var(--mid); } .v-BULUNAMADI { --vc: var(--low); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip {
  font-size: 12px; border-radius: 999px; padding: 2px 9px; border: 1px solid var(--line);
  background: var(--surface-2); color: var(--muted); white-space: nowrap;
}
.chip b { color: var(--text); font-weight: 600; }
.chip.k-zaman { border-color: #6d8fd6; } .chip.k-kirilim { border-color: #a07ad6; }
.chip.k-olcu { border-color: #d6a86d; } .chip.k-deger { border-color: #7abfb0; }
.chip.on { background: var(--high-bg); color: var(--high); border-color: transparent; }
.chip.off { text-decoration: line-through; opacity: .7; }
.chip.long { background: var(--mid-bg); color: var(--mid); border-color: transparent; }

.panel {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px 18px; margin: 12px 0; box-shadow: var(--shadow);
}
.panel h3 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); }
.clarify li { margin: 4px 0; }
.clarify { border-left: 4px solid var(--accent); }

.reason { margin: 10px 0 6px; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.verdict > div { min-width: 0; }
.reason, .caveats, .usage, .verdict .summary, .detail, table.notes td { overflow-wrap: anywhere; }
.caveats { margin: 8px 0; padding: 8px 12px; border-radius: 10px; background: var(--mid-bg); font-size: 13.5px; }
.caveats div + div { margin-top: 3px; }
.usage { font-size: 13px; color: var(--muted); }
.bars { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px 14px; margin: 10px 0; }
.bar { font-size: 11.5px; color: var(--muted); }
.bar .track { height: 5px; background: var(--surface-2); border-radius: 3px; overflow: hidden; margin-top: 3px; }
.bar .fill { height: 100%; background: var(--ink-2); border-radius: 3px; transition: width .6s ease; }
.bar.llm .fill { background: #7a5cd6; }

.cols { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.col {
  border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 3px 9px;
  font-family: var(--mono); font-size: 12.5px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center;
}
.col:hover, .col[aria-expanded="true"] { border-color: var(--accent); }
.col { max-width: 100%; text-align: left; flex-wrap: wrap; }
.col .role { white-space: nowrap; }
.col .role { font-family: var(--sans); font-size: 10.5px; color: var(--faint); text-transform: uppercase; letter-spacing: .5px; }
.col .flag { color: var(--low); }
.detail {
  margin-top: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
  background: var(--surface-2); font-size: 13.5px; display: none;
}
.detail.on { display: block; animation: rise .2s ease both; }
.detail .k { font-family: var(--mono); font-weight: 700; }
.detail .syn { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
.detail .sig { font-size: 12px; color: var(--high); margin-top: 4px; }
.card-foot { display: flex; gap: 8px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
.vote { border: 1px solid var(--line); background: none; border-radius: 8px; padding: 3px 9px; cursor: pointer; font-size: 13px; }
.vote.done { background: var(--high-bg); border-color: transparent; }
.vote.done.down { background: var(--low-bg); }
.muted { color: var(--muted); } .faint { color: var(--faint); font-size: 12px; }

details.more { margin: 14px 0; }
details.more summary { cursor: pointer; color: var(--muted); font-weight: 600; }
table.notes { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.notes td { border-top: 1px solid var(--line); padding: 7px 8px; vertical-align: top; }
table.notes td:first-child { white-space: nowrap; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }

.empty { text-align: center; color: var(--muted); padding: 40px 10px; }
.error { background: var(--low-bg); color: var(--low); border-radius: 12px; padding: 12px 16px; margin: 18px 0; }

/* ---------- ask results: one calm column, the answer first ---------- */
#ask-out { max-width: 860px; width: 100%; margin: 0 auto; }
.answer { margin: 28px 0 20px; }
.answer-top { display: flex; align-items: center; gap: 10px; }
.vbadge {
  flex: none; font-size: 11.5px; font-weight: 700; letter-spacing: .8px; padding: 3px 10px; border-radius: 999px;
  color: var(--vc); background: color-mix(in srgb, var(--vc) 14%, transparent);
}
.answer-q { flex: 1; min-width: 0; color: var(--muted); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.answer-top .dl { flex: none; font-size: 13px; font-weight: 600; color: var(--muted); text-decoration: none; }
.answer-top .dl:hover { color: var(--text); }
.answer-sum { font: 600 20px/1.4 var(--display); letter-spacing: -.2px; margin: 12px 0 0; overflow-wrap: anywhere; }
.ask-hints { margin: 14px 0 0; padding-left: 14px; border-left: 2px solid var(--accent); color: var(--muted); font-size: 14px; }
.ask-hints div + div { margin-top: 4px; }
.res {
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px 10px; margin: 12px 0;
  animation: rise .3s ease both; animation-delay: calc(var(--i, 0) * 50ms);
}
.res-head { display: flex; align-items: flex-start; gap: 16px; }
.res-title { flex: 1; min-width: 0; }
.res h2 { margin: 0; font: 600 17px/1.3 var(--display); overflow-wrap: anywhere; }
.res-path { font-size: 12.5px; color: var(--faint); margin-top: 2px; }
.res-path code { font-family: var(--mono); font-size: 12px; }
.score { flex: none; text-align: right; line-height: 1.1; }
.score b { display: block; font: 700 22px var(--display); color: var(--lc); }
.score span { font-size: 11.5px; color: var(--muted); }
.lc-Yüksek { --lc: var(--high); } .lc-Orta { --lc: var(--mid); } .lc-Düşük { --lc: var(--low); }
.res-reason { margin: 10px 0 0; overflow-wrap: anywhere; }
.res-warn { margin: 8px 0 0; font-size: 13.5px; color: var(--mid); overflow-wrap: anywhere; }
.res .cols { margin-top: 12px; }
.res .col { background: transparent; }
.col.more { font-family: var(--sans); color: var(--muted); }
.res-foot { display: flex; align-items: flex-start; gap: 4px; margin-top: 12px; padding-top: 8px; border-top: 1px solid var(--line); }
.res-foot details { flex: 1; min-width: 0; }
.res-foot details > :not(summary) { margin-top: 8px; }
.res-foot summary, .ask-more summary { cursor: pointer; color: var(--muted); font-size: 13px; font-weight: 600; list-style: none; padding: 3px 0; }
.res-foot summary::-webkit-details-marker, .ask-more summary::-webkit-details-marker { display: none; }
.res-foot summary::before, .ask-more summary::before { content: "▸"; display: inline-block; width: 1em; transition: transform .15s; }
.res-foot details[open] > summary::before, .ask-more[open] > summary::before { transform: rotate(90deg); }
.res-foot summary:hover, .ask-more summary:hover { color: var(--text); }
.res-foot .vote { border: 0; background: none; opacity: .5; padding: 3px 6px; }
.res-foot .vote:hover, .res-foot .vote.done { opacity: 1; }
.ask-more { margin: 16px 0; }
.ask-more > .inner { margin-top: 8px; font-size: 13.5px; }
.ask-more .res { margin: 8px 0; }
.ask-more .label { font-size: 12px; color: var(--faint); margin: 10px 0 4px; }
.ask-more .method { margin: 10px 0; padding-left: 18px; }

footer { color: var(--faint); font-size: 12px; text-align: center; padding: 18px 16px 22px; }
.hidden { display: none !important; }
kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; color: var(--muted); }

@media (max-width: 760px) {
  .status { display: none; }
  #settings { margin-left: auto; }
  header.top .wrap { column-gap: 8px; padding-left: 14px; padding-right: 14px; }
  table.notes td:first-child { white-space: normal; }
  .verdict { grid-template-columns: 1fr; }
  .answer-sum { font-size: 18px; }
}
@media (max-height: 760px) {
  footer { padding: 12px 16px 14px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* =====================================================================
   "Evren": the warehouse as a galaxy behind the page (ADR-024).
   ===================================================================== */

body { background: transparent; min-height: 100vh; }
html {
  background-attachment: fixed;
  background:
    radial-gradient(1200px 700px at 78% -10%, rgba(139, 92, 255, .22), transparent 60%),
    radial-gradient(900px 600px at -10% 110%, rgba(255, 93, 214, .14), transparent 60%),
    radial-gradient(700px 500px at 50% 50%, rgba(40, 60, 160, .18), transparent 70%),
    #03040b;
  background-attachment: fixed;
  overflow-x: hidden;
}
body::before {
  content: ""; position: fixed; inset: -20%; z-index: 0; pointer-events: none;
  background:
    radial-gradient(40% 30% at 30% 40%, rgba(124, 244, 255, .10), transparent 70%),
    radial-gradient(35% 25% at 70% 65%, rgba(255, 93, 214, .09), transparent 70%),
    radial-gradient(30% 30% at 55% 25%, rgba(139, 92, 255, .12), transparent 70%);
  filter: blur(30px); animation: nebula 38s ease-in-out infinite alternate;
}
@keyframes nebula { from { transform: translate3d(-3%, -2%, 0) rotate(0deg) scale(1); } to { transform: translate3d(3%, 2%, 0) rotate(8deg) scale(1.08); } }
#cosmos { display: block; position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }  /* 100vw would include the scrollbar and overflow */
header.top, main, footer { position: relative; z-index: 2; }

/* ---------- floating glass command bar ---------- */
header.top {
  position: sticky; top: 12px; z-index: 20; margin: 12px auto 0; max-width: 1440px; width: calc(100% - 24px);
  border: 1px solid var(--line); border-radius: 18px;
  background: rgba(8, 11, 28, .55); backdrop-filter: blur(18px) saturate(150%);
  box-shadow: 0 10px 40px rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255, 255, 255, .06);
}
header.top .wrap { max-width: none; }
.brand b { color: #fff; letter-spacing: .3px; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes shimmer { to { background-position: 300% 0; } }
.pill, .icon-btn, .ghost {
  background: rgba(20, 26, 56, .6); border-color: var(--line); color: var(--muted);
}
.dot.on { background: var(--high); box-shadow: 0 0 0 3px rgba(61, 252, 180, .15); }
.brand b { white-space: nowrap; }

/* ---------- hero ---------- */

/* ---------- docked search: after a question the bar folds into a round button ---------- */
.dock-btn { display: none; }
#hero.compact { padding: 0; min-height: var(--dock-space, 0px); }
#hero.compact .dock-btn {
  display: grid; place-items: center; position: fixed; z-index: 25; top: var(--dock-top, 76px); right: var(--dock-right, 20px);
  width: 52px; height: 52px; border-radius: 50%; border: 0; cursor: pointer; padding: 0;
  background: linear-gradient(135deg, #7cf4ff, #8b5cff); color: #050a18; box-shadow: 0 8px 26px rgba(0, 0, 0, .45);
  transition: transform .2s, opacity .2s;
  animation: dockIn .35s .22s cubic-bezier(.2,.8,.2,1) both;
}
#hero.compact .dock-btn:hover { transform: scale(1.08); }
#hero.compact.open .dock-btn { opacity: 0; transform: scale(.5); pointer-events: none; }
@keyframes dockIn { from { opacity: 0; transform: scale(.3) rotate(-60deg); } }
#hero.compact .searchbox {
  position: fixed; z-index: 26; top: var(--dock-top, 76px); right: var(--dock-right, 20px); margin: 0;
  width: var(--dock-width, min(860px, calc(100% - 40px)));
  transform-origin: calc(100% - 26px) 26px; transform: scale(.06); opacity: 0; visibility: hidden;
  transition: transform .3s cubic-bezier(.2,.8,.2,1), opacity .2s, visibility 0s .3s;
}
#hero.compact.open .searchbox {
  transform: none; opacity: 1; visibility: visible;
  transition: transform .3s cubic-bezier(.2,.8,.2,1), opacity .2s;
}
@media (max-width: 760px) { #hero { --dock-gap: 14px; } }
.hero h1 {
  font-size: clamp(30px, min(5vw, 7.5vh), 58px); letter-spacing: -1.2px; font-weight: 700; line-height: 1.08;
  margin: 0 0 24px; padding-bottom: .12em;  /* background-clip:text cuts descenders (g, y) outside the box */
  background: linear-gradient(120deg, #ffffff 30%, #c9d4ff 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}

/* ---------- search ---------- */
.searchbox {
  border: 1px solid rgba(140, 165, 255, .28); border-radius: 20px; padding: 12px 12px 12px 22px;
  background: rgba(8, 12, 30, .78); backdrop-filter: blur(16px); box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
}
.searchbox:focus-within { border-color: rgba(124, 244, 255, .6); box-shadow: 0 0 0 4px rgba(124, 244, 255, .1), 0 20px 60px rgba(0, 0, 0, .5); }
.searchbox textarea { font-size: 19px; color: #fff; }
.searchbox textarea::placeholder { color: #7880a8; }
.primary { background: linear-gradient(135deg, #7cf4ff, #8b5cff); color: #050a18; transition: filter .15s; }
.primary:hover { filter: brightness(1.1); }
.primary kbd { border-color: rgba(0, 0, 0, .3) !important; color: inherit; }

/* ---------- loader: stage text over the route voyage on the canvas ---------- */
.loader { padding: 70px 0 30px; }
.loader .stage {
  font-size: 18px; font-weight: 600; color: #fff;
}
.loader .sub { color: var(--muted); font-family: var(--mono); font-size: 12.5px; }

/* ---------- glass panels ---------- */
.panel, .res {
  background: rgba(12, 16, 38, .62); backdrop-filter: blur(16px) saturate(140%); border-color: var(--line);
}
.res h2, .answer-sum { color: #fff; }
.res { border-color: rgba(140, 165, 255, .16); }
/* results in focus: the galaxy steps back */
#cosmos, body::before { transition: opacity .6s; }
html.has-results #cosmos { opacity: .3; }
html.has-results body::before { opacity: .35; }
html.has-results #hud { opacity: 0; }
.l-Yüksek { color: var(--high); }
.l-Orta { color: var(--mid); } .l-Düşük { color: var(--low); }
.bar .fill { background: linear-gradient(90deg, #7cf4ff, #8b5cff); }
.bar.llm .fill { background: linear-gradient(90deg, #ff5dd6, #8b5cff); }
.col { border-color: rgba(140, 165, 255, .22); color: #dfe6ff; }
.col:hover, .col[aria-expanded="true"] { border-color: rgba(124, 244, 255, .6); }
.detail { background: rgba(6, 10, 26, .7); }
.caveats { background: rgba(255, 209, 102, .08); border: 1px solid rgba(255, 209, 102, .2); }
.chip { background: rgba(130, 150, 255, .08); }
.chip.on { background: rgba(61, 252, 180, .14); color: var(--high); }

/* ---------- verdict: a signal that powers on ---------- */
.verdict { animation: warpIn .7s cubic-bezier(.16, 1, .3, 1) both; }
.verdict::before { width: 4px; box-shadow: 0 0 22px var(--vc); }
.verdict .word {
  font-size: 30px; letter-spacing: 2px; text-shadow: 0 0 18px var(--vc), 0 0 42px var(--vc); animation: powerOn 1.1s steps(1, end) both;
}
@keyframes powerOn { 0% { opacity: 0; } 12% { opacity: 1; } 18% { opacity: .2; } 26% { opacity: 1; } 34% { opacity: .5; } 44%, 100% { opacity: 1; } }
.clarify { border-left: 0; box-shadow: inset 3px 0 0 var(--accent), var(--shadow); }

footer { color: var(--faint); text-align: right; padding-left: 240px; padding-right: 20px; }  /* HUD sits bottom-left */
@media (max-width: 760px) { footer { text-align: center; padding-left: 16px; padding-right: 16px; } }

/* ---------- HUD + star tooltip ---------- */
#hud {
  display: block; position: fixed; left: 16px; bottom: 14px; z-index: 1; pointer-events: none;
  font: 11px/1.5 var(--mono); letter-spacing: 1.4px; text-transform: uppercase; color: rgba(190, 205, 255, .6);
}
#hud b { color: #7cf4ff; font-weight: 700; }
#hud { transition: opacity .3s; }
html.scrolled #hud { opacity: 0; }
@media (max-width: 760px) {
  #hud { display: none; }  /* no room for the voyage log on phones */
  .searchbox textarea { font-size: 16.5px; }
  .searchbox { padding: 12px 12px 12px 16px; }
  .verdict .word { font-size: 24px; }
}
#hud .focus { color: #fff; letter-spacing: .6px; text-transform: none; font-size: 12px; margin-top: 2px; max-width: 46vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#star-tip {
  position: fixed; z-index: 30; pointer-events: none; padding: 8px 11px; border-radius: 12px;
  background: rgba(8, 12, 30, .9); border: 1px solid rgba(124, 244, 255, .4); box-shadow: var(--glow);
  font-size: 12.5px; color: #fff; transform: translate(14px, 14px); opacity: 0; transition: opacity .15s;
}
#star-tip { display: none; }
#star-tip.on { display: block; opacity: 1; }
#star-tip .t { font-family: var(--mono); font-weight: 700; }
#star-tip .g { color: #a3acd6; font-size: 11.5px; }
@media (prefers-reduced-motion: reduce) { body::before { animation: none !important; } }
</style>
</head>
<body>
<canvas id="cosmos" aria-hidden="true"></canvas>
<div id="hud" aria-hidden="true"><div><b>Veri evreni</b> · <span id="hud-count"></span></div><div class="focus" id="hud-focus"></div></div>
<div id="star-tip" role="tooltip"></div>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="#1F3864"/><circle cx="16" cy="16" r="10.5" fill="none" stroke="#F2B84B" stroke-opacity=".45"/><path d="M16 5l4 11-4 11-4-11z" fill="#F2B84B"/><path d="M16 16l4 0-4 11-4-11z" fill="#fff" fill-opacity=".85"/></svg>
      <div><b>DWH Navigator</b><span>Veri ambarı rehberi</span></div>
    </div>
    <div class="status" id="status"></div>
    <a class="icon-btn" id="settings" href="/ayarlar" target="_blank" rel="noopener" title="Ayarlar (yeni sekmede)" aria-label="Ayarlar">⚙</a>
  </div>
</header>

<main class="wrap">
  <section id="tab-ask">
    <div class="hero" id="hero">
      <h1>Hangi veriye ihtiyacınız var?</h1>
      <div class="searchbox">
        <textarea id="q" rows="1" placeholder="Örn. Kredi kartı limit doluluk oranı verisine ihtiyacımız var, nerede?" aria-label="Talep"></textarea>
        <button class="primary" id="go">Ara <kbd style="color:inherit;border-color:rgba(255,255,255,.35)">↵</kbd></button>
      </div>
      <button class="dock-btn" id="dock" type="button" aria-label="Yeni soru sor" aria-controls="q" aria-expanded="false" title="Yeni soru sor (/)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
      </button>
    </div>
    <div class="loader" id="loader">
      <div class="stage" id="stage">Sözlük taranıyor…</div>
      <div class="sub" id="stage-sub"></div>
    </div>
    <div id="ask-out"></div>
  </section>

</main>
<footer id="foot"></footer>

<script>
"use strict";
// ---------------------------------------------------------------- helpers
const $ = (s, r = document) => r.querySelector(s);
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "style") e.setAttribute("style", v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    e.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return e;
}
const pct = x => Math.round((x || 0) * 100);
// Long identifiers may wrap only at CamelCase / underscore boundaries.
const breakable = name => name.split(/(?<=[a-z0-9])(?=[A-Z])|(?<=_)/).flatMap((part, i) => i ? [h("wbr"), part] : [part]);
// replaceChildren() would print null/false as text; drop them first.
const put = (el, ...kids) => el.replaceChildren(...kids.flat().filter(k => k != null && k !== false));
async function api(path, opts = {}) {
  const r = await fetch(path, opts);
  const data = await r.json().catch(() => ({ error: "Beklenmeyen yanıt" }));
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
const levelColor = l => l === "Yüksek" ? "var(--high)" : l === "Orta" ? "var(--mid)" : "var(--low)";
const verdictClass = v => "v-" + (v || "").split(" ")[0];

// ---------------------------------------------------------------- status
let STATUS = null;
async function loadStatus() {
  try {
    STATUS = await api("/api/status");
    const s = STATUS;
    // One quiet indicator; the details live in its tooltip.
    const tip = [
      `Sözlük: ${s.columns.toLocaleString("tr-TR")} kolon · ${s.objects} tablo`,
      `Anlamsal arama: ${s.hybrid ? s.embedding_model || "açık" : "kapalı"}`,
      `LLM hakem: ${s.llm || "kapalı"}`,
    ].join("\n");
    $("#status").replaceChildren(h("span", { class: "pill", title: tip }, h("i", { class: "dot on" }), "Hazır"));
    $("#foot").textContent = s.updated ? "Sözlük güncelleme: " + new Date(s.updated + "T00:00").toLocaleDateString("tr-TR", { day: "numeric", month: "long", year: "numeric" }) : "";
    centreHero();
  } catch (e) {
    $("#status").replaceChildren(h("span", { class: "pill" }, "Sunucuya ulaşılamadı"));
  }
}

// ---------------------------------------------------------------- ask
const q = $("#q");
function autosize() {
  q.style.height = "auto";
  q.style.height = Math.min(q.scrollHeight, 180) + "px";
  q.style.overflowY = q.scrollHeight > 180 ? "auto" : "hidden";  // no scrollbar while it fits
}
q.addEventListener("input", autosize);
addEventListener("resize", () => requestAnimationFrame(autosize));
q.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(); } });
$("#go").onclick = ask;

let stageTimer = null;
function startStages(el, sub, stages) {
  let i = 0; el.textContent = stages[0][0]; sub.textContent = stages[0][1] || "";
  const t0 = Date.now();
  clearInterval(stageTimer);
  stageTimer = setInterval(() => {
    const s = (Date.now() - t0) / 1000;
    while (i + 1 < stages.length && s >= stages[i + 1][2]) i++;
    el.textContent = stages[i][0];
    sub.textContent = (stages[i][1] || "") + ` · ${Math.round(s)} sn`;
  }, 400);
}

// Header and footer differ in height; balance them so the landing block sits at the window's centre.
function centreHero() {
  const d = $("header.top").getBoundingClientRect().bottom - $("#foot").offsetHeight;
  hero.style.setProperty("--shift-top", Math.max(0, -d) + "px");
  hero.style.setProperty("--shift-bottom", Math.max(0, d) + "px");
}
addEventListener("resize", centreHero);

// ---------------------------------------------------------------- docked search
const hero = $("#hero"), dock = $("#dock"), searchbox = $("#hero .searchbox");
// The button lives in the free margin right of the content when there is one;
// otherwise it sits at the edge and the results start below it.
function dockMetrics() {
  const top = Math.round($("header.top").getBoundingClientRect().bottom) + 12;
  const gap = parseFloat(getComputedStyle(hero).getPropertyValue("--dock-gap")) || 20;
  const vw = document.documentElement.clientWidth;
  const margin = vw - $("main").getBoundingClientRect().right;
  const inGutter = margin >= 52 + 2 * gap;
  const right = inGutter ? Math.round(margin - 52 - gap) : gap;
  const width = Math.min(860, vw - right - gap);
  hero.style.setProperty("--dock-top", top + "px");
  hero.style.setProperty("--dock-right", right + "px");
  hero.style.setProperty("--dock-width", width + "px");
  hero.style.setProperty("--dock-space", inGutter ? "0px" : "64px");
  return { top, right, width, vw };
}
addEventListener("resize", () => { if (hero.classList.contains("compact")) dockMetrics(); });
function setSearchOpen(open) {
  hero.classList.toggle("open", open);
  dock.setAttribute("aria-expanded", open);
  if (open) { dockMetrics(); requestAnimationFrame(() => { autosize(); q.focus(); q.select(); }); }
}
// First question: the centred bar flies to the corner and shrinks into the button.
function foldSearch() {
  if (hero.classList.contains("compact")) { setSearchOpen(false); return; }
  const first = searchbox.getBoundingClientRect();
  hero.classList.add("compact");
  const { top, right, width: w, vw } = dockMetrics();
  if (matchMedia("(prefers-reduced-motion: reduce)").matches || !searchbox.animate) return;
  const hgt = searchbox.offsetHeight, left = vw - right - w;
  searchbox.animate([
    { transformOrigin: "0 0", transform: `translate(${first.left - left}px, ${first.top - top}px) scale(${first.width / w}, ${first.height / hgt})`, opacity: 1, visibility: "visible" },
    { transformOrigin: "0 0", transform: `translate(${w - 52}px, 0) scale(${52 / w}, ${52 / hgt})`, opacity: 0, visibility: "visible" },
  ], { duration: 420, easing: "cubic-bezier(.5,0,.2,1)" });
}
dock.onclick = () => setSearchOpen(true);
document.addEventListener("pointerdown", e => {
  if (hero.classList.contains("open") && !searchbox.contains(e.target) && !dock.contains(e.target)) setSearchOpen(false);
});
document.addEventListener("keydown", e => {
  if (!hero.classList.contains("compact")) return;
  if (e.key === "Escape" && hero.classList.contains("open")) { setSearchOpen(false); dock.focus(); }
  else if (e.key === "/" && !hero.classList.contains("open") && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) { e.preventDefault(); setSearchOpen(true); }
});

async function ask() {
  const text = q.value.trim(); if (!text) { q.focus(); return; }
  foldSearch(); q.blur(); scrollTo({ top: 0 });
  dock.title = `Yeni soru sor (/) — son soru: ${text}`;
  $("#ask-out").replaceChildren(); document.documentElement.classList.remove("has-results");
  $("#loader").classList.add("on"); $("#go").disabled = true;
  if (Cosmos.active) {
    // The voyage runs through the real candidates: the LLM-free explorer query answers
    // in ~100 ms while the judged answer takes much longer.
    Cosmos.begin({ judge: !!(STATUS && STATUS.llm), columns: STATUS ? STATUS.columns : 0 });
    api("/api/objects?q=" + encodeURIComponent(text))
      .then(c => Cosmos.candidates(c.items.filter(i => i.score != null).map(i => ({ key: i.key, name: i.name, score: i.score }))))
      .catch(() => {});
  }
  const llm = STATUS && STATUS.llm;
  const radar = Cosmos.active ? Cosmos.radarMs / 1000 : 3;  // the stages follow the radar's pace
  startStages($("#stage"), $("#stage-sub"), [
    ["Sözlük taranıyor…", "Türkçe normalizasyon, eş anlamlılar ve terim sözlüğü", 0],
    [STATUS && STATUS.hybrid ? "Anlamsal benzerlik hesaplanıyor…" : "Tablolar skorlanıyor…", "Kolonlar tablo seviyesinde toplanıyor", radar / 2],
    ...(llm ? [["LLM hakem değerlendiriyor…", `${llm.split("/").pop()} ilk ${STATUS.judge_candidates} adayı okuyor`, radar]] : []),
  ]);
  const radarDone = new Promise(res => setTimeout(res, Cosmos.active ? Cosmos.radarMs : 0));
  try {
    const r = await api("/api/ask", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ query: text, top: 5 }) });
    await radarDone;  // a fast answer still lets the radar finish its turns
    renderAsk(r);
  } catch (e) {
    $("#ask-out").replaceChildren(h("div", { class: "error" }, "Analiz başarısız: " + e.message));
  } finally {
    clearInterval(stageTimer); $("#loader").classList.remove("on"); $("#go").disabled = false;
    Cosmos.end();
  }
}

function conceptChip(c) {
  const [kind, ...rest] = c.split(":"); const label = rest.join(":");
  const cls = { "zaman": "k-zaman", "kırılım": "k-kirilim", "ölçü": "k-olcu", "kırılım değeri": "k-deger" }[kind] || "";
  const prefix = kind === "terim" || kind === label ? "" : kind + " · ";
  return h("span", { class: "chip " + cls }, prefix, h("b", {}, label));
}

function svg(markup) { const t = document.createElement("template"); t.innerHTML = markup; return t.content.firstChild; }

const COMP = { best_column: "En iyi kolon", coverage: "Kavram kapsama", time: "Zaman boyutu", granularity: "Müşteri seviyesi" };
function bars(m) {
  const items = Object.entries(m.components).map(([k, v]) =>
    h("div", { class: "bar" }, `${COMP[k] || k} · %${pct(v)}`, h("div", { class: "track" }, h("div", { class: "fill", style: `width:${pct(v)}%` }))));
  if (m.llm != null) items.push(h("div", { class: "bar llm" }, `LLM hakem · %${pct(m.llm)}`, h("div", { class: "track" }, h("div", { class: "fill", style: `width:${pct(m.llm)}%` }))));
  return h("div", { class: "bars" }, items);
}

const ROLE = { "eşleşme": "eşleşme", "kavram": "kavram", "zaman": "zaman", "kırılım": "kırılım", "yapısal": "anahtar", "türetme": "türetme" };
const SHOWN_COLUMNS = 6;
function columnChips(m) {
  const detail = h("div", { class: "detail" });
  const chips = m.columns.map(c => {
    const role = c.role ? (ROLE[c.role] || c.role) + " · " : "";
    const b = h("button", { class: "col", "aria-expanded": "false", title: role + c.description },
      h("span", {}, breakable(c.column)),
      c.flags.some(f => f.kind === "model_estimated") ? h("span", { class: "flag", title: "Açıklama model tahmini" }, "⚑") : null,
      c.pii ? h("span", { class: "flag", title: "Kişisel veri (KVKK)" }, "●") : null);
    b.onclick = () => {
      const open = b.getAttribute("aria-expanded") === "true";
      chips.forEach(x => x.setAttribute("aria-expanded", "false"));
      if (open) { detail.classList.remove("on"); return; }
      b.setAttribute("aria-expanded", "true");
      detail.replaceChildren(
        h("div", {}, h("span", { class: "k" }, c.column), h("span", { class: "faint" }, "  " + c.object)),
        h("div", { style: "margin-top:4px" }, c.description),
        c.synonyms.length ? h("div", { class: "syn" }, "Eş anlamlılar: " + c.synonyms.join(", ")) : null,
        ...c.signals.map(s => h("div", { class: "sig" }, "✓ " + s)),
        ...c.caveats.map(s => h("div", { class: "faint", style: "color:var(--mid)" }, "! " + s)),
        ...c.flags.map(f => h("div", { class: "faint" }, "⚑ " + f.text)));
      detail.classList.add("on");
    };
    return b;
  });
  const rest = chips.slice(SHOWN_COLUMNS);
  rest.forEach(b => b.classList.add("hidden"));
  const more = rest.length ? h("button", { class: "col more", onclick: e => { rest.forEach(b => b.classList.remove("hidden")); e.currentTarget.remove(); } }, `+${rest.length} kolon`) : null;
  return [h("div", { class: "cols" }, chips, more), detail];
}

function feedbackButtons(query, objKey, field) {
  const make = (vote, label) => {
    const b = h("button", { class: "vote", title: vote === "up" ? "Doğru öneri" : "Yanlış öneri" }, label);
    b.onclick = async () => {
      try {
        await api("/api/feedback", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ query, object: objKey, field, vote }) });
        b.parentElement.querySelectorAll(".vote").forEach(x => x.classList.remove("done", "down"));
        b.classList.add("done"); if (vote === "down") b.classList.add("down");
      } catch (e) { b.title = e.message; }
    };
    return b;
  };
  return [h("span", { class: "faint" }, "Bu öneri doğru mu?"), make("up", "👍"), make("down", "👎")];
}

// A result shows what the reader needs to decide: table, confidence, why, caveats, columns.
// Concept coverage, score components and usage wait behind "Ayrıntılar".
function resultCard(m, query) {
  const covered = new Set(m.covered), longv = new Set(m.long_format);
  const concepts = [...m.covered, ...m.missing].map(c =>
    h("span", { class: "chip " + (longv.has(c) ? "long" : covered.has(c) ? "on" : "off"), title: longv.has(c) ? `${m.dimension} değerleri üzerinden (uzun format)` : covered.has(c) ? "Karşılanıyor" : "Karşılanmıyor" }, c));
  return h("article", { class: "res", style: `--i:${m.rank || 0}` },
    h("div", { class: "res-head" },
      h("div", { class: "res-title" },
        h("h2", {}, breakable(m.name)),
        h("div", { class: "res-path" }, h("code", {}, `${m.database}.${m.schema}`), m.groups.length ? " · " + m.groups.join(", ") : null)),
      h("div", { class: "score lc-" + m.level, title: "Güven skoru" }, h("b", {}, pct(m.score)), h("span", {}, m.level))),
    h("p", { class: "res-reason" }, m.reason),
    m.caveat.length ? h("div", { class: "res-warn" }, m.caveat.map(c => h("div", {}, "⚠ " + c))) : null,
    ...columnChips(m),
    h("div", { class: "res-foot" },
      h("details", {}, h("summary", {}, "Ayrıntılar"),
        concepts.length ? h("div", { class: "chips" }, concepts) : null,
        m.usage ? h("div", { class: "usage" }, "Kullanım: " + m.usage) : null,
        bars(m)),
      feedbackButtons(query, m.key, "").slice(1)));
}

function notesTable(notes) {
  if (!notes.length) return null;
  return h("table", { class: "notes" }, notes.map(n => h("tr", {}, h("td", {}, n.scope), h("td", {}, h("b", {}, n.title), h("div", {}, n.text)))));
}

function renderAsk(r) {
  const out = $("#ask-out");
  const concepts = h("div", { class: "chips" }, r.concepts.map(conceptChip),
    r.expansion.length ? h("span", { class: "chip", title: r.expansion.join(", ") }, "+ " + r.expansion.length + " genişletme terimi") : null);
  const clar = r.notes.filter(n => n.scope === "Netleştirme");
  const other = r.notes.filter(n => n.scope !== "Netleştirme");
  const meta = `${(r.elapsed_ms / 1000).toFixed(1)} sn · sözlük ${r.dictionary_version}` + (r.llm_model ? ` · LLM ${r.llm_model}` : "");
  put(out,
    h("section", { class: "answer " + verdictClass(r.verdict) },
      h("div", { class: "answer-top" },
        h("span", { class: "vbadge" }, r.verdict),
        h("span", { class: "answer-q", title: r.query }, r.query),
        r.report_id ? h("a", { class: "dl", href: "/api/report/" + r.report_id, download: "" }, "⬇ Excel raporu") : null),
      h("p", { class: "answer-sum" }, r.summary.replace(/^[A-ZÇĞİÖŞÜ ]+ — /, "")),
      clar.length ? h("div", { class: "ask-hints" }, clar.map(n => h("div", {}, n.text))) : null),
    ...r.objects.map(m => resultCard(m, r.query)),
    !r.objects.length ? h("div", { class: "empty" }, "Sözlükte bu talebin doğrudan karşılığı bulunamadı. Talebi farklı ifadelerle deneyin.") : null,
    r.near.length ? h("details", { class: "ask-more" }, h("summary", {}, `Yakın adaylar (${r.near.length})`),
      h("div", { class: "inner" }, r.near.map(m => resultCard(m, r.query)))) : null,
    h("details", { class: "ask-more" }, h("summary", {}, "Arama ayrıntıları"),
      h("div", { class: "inner" },
        h("div", { class: "label" }, "Talepte anlaşılan kavramlar"), concepts,
        other.length ? [h("div", { class: "label" }, "Notlar"), notesTable(other)] : null,
        h("div", { class: "label" }, "Yöntem"), h("ul", { class: "method" }, r.method.map(x => h("li", { class: "muted" }, x))),
        h("div", { class: "faint" }, meta))));
  document.documentElement.classList.add("has-results");
  store.set("vsa-last-query", r.query);
  Cosmos.focus(r.objects.map(o => ({ key: o.key, name: o.name, score: o.score })), r.query);
}

// ---------------------------------------------------------------- galaxy (Evren)
// The warehouse as a galaxy: every table is a star, clustered by dataset group.
// A search is a voyage: the navigator plots a route through the real candidate
// tables (fetched LLM-free in ~100 ms), a probe travels it, the route narrows to the
// judge's finalists while the LLM reads them, and the probe lands on the answer.
const Cosmos = (() => {
  const cv = $("#cosmos"), ctx = cv.getContext("2d"), tip = $("#star-tip");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W = 0, H = 0, dpr = 1, active = false, raf = 0, loaded = false;
  let nodes = [], byKey = new Map(), groups = [], dust = [];
  let rot = 0, t = 0, last = performance.now();
  let focusList = [], focusAt = 0, pulseKey = "", pulseAt = 0, hover = null;
  const mouse = { x: 0.5, y: 0.5, sx: 0.5, sy: 0.5 };

  // voyage state
  let mode = "idle", modeAt = 0, judgeExpected = false, origin = [0, 0];
  let route = [], routeAt = 0, dist = 0, speed = 0, loop = false, arrived = [], trail = [];
  let candidates = [], hudSteps = [], reading = null, landedAt = 0;
  // The radar opens every search: its beam turns RADAR_TURNS times before the voyage
  // moves on. Candidates and answers that arrive earlier wait for it.
  const RADAR_SPEED = 1.2, RADAR_TURNS = 1;  // rad/s, full turns
  const RADAR_MS = RADAR_TURNS * 2 * Math.PI / RADAR_SPEED * 1000;
  let pendingCandidates = null, pendingFocus = null, pendingEnd = false;

  const hash = s => { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
  const rnd = seed => () => ((seed = Math.imul(seed ^ (seed >>> 15), 2246822507) ^ Math.imul(seed ^ (seed >>> 13), 3266489909)) >>> 0) / 4294967296;
  const fmt = n => n.toLocaleString("tr-TR");

  function build(stars) {
    const byGroup = new Map();
    for (const s of stars) { if (!byGroup.has(s.group)) byGroup.set(s.group, []); byGroup.get(s.group).push(s); }
    groups = [...byGroup.entries()].sort((a, b) => b[1].length - a[1].length);
    const G = groups.length, golden = Math.PI * (3 - Math.sqrt(5));
    nodes = []; byKey = new Map();
    groups = groups.map(([name, members], gi) => {
      const r = 0.1 + 0.82 * Math.sqrt((gi + 0.5) / G), a = gi * golden;
      const hue = (hash(name) % 360);
      const g = { name, x: Math.cos(a) * r, y: Math.sin(a) * r, hue, n: members.length, members: [] };
      const R = rnd(hash(name));
      members.forEach((m, j) => {
        const rr = 0.018 + 0.022 * Math.sqrt(j) + R() * 0.012, aa = j * golden + R() * 0.8;
        const node = { ...m, g, x: g.x + Math.cos(aa) * rr, y: g.y + Math.sin(aa) * rr,
          z: 0.35 + R() * 0.65, size: 0.9 + Math.sqrt(m.columns) * 0.32, tw: R() * Math.PI * 2, hue, sx: 0, sy: 0 };
        nodes.push(node); byKey.set(m.key, node); g.members.push(node);
      });
      return g;
    });
    const R = rnd(7);
    dust = Array.from({ length: 480 }, () => ({ x: R() * 2 - 1, y: R() * 2 - 1, z: R(), tw: R() * 6.3 }));
    $("#hud-count").textContent = `${nodes.length} tablo · ${groups.length} küme`;
    loaded = true;
  }

  function resize() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = document.documentElement.clientWidth; H = document.documentElement.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function screen(n) {
    const c = Math.cos(rot * n.z), s = Math.sin(rot * n.z);
    const x = n.x * c - n.y * s, y = n.x * s + n.y * c;
    const px = (mouse.sx - 0.5) * 60 * n.z, py = (mouse.sy - 0.5) * 40 * n.z;
    return [W / 2 + x * W * 0.47 + px, H / 2 + y * H * 0.46 + py];
  }

  // Where the voyage starts: under the visible search field.
  function searchOrigin() {
    const r = searchbox.getBoundingClientRect();
    return r.width ? [r.left + r.width / 2, Math.min(H - 40, r.bottom + 8)] : [W / 2, 140];
  }
  const P = p => (p.n ? [p.n.sx, p.n.sy] : p.xy);

  // --------------------------------------------------------------- route geometry
  function tour(from, list) {  // nearest-neighbour ordering: a short, readable path
    const rest = [...list], out = [];
    let [cx, cy] = from;
    while (rest.length) {
      let bi = 0, bd = Infinity;
      rest.forEach((n, i) => { const d = (n.sx - cx) ** 2 + (n.sy - cy) ** 2; if (d < bd) { bd = d; bi = i; } });
      const n = rest.splice(bi, 1)[0]; out.push(n); cx = n.sx; cy = n.sy;
    }
    return out;
  }
  function setRoute(points, pxPerSec, closed = false) {
    route = points; dist = 0; lastAlong = 0; speed = pxPerSec; loop = closed; routeAt = t; arrived = points.map(() => 0);
  }
  function lengths() {
    const pts = route.map(P); if (loop && pts.length > 1) pts.push(pts[1]);
    const cum = [0];
    for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    return { pts, cum, total: cum[cum.length - 1] };
  }
  function at(pts, cum, d) {
    let i = 1; while (i < cum.length - 1 && cum[i] < d) i++;
    const seg = cum[i] - cum[i - 1] || 1, k = Math.max(0, Math.min(1, (d - cum[i - 1]) / seg));
    const [x0, y0] = pts[i - 1], [x1, y1] = pts[i];
    return [x0 + (x1 - x0) * k, y0 + (y1 - y0) * k, Math.atan2(y1 - y0, x1 - x0)];
  }
  // Distance along the route; a closed loop circles the finalists (from index 1 on)
  // and never returns to the starting point.
  function along(cum, total) {
    if (!loop || dist <= cum[1]) return Math.min(dist, total);
    return cum[1] + (dist - cum[1]) % Math.max(1, total - cum[1]);
  }
  let lastAlong = 0;
  function shipPos() {
    if (!route.length) return origin;
    const { pts, cum, total } = lengths();
    if (pts.length < 2) return pts[0];
    const [x, y] = at(pts, cum, along(cum, total)); return [x, y];
  }
  function hud(step, replaceLast = false) {
    if (replaceLast) hudSteps.pop();
    if (step) hudSteps.push(step);
    const shown = hudSteps.slice(-4);  // the voyage log: latest steps only
    $("#hud-focus").textContent = (hudSteps.length > shown.length ? "…  →  " : "") + shown.join("  →  ");
  }

  // --------------------------------------------------------------- frame loop
  // The chat model shares the (integrated) GPU with the browser: keep the sky light.
  function frame(now) {
    if (active) raf = requestAnimationFrame(frame);
    const budget = mode === "judge" || mode === "wait" ? 50 : 33;
    if (now - last < budget) return;
    // Real time, so the voyage keeps pace even when frames are sparse (busy GPU);
    // capped only to avoid a jump after the tab was in the background.
    const dt = Math.min(1000, now - last); last = now; t += dt;
    const cruising = mode === "idle" || mode === "done";
    if (!reduce && cruising) rot += dt * 0.000018;
    mouse.sx += (mouse.x - mouse.sx) * 0.05; mouse.sy += (mouse.y - mouse.sy) * 0.05;
    step(dt);
    draw();
  }

  function step(dt) {
    if (mode === "plan" && t - modeAt >= RADAR_MS) radarDone();
    if (!route.length || !["travel", "judge", "final"].includes(mode)) return;
    if (t - routeAt < (mode === "final" ? 150 : 500)) return;  // the route is drawn first
    const { cum, total } = lengths();
    dist += speed * dt / 1000;
    const d = along(cum, total);
    if (d < lastAlong) arrived.fill(0);  // a new lap around the finalists
    lastAlong = d;
    for (let k = 1; k < route.length; k++) if (!arrived[k] && d >= cum[k] - 0.5) arrived[k] = t;
    if (mode === "judge") {
      const idx = Math.max(1, cum.findIndex(c => c > d) - 1);
      const n = route[Math.min(idx, route.length - 1)].n;
      if (n && n !== reading) { reading = n; hud(`okunuyor: ${n.name}`, hudSteps.at(-1)?.startsWith("okunuyor")); }
    }
    if (!loop && dist >= total) {
      if (mode === "travel") judgeExpected ? startJudge() : (mode = "wait", modeAt = t);
      else if (mode === "final") { mode = "done"; landedAt = t; }
    }
  }

  function radarDone() {
    const f = pendingFocus, c = pendingCandidates, stop = pendingEnd;
    pendingFocus = pendingCandidates = null; pendingEnd = false;
    if (f) { if (c) showCandidates(c); showFocus(...f); }
    else if (stop) { mode = "idle"; route = []; }
    else if (c) showCandidates(c);
    else patrol();
  }

  function patrol() {  // no candidate list (batch): sweep the biggest clusters
    const stops = groups.slice(0, 9).map(g => g.members[0]).filter(Boolean);
    setRoute([{ xy: origin }, ...tour(origin, stops).map(n => ({ n }))], 260);
    mode = "travel"; modeAt = t;
    hud("veri kümeleri taranıyor");
  }

  function startJudge() {
    const fin = candidates.slice(0, STATUS && STATUS.judge_candidates || 8).map(c => byKey.get(c.key)).filter(Boolean);
    if (fin.length < 2) { mode = "wait"; modeAt = t; return; }
    const here = shipPos();
    setRoute([{ xy: here }, ...tour(here, fin).map(n => ({ n }))], 170, true);
    mode = "judge"; modeAt = t; reading = null;
    hud(`${fin.length} finalist`); hud("LLM hakem okuyor");
  }

  // --------------------------------------------------------------- drawing
  function draw() {
    ctx.clearRect(0, 0, W, H);
    const cx = W / 2, cy = H / 2;
    for (const d of dust) {
      const a = 0.25 + 0.35 * Math.sin(t * 0.002 + d.tw);
      ctx.fillStyle = `rgba(200,215,255,${a * (0.3 + d.z * 0.5)})`;
      ctx.fillRect(cx + d.x * W * 0.6, cy + d.y * H * 0.6, 1, 1);
    }
    if (!loaded) return;
    const voyage = mode !== "idle";
    const onRoute = new Set(route.map(p => p.n).filter(Boolean));
    const dim = voyage && mode !== "done" ? 0.3 : focusList.length ? 0.45 : 1;

    ctx.lineWidth = 0.5;
    for (const n of nodes) {
      const [x, y] = screen(n), [gx, gy] = screen({ x: n.g.x, y: n.g.y, z: n.z });
      ctx.strokeStyle = `hsla(${n.hue},80%,70%,${0.05 * dim})`;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(gx, gy); ctx.stroke();
    }
    for (const n of nodes) {
      const [x, y] = screen(n); n.sx = x; n.sy = y;
      const tw = 0.65 + 0.35 * Math.sin(t * 0.0022 + n.tw), r = n.size * (0.6 + n.z * 0.7);
      const a = (0.35 + 0.55 * n.z) * tw * (onRoute.has(n) ? 1 : dim);
      ctx.fillStyle = `hsla(${n.hue},90%,${72 + n.z * 18}%,${a})`;
      ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
    }
    if (mode === "plan") drawPlanning();
    if (route.length > 1 && mode !== "idle") drawRoute();
    drawFocus();
    if (hover) ring(hover.sx, hover.sy, 10, "rgba(255,255,255,.8)", 1.2);
  }

  function drawPlanning() {  // radar pings from the search field while the route is computed
    const [ox, oy] = origin, age = (t - modeAt) / 1000;
    for (let k = 0; k < 3; k++) {
      const p = (age * 0.45 + k / 3) % 1;
      ring(ox, oy, 10 + p * Math.max(W, H) * 0.45, `rgba(124,244,255,${0.35 * (1 - p)})`, 1.2);
    }
    const sweep = age * RADAR_SPEED;
    const g = ctx.createConicGradient ? ctx.createConicGradient(sweep, ox, oy) : null;
    if (g) {
      g.addColorStop(0, "rgba(124,244,255,.09)"); g.addColorStop(0.035, "rgba(124,244,255,0)"); g.addColorStop(1, "rgba(124,244,255,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(ox, oy, Math.max(W, H), 0, 6.2832); ctx.fill();
    }
    drawShip(ox, oy, -Math.PI / 2, 1);
  }

  function drawRoute() {
    const { pts, cum, total } = lengths();
    const reveal = Math.min(1, (t - routeAt) / (mode === "final" ? 300 : 700));
    const planned = total * reveal;
    const d = along(cum, total);
    // planned path ahead (dashed, drawn out progressively)
    ctx.setLineDash([5, 9]); ctx.lineDashOffset = -t * 0.04;
    ctx.strokeStyle = mode === "judge" ? "rgba(255,93,214,.45)" : "rgba(124,244,255,.4)"; ctx.lineWidth = 1.2;
    polyline(pts, cum, loop ? 0 : d, planned);
    ctx.setLineDash([]);
    // travelled path (solid, glowing)
    if (!loop) {
      ctx.strokeStyle = "rgba(124,244,255,.18)"; ctx.lineWidth = 6; polyline(pts, cum, 0, d);
      ctx.strokeStyle = "rgba(190,250,255,.9)"; ctx.lineWidth = 1.6; polyline(pts, cum, 0, d);
    }
    // waypoints
    route.forEach((p, k) => {
      if (k === 0 || !p.n) return;
      const [x, y] = P(p), c = candidates.find(c => c.key === p.n.key) || focusList.find(f => f.key === p.n.key);
      const since = arrived[k] ? (t - arrived[k]) / 1000 : -1;
      if (since >= 0 && since < 1.2) ring(x, y, 6 + since * 34, `rgba(124,244,255,${0.8 * (1 - since / 1.2)})`, 1.5);
      ring(x, y, since >= 0 ? 6 : 4, since >= 0 ? "rgba(255,255,255,.85)" : "rgba(124,244,255,.5)", 1.2);
      const show = mode === "judge" ? p.n === reading : since >= 0 && since < 2.2 && mode !== "final";
      if (show) label(x, y, mode === "judge" ? `okunuyor · ${p.n.name}` : p.n.name,
        c && c.score != null ? `%${Math.round(c.score * 100)}` : "", 1);
    });
    if (mode === "done") {
      const [x, y] = pts[pts.length - 1], a = (t - landedAt) / 1000;
      if (a < 1.6) for (let k = 0; k < 3; k++) ring(x, y, 8 + (a + k * 0.18) * 70, `rgba(61,252,180,${Math.max(0, 0.8 - a * 0.5 - k * 0.15)})`, 2);
      if (a > 4) route = [];
      return;
    }
    const [sx, sy, ang] = at(pts, cum, d);
    trail.push([sx, sy]); if (trail.length > 26) trail.shift();
    drawShip(sx, sy, ang, 1);
  }

  function polyline(pts, cum, from, to) {
    if (to <= from) return;
    const [x0, y0] = at(pts, cum, from);
    ctx.beginPath(); ctx.moveTo(x0, y0);
    for (let i = 1; i < pts.length; i++) {
      if (cum[i] <= from) continue;
      if (cum[i] >= to) { const [x, y] = at(pts, cum, to); ctx.lineTo(x, y); break; }
      ctx.lineTo(pts[i][0], pts[i][1]);
    }
    ctx.stroke();
  }

  function drawShip(x, y, ang, alpha) {
    for (let i = 1; i < trail.length; i++) {  // comet trail
      const k = i / trail.length;
      ctx.strokeStyle = `rgba(124,244,255,${0.5 * k * alpha})`; ctx.lineWidth = 3.5 * k;
      ctx.beginPath(); ctx.moveTo(trail[i - 1][0], trail[i - 1][1]); ctx.lineTo(trail[i][0], trail[i][1]); ctx.stroke();
    }
    glow(x, y, 26, `rgba(124,244,255,${0.45 * alpha})`);
    glow(x, y, 12, `rgba(255,93,214,${0.35 * alpha})`);
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
    ctx.fillStyle = "#ffffff"; ctx.beginPath();
    ctx.moveTo(9, 0); ctx.lineTo(-6, 5); ctx.lineTo(-3, 0); ctx.lineTo(-6, -5); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function glow(x, y, r, color) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, color); g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
  }
  function ring(x, y, r, color, w) { ctx.strokeStyle = color; ctx.lineWidth = w; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.stroke(); }

  function drawFocus() {
    if (!focusList.length || (mode !== "done" && mode !== "idle")) return;
    const age = (t - focusAt) / 1000;
    const pts = focusList.map(f => byKey.get(f.key)).filter(Boolean);
    if (pts.length > 1 && mode === "idle") {
      ctx.setLineDash([6, 8]); ctx.lineDashOffset = -t * 0.03;
      ctx.strokeStyle = "rgba(124,244,255,.45)"; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(pts[0].sx, pts[0].sy);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].sx, pts[i].sy);
      ctx.stroke(); ctx.setLineDash([]);
    }
    focusList.forEach((f, i) => {
      const n = byKey.get(f.key); if (!n) return;
      const appear = Math.max(0, Math.min(1, age * 2 - i * 0.15));
      if (!appear) return;
      const s = Math.max(0.15, f.score || 0), pulse = 1 + 0.2 * Math.sin(t * 0.004 - i);
      glow(n.sx, n.sy, (16 + 26 * s) * pulse * appear, `rgba(124,244,255,${0.32 * appear})`);
      ring(n.sx, n.sy, (7 + 9 * s) * pulse, `rgba(255,255,255,${0.7 * appear})`, 1.3);
      ctx.fillStyle = i === 0 ? "#3dfcb4" : "#fff"; ctx.beginPath(); ctx.arc(n.sx, n.sy, 2.6 + 2 * s, 0, 6.2832); ctx.fill();
      if (i < 6) label(n.sx, n.sy, `${i + 1}. ${f.name}`, f.score != null ? `%${Math.round(f.score * 100)}` : "", appear);
    });
    if (pulseKey && byKey.has(pulseKey)) {
      const n = byKey.get(pulseKey), a = (t - pulseAt) / 1000;
      for (let k = 0; k < 3; k++) { const p = (a * 0.6 + k / 3) % 1; ring(n.sx, n.sy, 6 + p * 60, `rgba(255,93,214,${0.7 * (1 - p)})`, 1.5); }
    }
  }

  function label(x, y, text, score, alpha) {
    ctx.font = "600 12px 'Cascadia Code', Consolas, monospace";
    const w = ctx.measureText(text).width + (score ? 44 : 14), lx = Math.max(8, Math.min(W - w - 8, x + 14)), ly = y - 24;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = "rgba(8,12,30,.85)"; ctx.strokeStyle = "rgba(124,244,255,.45)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.roundRect(lx, ly, w, 20, 9); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#eaf6ff"; ctx.fillText(text, lx + 7, ly + 14);
    if (score) { ctx.fillStyle = "#3dfcb4"; ctx.fillText(score, lx + w - 37, ly + 14); }
    ctx.globalAlpha = 1;
  }

  // --------------------------------------------------------------- interaction
  const blocked = el => el.closest("header, .res, .answer, .searchbox, button, a, textarea, input, table, details, .loader, footer");
  function nearest(x, y) {
    let best = null, bd = 14 * 14;
    for (const n of nodes) { const d = (n.sx - x) ** 2 + (n.sy - y) ** 2; if (d < bd) { bd = d; best = n; } }
    return best;
  }
  addEventListener("pointermove", e => {
    mouse.x = e.clientX / innerWidth; mouse.y = e.clientY / innerHeight;
    if (!active) return;
    const n = !blocked(e.target) ? nearest(e.clientX, e.clientY) : null;
    hover = n;
    if (n) {
      tip.replaceChildren(h("div", { class: "t" }, n.name), h("div", { class: "g" }, `${n.schema} · ${n.columns} kolon`), h("div", { class: "g" }, n.group));
      tip.style.left = e.clientX + "px"; tip.style.top = e.clientY + "px"; tip.classList.add("on");
    } else tip.classList.remove("on");
  }, { passive: true });
  addEventListener("resize", () => { if (active) resize(); });
  document.addEventListener("visibilitychange", () => { if (active) { cancelAnimationFrame(raf); if (!document.hidden) raf = requestAnimationFrame(frame); } });

  async function ensureLoaded() {
    if (loaded) return;
    try { build(await api("/api/galaxy")); } catch { /* the page still works without the map */ }
  }

  return {
    get active() { return active && loaded; },
    get state() { return { mode, dist: Math.round(dist), stops: route.length, speed, t: Math.round(t) }; },
    radarMs: RADAR_MS,
    async setActive(on) {
      active = on; cancelAnimationFrame(raf); tip.classList.remove("on");
      if (!on) return;
      resize(); await ensureLoaded(); last = performance.now(); raf = requestAnimationFrame(frame);
    },
    /** A search starts: plot a route from the search field. */
    begin({ judge = false, columns = 0 } = {}) {
      origin = searchOrigin(); mode = "plan"; modeAt = t; judgeExpected = judge;
      route = []; trail = []; candidates = []; focusList = []; reading = null; hudSteps = [];
      pendingCandidates = pendingFocus = null; pendingEnd = false;
      hud(columns ? `${fmt(columns)} kolon taranıyor` : "rota planlanıyor");
    },
    /** Real candidate tables (LLM-free pipeline): the route runs through them. */
    candidates(list) {
      if (!active || !loaded || (mode !== "plan" && mode !== "travel")) return;
      if (mode === "plan" && t - modeAt < RADAR_MS) { pendingCandidates = list; return; }
      showCandidates(list);
    },
    /** Final answer: fly to it, landing on #1; the results stay as a constellation. */
    focus(list, query) {
      if (mode === "plan" && t - modeAt < RADAR_MS && active && loaded) { pendingFocus = [list, query]; return; }
      showFocus(list, query);
    },
    /** Search finished without results / failed: stand down. */
    end() {
      if (mode === "plan" && t - modeAt < RADAR_MS) { pendingEnd = true; return; }  // the radar finishes first
      if (["plan", "travel", "judge", "wait"].includes(mode)) { mode = "idle"; route = []; }
    },
    pulse(key) { pulseKey = key; pulseAt = t; },
  };

  function showCandidates(list) {
      candidates = list.filter(c => byKey.has(c.key)).sort((a, b) => (b.score || 0) - (a.score || 0));
      const stops = candidates.slice(0, 12).map(c => byKey.get(c.key));
      if (!stops.length) return;
      setRoute([{ xy: origin }, ...tour(origin, stops).map(n => ({ n }))], 250);
      mode = "travel"; modeAt = t; trail = [];
      hud(`${candidates.length} aday`); hud("rota çizildi");
  }

  function showFocus(list, query) {
      focusList = list.filter(f => f && f.key && byKey.has(f.key));
      focusAt = t;
      if (!active || !loaded || !focusList.length) {
        if (!focusList.length && mode !== "idle") { mode = "idle"; route = []; hud(""); }
        return;
      }
      const from = mode === "idle" ? searchOrigin() : shipPos();
      const stops = [...focusList].reverse().map(f => ({ n: byKey.get(f.key) }));
      trail = []; setRoute([{ xy: from }, ...stops], 900);
      mode = "final"; modeAt = t;
      if (hudSteps.at(-1)?.startsWith("okunuyor")) hudSteps.pop();
      if (hudSteps.at(-1) === "LLM hakem okuyor" || hudSteps.at(-1) === "rota çizildi") hudSteps.pop();
      if (!hudSteps.length && query) hudSteps.push(`◎ ${query}`);
      hud(`${focusList.length} sonuç · varış: ${focusList[0].name}`);
  }
})();

addEventListener("scroll", () => document.documentElement.classList.toggle("scrolled", scrollY > 120), { passive: true });

// ---------------------------------------------------------------- boot
Cosmos.setActive(true);
autosize();
loadStatus();
q.focus();
</script>
</body>
</html>
