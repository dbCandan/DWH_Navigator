        glance.length ? h("div", { class: "side-glance" }, glance) : null,
        plan || watch || notes ? h("div", { class: "side-guide" }, plan, watch, notes) : null) : null));
}

// ---------------------------------------------------------------- term list (ADR-033)
// An Excel list: every term of the first column goes through the question flow on the
// server, one after the other; the page follows the progress and offers one report.
const Bulk = (() => {
  let job = null, timer = null, view = null;
  const open = new Map();  // term index -> its opened answer (kept across redraws)
  const file = $("#xl-file");
  const STATE = { "sırada": ["SIRADA", "wait"], "çalışıyor": ["ARANIYOR", "run"], "hata": ["HATA", "err"], "durduruldu": ["DURDU", "wait"] };
  const dur = ms => ms >= 60000 ? `${Math.round(ms / 60000)} dk` : `${Math.max(1, Math.round(ms / 1000))} sn`;
  const shown = () => view && view.isConnected;
  const pick = () => file.click();
  $("#xl").onclick = pick;
  // Drop an Excel list anywhere on the page: the bar lights up and says what will happen.
  let depth = 0;
  const hasFile = e => [...(e.dataTransfer?.types || [])].includes("Files");
  addEventListener("dragenter", e => { if (hasFile(e)) { depth++; root.classList.add("dropping"); } });
  addEventListener("dragleave", e => { if (hasFile(e) && --depth <= 0) { depth = 0; root.classList.remove("dropping"); } });
  addEventListener("dragover", e => { if (hasFile(e)) e.preventDefault(); });
  addEventListener("drop", e => {
    if (!hasFile(e)) return;
    e.preventDefault(); depth = 0; root.classList.remove("dropping");
    const f = e.dataTransfer.files[0];
    if (f) start(f);
  });
  file.onchange = () => { const f = file.files[0]; file.value = ""; if (f) start(f); };

  async function start(f) {
    if (job && job.running) { show(); return; }
    Dossier.close(); foldSearch(); q.blur(); scrollTo({ top: 0 });
    q.value = ""; q.title = ""; open.clear();
    put($("#ask-out"), h("div", { class: "stopped", role: "status" }, `“${f.name}” okunuyor…`));
    try {
      job = await api("/api/list", { method: "POST", headers: { "X-Filename": encodeURIComponent(f.name) }, body: f });
    } catch (e) { put($("#ask-out"), formatHelp(f.name, e.message)); return; }
    try { sessionStorage.setItem("vsa-list", job.id); } catch {}
    show(); poll();
  }
  // A rejected file: what was wrong, and the one layout that is accepted, as a picture.
  function formatHelp(name, message) {
    const row = (n, v, cls = "") => h("tr", {}, h("th", {}, n), h("td", { class: cls }, v), h("td", { class: "off" }, ""));
    return h("section", { class: "xl-help" },
      h("div", { class: "error" }, h("b", {}, `“${name}” yüklenemedi. `), message.replace(/ Beklenen biçim:.*$/, "")),
      h("div", { class: "xl-ex" },
        h("table", {},
          h("thead", {}, h("tr", {}, h("th", {}, ""), h("th", {}, "A"), h("th", {}, "B"))),
          h("tbody", {}, row(1, "Terim", "hd"), row(2, "kredi kartı limit doluluk oranı"), row(3, "sektör bazlı mevduat dağılımı"), row(4, "müşterinin kredi risk skoru"))),
        h("ul", {},
          h("li", {}, h("b", {}, "Tek sütun: "), "terimler yalnız A sütununda; diğer sütunlar boş."),
          h("li", {}, h("b", {}, "İlk satır başlıktır: "), "her zaman başlık sayılır ve aranmaz (ör. “Terim”)."),
          h("li", {}, h("b", {}, "Her satırda bir terim: "), `boş satırlar ve tekrarlar atlanır; en fazla ${200} terim.`),
          h("li", {}, h("b", {}, "Yalnız ilk sayfa "), "okunur."))));
  }
  function poll() { clearTimeout(timer); if (job && job.running) timer = setTimeout(refresh, 1500); }
  async function refresh() {
    try { job = await api("/api/list/" + job.id); } catch { job = null; pill(); return; }
    if (shown()) render(); pill(); poll();
  }
  async function stop(btn) {
    btn.disabled = true;
    try { job = await api(`/api/list/${job.id}/cancel`, { method: "POST" }); } catch {}
    render(); poll();
  }

  function show() {
    foldSearch();  // the list heads the page like an answer does
    view = h("section", { class: "list" });
    put($("#ask-out"), view);
    document.documentElement.classList.add("has-results");
    render(); pill();
  }
  function render() {
    if (!job || !view) return;
    const frac = job.total ? job.done / job.total : 0;
    const progress = job.running
      ? `${job.done}/${job.total} terim tamamlandı` + (job.eta_ms ? ` · kalan ≈ ${dur(job.eta_ms)}` : "")
      : job.cancelled ? `Durduruldu · ${job.done}/${job.total} terim cevaplandı` : `Tamamlandı · ${job.total} terim, ${dur(job.elapsed_ms)}`;
    put(view,
      h("div", { class: "list-head" },
        h("div", { class: "ttl" }, h("h2", {}, job.name), h("div", { class: "sub" }, progress,
          job.header ? h("span", { class: "faint" }, ` · başlık: “${job.header}”`) : null)),
        job.running ? h("button", { class: "ghost", onclick: e => stop(e.currentTarget) }, "■ Durdur") : null,
        job.done ? h("a", { class: "ghost", href: `/api/list/${job.id}/report`, download: "" },
          job.running ? "⬇ Şimdiye kadarki rapor" : "⬇ Excel raporu") : null),
      h("div", { class: "list-bar" + (job.running ? " live" : "") }, h("i", { style: `width:${Math.max(2, frac * 100)}%` })),
      job.notes && job.notes.length ? h("div", { class: "list-notes" }, job.notes.map(n => h("div", {}, "ℹ " + n))) : null,
      ruleCount() ? h("div", { class: "answer-fallback" }, `${ruleCount()} terim analiz edilemedi (model bağlı değil ya da çalışamadı). Model çalışınca bu terimleri yeniden arayın.`) : null,
      h("ol", { class: "list-items" }, job.items.map(row)));
  }
  const ruleCount = () => job.items.filter(i => i.state === "bitti" && i.flow === "yapılamadı").length;
  function row(it) {
    const done = it.state === "bitti";
    const [word, cls] = done ? [it.verdict, ""] : STATE[it.state] || [it.state, "wait"];
    const best = it.best ? h("span", { class: "li-best" }, it.best.name, " · ",
      h("b", { class: "lc-" + it.best.level }, `%${pct(it.best.score)}`)) : null;
    const err = it.state === "hata" ? h("span", { class: "li-best" }, it.summary) : null;
    const btn = h("button", { class: "li-row", type: "button", "aria-expanded": done ? String(open.has(it.index)) : null,
      onclick: done ? () => toggle(it, li) : null },
      h("span", { class: "li-n" }, it.index),
      h("span", { class: "li-term" }, it.term,
        done && it.flow === "önbellek" ? h("span", { class: "li-flow reused", title: "Bu terim daha önce analiz edilmişti; kayıtlı cevap kullanıldı" }, "ÖNCEKİ CEVAP")
          : done && it.flow !== "analist" ? h("span", { class: "li-flow", title: "Bu terim analiz edilemedi (model bağlı değil ya da çalışamadı)" }, "YAPILAMADI") : null,
        best, err),
      h("span", { class: `st ${cls} ${done ? verdictClass(it.verdict) : ""}` }, word),
      h("span", { class: "li-ms" }, it.elapsed_ms ? dur(it.elapsed_ms) : ""));
    const li = h("li", {}, btn, open.get(it.index) || null);
    return li;
  }
  async function toggle(it, li) {
    if (open.has(it.index)) { open.get(it.index).remove(); open.delete(it.index); li.firstChild.setAttribute("aria-expanded", "false"); return; }
    const box = h("div", { class: "li-detail" }, h("p", { class: "faint" }, "Yükleniyor…"));
    open.set(it.index, box); li.append(box); li.firstChild.setAttribute("aria-expanded", "true");
    try { put(box, answerView(await api(`/api/list/${job.id}/item/${it.index}?voter=${VOTER}`))); growRings(box); }
    catch (e) { put(box, h("div", { class: "error" }, e.message)); }
  }

  // Asking a single question replaces the list on the page; the list goes on and a
  // pill in the top line leads back to it.
  function pill() {
    const el = $("#listpill");
    if (!job || shown()) { if (el) el.remove(); return; }
    const text = job.running ? `Liste ${job.done}/${job.total}` : "Liste sonucu";
    const p = el || h("button", { class: "pill listpill", id: "listpill", type: "button", title: "Toplu aramaya dön", onclick: show });
    p.replaceChildren(h("i", { class: "dot" + (job.running ? " on" : "") }), text);
    if (!el) $(".tools").prepend(p);
  }
  // After a page reload: pick up the list this tab started.
  (async () => {
    let id = null; try { id = sessionStorage.getItem("vsa-list"); } catch {}
    if (!id) return;
    try { job = await api("/api/list/" + id); } catch { return; }
    pill(); poll();
  })();
  return { pill };
})();

// ---------------------------------------------------------------- galaxy (Evren)
// The warehouse as a galaxy: every table is a star, clustered by dataset group.
// A search is a voyage: the navigator plots a route through the real candidate
// tables (fetched LLM-free in ~100 ms), a probe travels it, the route narrows to the
// finalists while the model reads them, and the probe lands on the answer.
const Cosmos = (() => {
  const cv = $("#cosmos"), ctx = cv.getContext("2d"), tip = $("#star-tip");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W = 0, H = 0, dpr = 1, active = false, raf = 0, loaded = false;
  let nodes = [], byKey = new Map(), groups = [], dust = [];
  let rot = 0, t = 0, last = performance.now();
  let focusList = [], focusAt = 0, pulseKey = "", pulseAt = 0, hover = null;
  const mouse = { x: 0.5, y: 0.5, sx: 0.5, sy: 0.5 };
  // A clicked star: the camera glides it into the free space left of the dossier.
  let selected = null, selectedAt = 0;
  const cam = { x: 0, y: 0 };

  // voyage state
  let mode = "idle", modeAt = 0, readExpected = false, origin = [0, 0];
  let route = [], routeAt = 0, dist = 0, speed = 0, loop = false, arrived = [], trail = [];
  let candidates = [], hudSteps = [], reading = null, landedAt = 0;
  // The radar opens every search: its beam turns RADAR_TURNS times before the voyage
  // moves on. Candidates and answers that arrive earlier wait for it.
  const RADAR_SPEED = 1.2, RADAR_TURNS = 1;  // rad/s, full turns
  const RADAR_MS = RADAR_TURNS * 2 * Math.PI / RADAR_SPEED * 1000;
  let pendingCandidates = null, pendingFocus = null, pendingEnd = false;

  const hash = s => { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
  const rnd = seed => () => ((seed = Math.imul(seed ^ (seed >>> 15), 2246822507) ^ Math.imul(seed ^ (seed >>> 13), 3266489909)) >>> 0) / 4294967296;
  const fmt = n => n.toLocaleString("tr-TR");

  function build(stars) {
    const byGroup = new Map();
    for (const s of stars) { if (!byGroup.has(s.group)) byGroup.set(s.group, []); byGroup.get(s.group).push(s); }
    groups = [...byGroup.entries()].sort((a, b) => b[1].length - a[1].length);
    const G = groups.length, golden = Math.PI * (3 - Math.sqrt(5));
    nodes = []; byKey = new Map();
    groups = groups.map(([name, members], gi) => {
      const r = 0.1 + 0.82 * Math.sqrt((gi + 0.5) / G), a = gi * golden;
      const hue = (hash(name) % 360);
      const g = { name, x: Math.cos(a) * r, y: Math.sin(a) * r, hue, n: members.length, members: [] };
      const R = rnd(hash(name));
      members.forEach((m, j) => {
        const rr = 0.018 + 0.022 * Math.sqrt(j) + R() * 0.012, aa = j * golden + R() * 0.8;
        const node = { ...m, g, x: g.x + Math.cos(aa) * rr, y: g.y + Math.sin(aa) * rr,
          z: 0.35 + R() * 0.65, size: 0.9 + Math.sqrt(m.columns) * 0.32, tw: R() * Math.PI * 2, hue, sx: 0, sy: 0 };
        nodes.push(node); byKey.set(m.key, node); g.members.push(node);
      });
      return g;
    });
    const R = rnd(7);
    dust = Array.from({ length: 480 }, () => ({ x: R() * 2 - 1, y: R() * 2 - 1, z: R(), tw: R() * 6.3 }));
    $("#hud-count").textContent = `${nodes.length} tablo · ${groups.length} küme`;
    loaded = true;
  }

  function resize() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = document.documentElement.clientWidth; H = document.documentElement.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function screen(n) {
    const c = Math.cos(rot * n.z), s = Math.sin(rot * n.z);
    const x = n.x * c - n.y * s, y = n.x * s + n.y * c;
    const px = (mouse.sx - 0.5) * 60 * n.z, py = (mouse.sy - 0.5) * 40 * n.z;
    return [W / 2 + x * W * 0.47 + px + cam.x, H / 2 + y * H * 0.46 + py + cam.y];
  }

  // Where the voyage starts: under the visible search field.
  function searchOrigin() {
    const r = searchbox.getBoundingClientRect();
    return r.width ? [r.left + r.width / 2, Math.min(H - 40, r.bottom + 8)] : [W / 2, 140];
  }
  const P = p => (p.n ? [p.n.sx, p.n.sy] : p.xy);

  // --------------------------------------------------------------- route geometry
  function tour(from, list) {  // nearest-neighbour ordering: a short, readable path
    const rest = [...list], out = [];
    let [cx, cy] = from;
    while (rest.length) {
      let bi = 0, bd = Infinity;
      rest.forEach((n, i) => { const d = (n.sx - cx) ** 2 + (n.sy - cy) ** 2; if (d < bd) { bd = d; bi = i; } });
      const n = rest.splice(bi, 1)[0]; out.push(n); cx = n.sx; cy = n.sy;
    }
    return out;
  }
  function setRoute(points, pxPerSec, closed = false) {
    route = points; dist = 0; lastAlong = 0; speed = pxPerSec; loop = closed; routeAt = t; arrived = points.map(() => 0);
  }
  function lengths() {
    const pts = route.map(P); if (loop && pts.length > 1) pts.push(pts[1]);
    const cum = [0];
    for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    return { pts, cum, total: cum[cum.length - 1] };
  }
  function at(pts, cum, d) {
    let i = 1; while (i < cum.length - 1 && cum[i] < d) i++;
    const seg = cum[i] - cum[i - 1] || 1, k = Math.max(0, Math.min(1, (d - cum[i - 1]) / seg));
    const [x0, y0] = pts[i - 1], [x1, y1] = pts[i];
    return [x0 + (x1 - x0) * k, y0 + (y1 - y0) * k, Math.atan2(y1 - y0, x1 - x0)];
  }
  // Distance along the route; a closed loop circles the finalists (from index 1 on)
  // and never returns to the starting point.
  function along(cum, total) {
    if (!loop || dist <= cum[1]) return Math.min(dist, total);
    return cum[1] + (dist - cum[1]) % Math.max(1, total - cum[1]);
  }
  let lastAlong = 0;
  function shipPos() {
    if (!route.length) return origin;
    const { pts, cum, total } = lengths();
    if (pts.length < 2) return pts[0];
    const [x, y] = at(pts, cum, along(cum, total)); return [x, y];
  }
  function hud(step, replaceLast = false) {
    if (replaceLast) hudSteps.pop();
    if (step) hudSteps.push(step);
    const shown = hudSteps.slice(-4);  // the voyage log: latest steps only
    $("#hud-focus").textContent = (hudSteps.length > shown.length ? "…  →  " : "") + shown.join("  →  ");
  }

  // --------------------------------------------------------------- frame loop
  // The chat model shares the (integrated) GPU with the browser: keep the sky light.
  function frame(now) {
    if (active) raf = requestAnimationFrame(frame);
    const budget = mode === "read" || mode === "wait" ? 50 : 33;
    if (now - last < budget) return;
    // Real time, so the voyage keeps pace even when frames are sparse (busy GPU);
    // capped only to avoid a jump after the tab was in the background.
    const dt = Math.min(1000, now - last); last = now; t += dt;
    const cruising = mode === "idle" || mode === "done";
    if (!reduce && cruising) rot += dt * 0.000018;
    mouse.sx += (mouse.x - mouse.sx) * 0.05; mouse.sy += (mouse.y - mouse.sy) * 0.05;
    steer(dt);
    step(dt);
    draw();
  }

  function steer(dt) {
    const panel = $("#dossier").offsetWidth;
    let tx = 0, ty = 0;
    if (selected && W - panel > 320) {  // phones: the dossier covers the sky, no need to move it
      const [x, y] = screen(selected);
      tx = cam.x + ((W - panel - 12) / 2 - x); ty = cam.y + (H / 2 - y);
    }
    const k = reduce ? 1 : 1 - Math.pow(0.94, dt / 16);
    cam.x += (tx - cam.x) * k; cam.y += (ty - cam.y) * k;
  }

  function step(dt) {
    if (mode === "plan" && t - modeAt >= RADAR_MS) radarDone();
    if (!route.length || !["travel", "read", "final"].includes(mode)) return;
    if (t - routeAt < (mode === "final" ? 150 : 500)) return;  // the route is drawn first
    const { cum, total } = lengths();
    dist += speed * dt / 1000;
    const d = along(cum, total);
    if (d < lastAlong) arrived.fill(0);  // a new lap around the finalists
    lastAlong = d;
    for (let k = 1; k < route.length; k++) if (!arrived[k] && d >= cum[k] - 0.5) arrived[k] = t;
    if (mode === "read") {
      const idx = Math.max(1, cum.findIndex(c => c > d) - 1);
      const n = route[Math.min(idx, route.length - 1)].n;
      if (n && n !== reading) { reading = n; hud(`okunuyor: ${n.name}`, hudSteps.at(-1)?.startsWith("okunuyor")); }
    }
    if (!loop && dist >= total) {
      if (mode === "travel") readExpected ? startReading() : (mode = "wait", modeAt = t);
      else if (mode === "final") { mode = "done"; landedAt = t; }
    }
  }

  function radarDone() {
    const f = pendingFocus, c = pendingCandidates, stop = pendingEnd;
    pendingFocus = pendingCandidates = null; pendingEnd = false;
    if (f) { if (c) showCandidates(c); showFocus(...f); }
    else if (stop) { mode = "idle"; route = []; }
    else if (c) showCandidates(c);
    else patrol();
  }

  function patrol() {  // no candidate list yet: sweep the biggest clusters
    const stops = groups.slice(0, 9).map(g => g.members[0]).filter(Boolean);
    setRoute([{ xy: origin }, ...tour(origin, stops).map(n => ({ n }))], 260);
    mode = "travel"; modeAt = t;
    hud("veri kümeleri taranıyor");
  }

  function startReading() {
    const fin = candidates.slice(0, STATUS && STATUS.shortlist || 8).map(c => byKey.get(c.key)).filter(Boolean);
    if (fin.length < 2) { mode = "wait"; modeAt = t; return; }
    const here = shipPos();
    setRoute([{ xy: here }, ...tour(here, fin).map(n => ({ n }))], 170, true);
    mode = "read"; modeAt = t; reading = null;
    hud(`${fin.length} finalist`); hud("model okuyor");
  }

  // --------------------------------------------------------------- drawing
  function draw() {
    ctx.clearRect(0, 0, W, H);
    const cx = W / 2, cy = H / 2;
    for (const d of dust) {
      const a = 0.25 + 0.35 * Math.sin(t * 0.002 + d.tw);
      ctx.fillStyle = `rgba(200,215,255,${a * (0.3 + d.z * 0.5)})`;
      ctx.fillRect(cx + d.x * W * 0.6, cy + d.y * H * 0.6, 1, 1);
    }
    if (!loaded) return;
    const voyage = mode !== "idle";
    const onRoute = new Set(route.map(p => p.n).filter(Boolean));
    const dim = voyage && mode !== "done" ? 0.3 : focusList.length ? 0.45 : 1;

    ctx.lineWidth = 0.5;
    for (const n of nodes) {
      const [x, y] = screen(n), [gx, gy] = screen({ x: n.g.x, y: n.g.y, z: n.z });
      ctx.strokeStyle = `hsla(${n.hue},80%,70%,${0.05 * dim})`;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(gx, gy); ctx.stroke();
    }
    for (const n of nodes) {
      const [x, y] = screen(n); n.sx = x; n.sy = y;
      const tw = 0.65 + 0.35 * Math.sin(t * 0.0022 + n.tw), r = n.size * (0.6 + n.z * 0.7);
      const kin = !selected || n.g === selected.g ? 1 : 0.4;
      const a = (0.35 + 0.55 * n.z) * tw * (onRoute.has(n) ? 1 : dim) * kin;
      ctx.fillStyle = `hsla(${n.hue},90%,${72 + n.z * 18}%,${a})`;
      ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
    }
    if (mode === "plan") drawPlanning();
    if (route.length > 1 && mode !== "idle") drawRoute();
    drawFocus();
    if (selected) drawSelected();
    if (hover && hover !== selected) ring(hover.sx, hover.sy, 10, "rgba(255,255,255,.8)", 1.2);
  }

  function drawSelected() {  // constellation of its cluster + a turning reticle
    const n = selected, x = n.sx, y = n.sy, age = (t - selectedAt) / 1000, grow = Math.min(1, age * 2.5);
    ctx.lineWidth = 0.8;
    for (const m of n.g.members) {
      if (m === n) continue;
      ctx.strokeStyle = `hsla(${n.hue},90%,75%,${0.16 * grow})`;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + (m.sx - x) * grow, y + (m.sy - y) * grow); ctx.stroke();
      ctx.fillStyle = `hsla(${n.hue},95%,85%,${0.8 * grow})`; ctx.beginPath(); ctx.arc(m.sx, m.sy, 1.6, 0, 6.2832); ctx.fill();
    }
    glow(x, y, 40 * grow, `hsla(${n.hue},95%,68%,.4)`);
    const r = 15 + 14 * (1 - grow), spin = t * 0.0011;
    ctx.strokeStyle = `hsla(${n.hue},95%,82%,${0.95 * grow})`; ctx.lineWidth = 1.6;
    for (let k = 0; k < 4; k++) { const a0 = spin + k * Math.PI / 2 + 0.22; ctx.beginPath(); ctx.arc(x, y, r, a0, a0 + Math.PI / 2 - 0.44); ctx.stroke(); }
    ctx.strokeStyle = `hsla(${n.hue},95%,82%,${0.35 * grow})`; ctx.lineWidth = 1;
    for (let k = 0; k < 4; k++) {  // crosshair ticks
      const a = k * Math.PI / 2; ctx.beginPath();
      ctx.moveTo(x + Math.cos(a) * (r + 5), y + Math.sin(a) * (r + 5)); ctx.lineTo(x + Math.cos(a) * (r + 12), y + Math.sin(a) * (r + 12)); ctx.stroke();
    }
    const p = (age * 0.45) % 1;
    ring(x, y, r + p * 46, `hsla(${n.hue},95%,75%,${0.45 * (1 - p)})`, 1);
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(x, y, 3, 0, 6.2832); ctx.fill();
    label(x + 8, y - 6, n.name, "", grow);
  }

  function drawPlanning() {  // radar pings from the search field while the route is computed
    const [ox, oy] = origin, age = (t - modeAt) / 1000;
    for (let k = 0; k < 3; k++) {
      const p = (age * 0.45 + k / 3) % 1;
      ring(ox, oy, 10 + p * Math.max(W, H) * 0.45, `rgba(124,244,255,${0.35 * (1 - p)})`, 1.2);
    }
    const sweep = age * RADAR_SPEED;
    const g = ctx.createConicGradient ? ctx.createConicGradient(sweep, ox, oy) : null;
    if (g) {
      g.addColorStop(0, "rgba(124,244,255,.09)"); g.addColorStop(0.035, "rgba(124,244,255,0)"); g.addColorStop(1, "rgba(124,244,255,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(ox, oy, Math.max(W, H), 0, 6.2832); ctx.fill();
    }
    drawShip(ox, oy, -Math.PI / 2, 1);
  }

  function drawRoute() {
    const { pts, cum, total } = lengths();
    const reveal = Math.min(1, (t - routeAt) / (mode === "final" ? 300 : 700));
    const planned = total * reveal;
    const d = along(cum, total);
    // planned path ahead (dashed, drawn out progressively)
    ctx.setLineDash([5, 9]); ctx.lineDashOffset = -t * 0.04;
    ctx.strokeStyle = mode === "read" ? "rgba(255,93,214,.45)" : "rgba(124,244,255,.4)"; ctx.lineWidth = 1.2;
    polyline(pts, cum, loop ? 0 : d, planned);
    ctx.setLineDash([]);
    // travelled path (solid, glowing)
    if (!loop) {
      ctx.strokeStyle = "rgba(124,244,255,.18)"; ctx.lineWidth = 6; polyline(pts, cum, 0, d);
      ctx.strokeStyle = "rgba(190,250,255,.9)"; ctx.lineWidth = 1.6; polyline(pts, cum, 0, d);
    }
    // waypoints
    route.forEach((p, k) => {
      if (k === 0 || !p.n) return;
      const [x, y] = P(p), c = candidates.find(c => c.key === p.n.key) || focusList.find(f => f.key === p.n.key);
      const since = arrived[k] ? (t - arrived[k]) / 1000 : -1;
      if (since >= 0 && since < 1.2) ring(x, y, 6 + since * 34, `rgba(124,244,255,${0.8 * (1 - since / 1.2)})`, 1.5);
      ring(x, y, since >= 0 ? 6 : 4, since >= 0 ? "rgba(255,255,255,.85)" : "rgba(124,244,255,.5)", 1.2);
      const show = mode === "read" ? p.n === reading : since >= 0 && since < 2.2 && mode !== "final";
      if (show) label(x, y, mode === "read" ? `okunuyor · ${p.n.name}` : p.n.name,
        c && c.score != null ? `%${Math.round(c.score * 100)}` : "", 1);
    });
    if (mode === "done") {
      const [x, y] = pts[pts.length - 1], a = (t - landedAt) / 1000;
      if (a < 1.6) for (let k = 0; k < 3; k++) ring(x, y, 8 + (a + k * 0.18) * 70, `rgba(61,252,180,${Math.max(0, 0.8 - a * 0.5 - k * 0.15)})`, 2);
      if (a > 4) route = [];
      return;
    }
    const [sx, sy, ang] = at(pts, cum, d);
    trail.push([sx, sy]); if (trail.length > 26) trail.shift();
    drawShip(sx, sy, ang, 1);
  }

  function polyline(pts, cum, from, to) {
    if (to <= from) return;
    const [x0, y0] = at(pts, cum, from);
    ctx.beginPath(); ctx.moveTo(x0, y0);
    for (let i = 1; i < pts.length; i++) {
      if (cum[i] <= from) continue;
      if (cum[i] >= to) { const [x, y] = at(pts, cum, to); ctx.lineTo(x, y); break; }
      ctx.lineTo(pts[i][0], pts[i][1]);
    }
    ctx.stroke();
  }

  function drawShip(x, y, ang, alpha) {
    for (let i = 1; i < trail.length; i++) {  // comet trail
      const k = i / trail.length;
      ctx.strokeStyle = `rgba(124,244,255,${0.5 * k * alpha})`; ctx.lineWidth = 3.5 * k;
      ctx.beginPath(); ctx.moveTo(trail[i - 1][0], trail[i - 1][1]); ctx.lineTo(trail[i][0], trail[i][1]); ctx.stroke();
    }
    glow(x, y, 26, `rgba(124,244,255,${0.45 * alpha})`);
    glow(x, y, 12, `rgba(255,93,214,${0.35 * alpha})`);
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
    ctx.fillStyle = "#ffffff"; ctx.beginPath();
    ctx.moveTo(9, 0); ctx.lineTo(-6, 5); ctx.lineTo(-3, 0); ctx.lineTo(-6, -5); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function glow(x, y, r, color) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, color); g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
  }
  function ring(x, y, r, color, w) { ctx.strokeStyle = color; ctx.lineWidth = w; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.stroke(); }

  function drawFocus() {
    if (!focusList.length || (mode !== "done" && mode !== "idle")) return;
    const age = (t - focusAt) / 1000;
    const pts = focusList.map(f => byKey.get(f.key)).filter(Boolean);
    if (pts.length > 1 && mode === "idle") {
      ctx.setLineDash([6, 8]); ctx.lineDashOffset = -t * 0.03;
      ctx.strokeStyle = "rgba(124,244,255,.45)"; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(pts[0].sx, pts[0].sy);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].sx, pts[i].sy);
      ctx.stroke(); ctx.setLineDash([]);
    }
    focusList.forEach((f, i) => {
      const n = byKey.get(f.key); if (!n) return;
      const appear = Math.max(0, Math.min(1, age * 2 - i * 0.15));
      if (!appear) return;
      const s = Math.max(0.15, f.score || 0), pulse = 1 + 0.2 * Math.sin(t * 0.004 - i);
      glow(n.sx, n.sy, (16 + 26 * s) * pulse * appear, `rgba(124,244,255,${0.32 * appear})`);
      ring(n.sx, n.sy, (7 + 9 * s) * pulse, `rgba(255,255,255,${0.7 * appear})`, 1.3);
      ctx.fillStyle = i === 0 ? "#3dfcb4" : "#fff"; ctx.beginPath(); ctx.arc(n.sx, n.sy, 2.6 + 2 * s, 0, 6.2832); ctx.fill();
      if (i < 6) label(n.sx, n.sy, `${i + 1}. ${f.name}`, f.score != null ? `%${Math.round(f.score * 100)}` : "", appear);
    });
    if (pulseKey && byKey.has(pulseKey)) {
      const n = byKey.get(pulseKey), a = (t - pulseAt) / 1000;
      for (let k = 0; k < 3; k++) { const p = (a * 0.6 + k / 3) % 1; ring(n.sx, n.sy, 6 + p * 60, `rgba(255,93,214,${0.7 * (1 - p)})`, 1.5); }
    }
  }

  function label(x, y, text, score, alpha) {
    ctx.font = "600 12px 'Cascadia Code', Consolas, monospace";
    const w = ctx.measureText(text).width + (score ? 44 : 14), lx = Math.max(8, Math.min(W - w - 8, x + 14)), ly = y - 24;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = "rgba(8,12,30,.85)"; ctx.strokeStyle = "rgba(124,244,255,.45)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.roundRect(lx, ly, w, 20, 9); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#eaf6ff"; ctx.fillText(text, lx + 7, ly + 14);
    if (score) { ctx.fillStyle = "#3dfcb4"; ctx.fillText(score, lx + w - 37, ly + 14); }
    ctx.globalAlpha = 1;
  }

  // --------------------------------------------------------------- interaction
  // With results on the page the galaxy is only a backdrop: no hover, labels or clicks
  // (the pointer kept catching stars between the cards).
  const blocked = el => document.documentElement.classList.contains("has-results")
    || el.closest("header, .res, .answer, .searchbox, button, a, textarea, input, table, details, footer, .dossier");
  function nearest(x, y) {
    let best = null, bd = 14 * 14;
    for (const n of nodes) { const d = (n.sx - x) ** 2 + (n.sy - y) ** 2; if (d < bd) { bd = d; best = n; } }
    return best;
  }
  addEventListener("pointermove", e => {
    mouse.x = e.clientX / innerWidth; mouse.y = e.clientY / innerHeight;
    if (!active) return;
    const n = !blocked(e.target) ? nearest(e.clientX, e.clientY) : null;
    hover = n;
    document.documentElement.classList.toggle("star-hover", !!n);
    if (n) {
      tip.replaceChildren(h("div", { class: "t" }, n.name), h("div", { class: "g" }, `${n.schema} · ${n.columns} kolon`), h("div", { class: "g" }, n.group));
      tip.style.left = e.clientX + "px"; tip.style.top = e.clientY + "px"; tip.classList.add("on");
    } else tip.classList.remove("on");
  }, { passive: true });
  addEventListener("resize", () => { if (active) resize(); });
  // A click on a star opens its dossier; a click elsewhere closes an open one.
  document.addEventListener("click", e => {
    if (!active || !loaded || !e.target.isConnected) return;  // a re-rendered control inside the dossier
    const n = !blocked(e.target) ? nearest(e.clientX, e.clientY) : null;
    if (n) { tip.classList.remove("on"); Dossier.open(n.key); }
    else if (selected && !e.target.closest(".dossier")) Dossier.close();
  });
  document.addEventListener("visibilitychange", () => { if (active) { cancelAnimationFrame(raf); if (!document.hidden) raf = requestAnimationFrame(frame); } });

  async function ensureLoaded() {
    if (loaded) return;
    try { build(await api("/api/galaxy")); } catch { /* the page still works without the map */ }
  }

  return {
    get active() { return active && loaded; },
    get state() { return { mode, dist: Math.round(dist), stops: route.length, speed, t: Math.round(t) }; },
    radarMs: RADAR_MS,
    async setActive(on) {
      active = on; cancelAnimationFrame(raf); tip.classList.remove("on");
      if (!on) return;
      resize(); await ensureLoaded(); last = performance.now(); raf = requestAnimationFrame(frame);
    },
    /** A search starts: plot a route from the search field. */
    begin({ read = false, columns = 0 } = {}) {
      origin = searchOrigin(); mode = "plan"; modeAt = t; readExpected = read;
      route = []; trail = []; candidates = []; focusList = []; reading = null; hudSteps = [];
      pendingCandidates = pendingFocus = null; pendingEnd = false;
      hud(columns ? `${fmt(columns)} kolon taranıyor` : "rota planlanıyor");
    },
    /** Real candidate tables (LLM-free pipeline): the route runs through them. */
    candidates(list) {
      if (!active || !loaded || (mode !== "plan" && mode !== "travel")) return;
      if (mode === "plan" && t - modeAt < RADAR_MS) { pendingCandidates = list; return; }
      showCandidates(list);
    },
    /** Final answer: fly to it, landing on #1; the results stay as a constellation. */
    focus(list, query) {
      if (mode === "plan" && t - modeAt < RADAR_MS && active && loaded) { pendingFocus = [list, query]; return; }
      showFocus(list, query);
    },
    /** Search finished without results / failed: stand down. */
    end() {
      if (mode === "plan" && t - modeAt < RADAR_MS) { pendingEnd = true; return; }  // the radar finishes first
      if (["plan", "travel", "read", "wait"].includes(mode)) { mode = "idle"; route = []; }
    },
    pulse(key) { pulseKey = key; pulseAt = t; },
    /** Mark a star as the open dossier's (null clears); returns its node. */
    select(key) {
      const n = key ? byKey.get(key) || null : null;
      if (n !== selected) { selected = n; selectedAt = t; }
      return n;
    },
    node: key => byKey.get(key) || null,
  };

  function showCandidates(list) {
      candidates = list.filter(c => byKey.has(c.key)).sort((a, b) => (b.score || 0) - (a.score || 0));
      const stops = candidates.slice(0, 12).map(c => byKey.get(c.key));
      if (!stops.length) return;
      setRoute([{ xy: origin }, ...tour(origin, stops).map(n => ({ n }))], 250);
      mode = "travel"; modeAt = t; trail = [];
      hud(`${candidates.length} aday`); hud("rota çizildi");
  }

  function showFocus(list, query) {
      focusList = list.filter(f => f && f.key && byKey.has(f.key));
      focusAt = t;
      if (!active || !loaded || !focusList.length) {
        if (!focusList.length && mode !== "idle") { mode = "idle"; route = []; hud(""); }
        return;
      }
      const from = mode === "idle" ? searchOrigin() : shipPos();
      const stops = [...focusList].reverse().map(f => ({ n: byKey.get(f.key) }));
      trail = []; setRoute([{ xy: from }, ...stops], 900);
      mode = "final"; modeAt = t;
      if (hudSteps.at(-1)?.startsWith("okunuyor")) hudSteps.pop();
      if (hudSteps.at(-1) === "model okuyor" || hudSteps.at(-1) === "rota çizildi") hudSteps.pop();
      if (!hudSteps.length && query) hudSteps.push(`◎ ${query}`);
      hud(`${focusList.length} sonuç · varış: ${focusList[0].name}`);
  }
})();

// ---------------------------------------------------------------- star dossier
// A click on a star opens that table's dictionary entry: every column with its
// description, synonyms, quality flags, KVKK marks and join keys.
const Dossier = (() => {
  const el = $("#dossier"), list = $("#ds-list"), input = $("#ds-q");
  const FLAG = { model_estimated: "Model tahmini", corrected: "Açıklama düzeltildi", needs_verification: "Doğrulanmalı", naming_mismatch: "İsim/içerik uyumsuz", quality_note: "Kalite notu" };
  const FILTERS = [["all", "Tümü"], ["key", "Anahtar"], ["pii", "KVKK"], ["flag", "Uyarılı"]];
  // Turkish-aware folding: "İŞLEM", "işlem" and "islem" all match.
  const fold = s => (s || "").toLocaleLowerCase("tr-TR").replace(/ı/g, "i").normalize("NFD").replace(/[̀-ͯ]/g, "");
  let data = null, keys = new Set(), filter = "all", seq = 0, returnFocus = null;

  // Wraps the matched parts in <mark>; folding keeps one character per character for Turkish text.
  function marked(text, term) {
    const f = fold(text);
    if (!term || f.length !== text.length) return text;
    const out = []; let i = 0, j;
    while ((j = f.indexOf(term, i)) !== -1) { out.push(text.slice(i, j), h("mark", {}, text.slice(j, j + term.length))); i = j + term.length; }
    out.push(text.slice(i));
    return out;
  }
  const kind = c => ({ key: keys.has(c.column), pii: c.pii, flag: c.flags.length > 0 });

  function row(c, i, term) {
    const k = kind(c);
    const r = h("div", { class: "ds-col" + (k.key ? " is-key" : "") + (k.pii ? " is-pii" : ""), role: "button", tabindex: "0", "aria-expanded": "false", style: `--i:${i}` },
      h("div", { class: "ds-ctop" },
        h("span", { class: "ds-cname" }, marked(c.column, term)),
        k.key ? h("span", { class: "ds-badge key", title: "Diğer tablolarla birleştirme anahtarı" }, "ANAHTAR") : null,
        k.pii ? h("span", { class: "ds-badge pii", title: "Kişisel veri (KVKK)" }, "KVKK") : null,
        ...[...new Set(c.flags.map(f => f.kind))].map(f => h("span", { class: "ds-badge flag" }, FLAG[f] || f))),
      c.description ? h("p", { class: "ds-desc" }, marked(c.description, term)) : h("p", { class: "ds-desc none" }, "Açıklama yok"),
      h("div", { class: "ds-more" },
        c.synonyms.length ? h("div", { class: "ds-syn" }, h("b", {}, "Eş anlamlılar"), marked(c.synonyms.join(", "), term)) : null,
        ...c.flags.map(f => h("div", { class: "ds-flagtxt" }, "⚑ " + f.text)),
        !c.synonyms.length && !c.flags.length && c.description.length < 140 ? h("div", { class: "faint" }, "Ek not yok") : null));
    const toggle = () => r.setAttribute("aria-expanded", r.classList.toggle("open"));
    r.addEventListener("click", e => { if (!getSelection().toString()) toggle(); e.stopPropagation(); });
    r.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });
    return r;
  }

  function renderList() {
    if (!data) return;
    const term = fold(input.value.trim());
    const cols = data.columns.filter(c => (filter === "all" || kind(c)[filter]) &&
      (!term || fold(`${c.column} ${c.description} ${c.synonyms.join(" ")}`).includes(term)));
    $("#ds-count").textContent = cols.length === data.columns.length ? `${cols.length}` : `${cols.length} / ${data.columns.length}`;
    put(list, cols.length ? cols.map((c, i) => row(c, i, term))
      : h("div", { class: "ds-empty" }, "Bu filtreye uyan kolon yok."));
    list.scrollTop = 0;
  }

  function renderFilters() {
    put($("#ds-filters"), FILTERS.map(([id, name]) => {
      const n = id === "all" ? data.columns.length : data.columns.filter(c => kind(c)[id]).length;
      return h("button", { class: "ds-filter", type: "button", "aria-pressed": String(filter === id), disabled: !n && id !== "all",
        onclick: () => { filter = id; renderFilters(); renderList(); } }, `${name} · ${n}`);
    }));
  }

  function stat(cls, n, label, i) {
    return h("div", { class: `ds-stat ${cls}${n ? "" : " zero"}`, style: `--i:${i}` }, h("b", {}, n.toLocaleString("tr-TR")), h("span", {}, label));
  }

  async function open(key) {
    const node = Cosmos.select(key);
    const my = ++seq;
    if (!el.classList.contains("on")) returnFocus = document.activeElement;
    el.style.setProperty("--hue", node ? node.hue : 190);
    $("#ds-kicker").textContent = node ? node.group : "Tablo";
    put($("#ds-name"), breakable(node ? node.name : key.split(".").pop()));
    $("#ds-path").textContent = key; $("#ds-path").title = key;
    put($("#ds-stats")); put($("#ds-filters")); put($("#ds-foot")); $("#ds-count").textContent = "";
    put(list, [0, 1, 2, 3, 4].map(() => h("div", { class: "ds-skel" })));
    input.value = ""; filter = "all";
    el.classList.remove("on"); void el.offsetWidth;  // replay the entrance for a new star
    el.classList.add("on"); el.setAttribute("aria-hidden", "false");
    document.documentElement.classList.add("dossier-open");
    try {
      const d = await api("/api/object/" + encodeURIComponent(key));
      if (my !== seq) return;
      data = d; keys = new Set(d.join_keys || []);
      if (d.groups && d.groups.length) $("#ds-kicker").textContent = d.groups.join(" · ");
      const c = d.columns;
      put($("#ds-stats"),
        stat("", c.length, "kolon", 0),
        stat("key", c.filter(x => keys.has(x.column)).length, "anahtar", 1),
        stat("pii", c.filter(x => x.pii).length, "KVKK", 2),
        stat("warn", c.filter(x => x.flags.length).length, "uyarılı", 3));
      renderFilters(); renderList();
      const sibs = node ? node.g.members.filter(m => m !== node).sort((a, b) => b.columns - a.columns).slice(0, 14) : [];
      put($("#ds-foot"), sibs.length ? [h("div", { class: "lbl" }, `Aynı kümede · ${node.g.members.length - 1} tablo`),
        h("div", { class: "ds-sibs" }, sibs.map(m => h("button", { class: "ds-sib", type: "button", title: `${m.schema} · ${m.columns} kolon`, onclick: () => open(m.key) },
          m.name, h("small", {}, m.columns))))] : null);
      if (!$("#ds-foot").childElementCount) $("#ds-foot").classList.add("hidden"); else $("#ds-foot").classList.remove("hidden");
      $("#ds-close").focus({ preventScroll: true });
    } catch (e) {
      if (my === seq) put(list, h("div", { class: "ds-empty" }, "Tablo yüklenemedi: " + e.message));
    }
  }

  function close() {
    if (!el.classList.contains("on")) return;
    seq++; data = null;
    el.classList.remove("on"); el.setAttribute("aria-hidden", "true");
    document.documentElement.classList.remove("dossier-open");
    Cosmos.select(null);
    if (returnFocus && document.contains(returnFocus)) returnFocus.focus({ preventScroll: true });
  }

  input.addEventListener("input", renderList);
  $("#ds-close").onclick = close;
  $("#ds-copy").onclick = async e => {
    const b = e.currentTarget;
    try { await navigator.clipboard.writeText($("#ds-path").textContent); b.textContent = "Kopyalandı ✓"; }
    catch { b.textContent = "Kopyalanamadı"; }
    setTimeout(() => { b.textContent = "Kopyala"; }, 1400);
  };
  document.addEventListener("keydown", e => {
    if (!el.classList.contains("on")) return;
    if (e.key === "Escape") { e.stopImmediatePropagation(); close(); }
    else if (e.key === "/" && document.activeElement !== input) { e.preventDefault(); e.stopImmediatePropagation(); input.focus(); }
  }, true);
  return { open, close, get isOpen() { return el.classList.contains("on"); } };
})();

addEventListener("scroll", () => {
  document.documentElement.classList.toggle("scrolled", scrollY > 120);
  document.documentElement.classList.toggle("lifted", scrollY > 6);  // veil behind the top line
}, { passive: true });

// ---------------------------------------------------------------- boot
Cosmos.setActive(true);
autosize();
loadStatus();
q.focus();
</script>
</body>
</html>
