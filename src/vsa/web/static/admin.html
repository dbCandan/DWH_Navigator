<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DWH Navigator · Yönetim</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%231F3864'/%3E%3Cpath d='M16 5l4 11-4 11-4-11z' fill='%23F2B84B'/%3E%3C/svg%3E">
<style>
/* =====================================================================
   DWH Navigator · Yönetim — one sidebar, six pages, details in a drawer,
   a command palette for everything. The app's "Evren" palette.
   ===================================================================== */
:root {
  color-scheme: dark;
  --bg: #04060f; --side: rgba(9, 12, 28, .86);
  --surface: rgba(17, 22, 48, .74); --surface-2: rgba(130, 150, 255, .08); --surface-3: rgba(130, 150, 255, .14);
  --line: rgba(140, 165, 255, .16); --line-2: rgba(140, 165, 255, .28);
  --text: #eef1ff; --muted: #a3acd6; --faint: #6c75a0;
  --accent: #7cf4ff; --accent-soft: rgba(124, 244, 255, .12); --violet: #8b5cff; --pink: #ff5dd6;
  --ok: #3dfcb4; --ok-bg: rgba(61, 252, 180, .12); --warn: #ffd166; --warn-bg: rgba(255, 209, 102, .12);
  --bad: #ff6b93; --bad-bg: rgba(255, 93, 143, .13);
  --k-step: #33b8d6; --k-llm: #9a7bff;
  --grad: linear-gradient(120deg, #7cf4ff, #8b5cff 55%, #ff5dd6);
  --radius: 16px; --shadow: 0 18px 50px rgba(0, 0, 0, .45);
  --mono: "Cascadia Code", Consolas, "SFMono-Regular", Menlo, monospace;
  --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
  --display: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html { background: radial-gradient(1200px 700px at 85% -15%, rgba(139, 92, 255, .2), transparent 60%),
                   radial-gradient(900px 600px at -10% 115%, rgba(255, 93, 214, .1), transparent 60%), var(--bg);
       background-attachment: fixed; }
body { margin: 0; color: var(--text); font: 14px/1.5 var(--sans); min-height: 100vh; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--accent); }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
::selection { background: rgba(124, 244, 255, .3); }
h1, h2, h3 { font-family: var(--display); letter-spacing: -.2px; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 14px; padding: 16px 12px;
  background: var(--side); border-right: 1px solid var(--line); backdrop-filter: blur(18px) saturate(140%); }
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px; text-decoration: none; color: var(--text); }
.brand svg { flex: none; }
.brand b { display: block; font: 700 15.5px/1.15 var(--display); }
.brand small { color: var(--muted); font-size: 12px; }
.cmdk-open { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 10px; border-radius: 11px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); font-size: 13px; text-align: left; }
.cmdk-open:hover { border-color: var(--line-2); color: var(--text); }
.cmdk-open span { flex: 1; }
kbd { font: 600 11px var(--mono); padding: 1px 6px; border-radius: 6px; border: 1px solid var(--line-2); color: var(--muted); background: rgba(0, 0, 0, .2); }
nav.menu { display: flex; flex-direction: column; gap: 2px; }
nav.menu .grp { font: 700 10.5px var(--mono); letter-spacing: 1.2px; text-transform: uppercase; color: var(--faint); padding: 10px 10px 4px; }
nav.menu a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 11px; text-decoration: none; color: var(--muted); font-weight: 600; position: relative; }
nav.menu a svg { width: 18px; height: 18px; flex: none; }
nav.menu a:hover { background: var(--surface-2); color: var(--text); }
nav.menu a[aria-current="page"] { background: var(--surface-3); color: var(--text); }
nav.menu a[aria-current="page"]::before { content: ""; position: absolute; left: -12px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--grad); }
nav.menu .lbl { flex: 1; }
.bdg { min-width: 18px; height: 18px; padding: 0 6px; border-radius: 999px; font: 700 11px/18px var(--sans); text-align: center; }
.bdg.dot { min-width: 9px; width: 9px; height: 9px; padding: 0; }
.bdg.ok { background: var(--ok); } .bdg.warn { background: var(--warn); color: #241a00; } .bdg.bad { background: var(--bad); color: #2a0010; }
.bdg.count { background: var(--accent); color: #031018; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
.sys { display: grid; gap: 6px; padding: 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); font-size: 12px; }
.sys div { display: flex; align-items: center; gap: 7px; color: var(--muted); min-width: 0; }
.sys div span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.led { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--faint); }
.led.ok { background: var(--ok); box-shadow: 0 0 0 3px rgba(61, 252, 180, .15); }
.led.warn { background: var(--warn); box-shadow: 0 0 0 3px rgba(255, 209, 102, .15); }
.led.bad { background: var(--bad); box-shadow: 0 0 0 3px rgba(255, 93, 143, .15); }
.back { display: block; padding: 8px 10px; border-radius: 11px; color: var(--muted); text-decoration: none; font-weight: 600; font-size: 13px; }
.back:hover { color: var(--text); background: var(--surface-2); }

main { min-width: 0; padding: 22px 28px 90px; }
.page { display: none; }
.page.on { display: block; animation: rise .25s ease both; }
.ph { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
.ph .t { flex: 1 1 360px; min-width: 0; }
.ph h1 { margin: 0; font-size: 25px; }
.ph p { margin: 2px 0 0; color: var(--muted); font-size: 13.5px; }
.ph .acts { display: flex; gap: 8px; flex-wrap: wrap; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ---------- building blocks ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 14px; backdrop-filter: blur(16px) saturate(140%); }
.card > h2 { margin: 0 0 2px; font-size: 16.5px; }
.card > .intro { margin: 0 0 10px; color: var(--muted); font-size: 13px; }
.card-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.card-h h2 { margin: 0; font-size: 16.5px; flex: 1; }
.btn { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line-2); background: var(--surface-2); border-radius: 11px;
  padding: 7px 13px; cursor: pointer; font-weight: 600; font-size: 13.5px; color: var(--text); text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn svg { width: 16px; height: 16px; }
.btn.primary { background: var(--grad); color: #050a18; border: 0; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.sm { padding: 4px 10px; font-size: 12.5px; border-radius: 9px; }
.btn.ghost { background: none; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--text); border-color: var(--line); }
.btn.danger { color: var(--bad); }
.btn.danger:hover { border-color: var(--bad); }
.btn:disabled { opacity: .45; cursor: default; pointer-events: none; }
.note { color: var(--muted); font-size: 12.5px; }
.muted { color: var(--muted); } .faint { color: var(--faint); }
.mono { font-family: var(--mono); font-size: .92em; }
.msg { border-radius: 11px; padding: 9px 12px; font-size: 13px; margin: 8px 0; border: 1px solid transparent; }
.msg.warn { background: var(--warn-bg); border-color: rgba(255, 209, 102, .25); }
.msg.bad { background: var(--bad-bg); border-color: rgba(255, 93, 143, .3); color: #ffd0dc; }
.msg.ok { background: var(--ok-bg); border-color: rgba(61, 252, 180, .25); }
.msg.info { background: var(--accent-soft); border-color: rgba(124, 244, 255, .22); }
.msg ul { margin: 6px 0 0; padding-left: 18px; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 700; white-space: nowrap; border: 1px solid var(--line); color: var(--muted); }
.pill.ok { color: var(--ok); background: var(--ok-bg); border-color: transparent; }
.pill.warn { color: var(--warn); background: var(--warn-bg); border-color: transparent; }
.pill.bad { color: var(--bad); background: var(--bad-bg); border-color: transparent; }
.pill.acc { color: var(--accent); background: var(--accent-soft); border-color: transparent; }
.empty { color: var(--muted); padding: 34px 10px; text-align: center; }
.skel { height: 14px; border-radius: 7px; background: linear-gradient(90deg, var(--surface-2), var(--surface-3), var(--surface-2)); background-size: 200% 100%; animation: shimmer 1.2s infinite linear; margin: 10px 0; }
@keyframes shimmer { to { background-position: -200% 0; } }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 11px; overflow: hidden; background: var(--surface-2); }
.seg button { border: 0; background: none; padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--surface-3); color: var(--text); }
input[type=text], input[type=search], input[type=password], input[type=number], select {
  border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; background: rgba(3, 5, 14, .5); outline: 0; min-width: 0; }
input:focus, select:focus { border-color: var(--accent); }
select option { background: #0e1228; }
.switch { position: relative; display: inline-block; width: 40px; height: 22px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; position: absolute; }
.switch span { position: absolute; inset: 0; border-radius: 22px; background: var(--surface-3); border: 1px solid var(--line-2); cursor: pointer; transition: background .15s; }
.switch span::after { content: ""; position: absolute; width: 16px; height: 16px; left: 2px; top: 2px; border-radius: 50%; background: var(--text); transition: transform .15s; }
.switch input:checked + span { background: var(--accent); border-color: var(--accent); }
.switch input:checked + span::after { transform: translateX(18px); background: #031018; }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.switch input:disabled + span { opacity: .5; cursor: default; }
table.t { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.t th { text-align: left; font: 700 11px var(--sans); text-transform: uppercase; letter-spacing: .5px; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; position: sticky; top: 0; background: #0d1128; z-index: 1; }
table.t td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t .r { text-align: right; }
table.t tr.click { cursor: pointer; }
table.t tr.click:hover td { background: var(--surface-2); }
table.t tr.sel td { background: var(--surface-3); }
.scroll { overflow: auto; }
.list-box { max-height: calc(100vh - 330px); min-height: 220px; overflow: auto; margin: 0 -18px -16px; padding: 0 18px 10px; }
kv, dl.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; margin: 6px 0; font-size: 13.5px; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; overflow-wrap: anywhere; }
.grid { display: grid; gap: 14px; }
.g4 { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.g2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 430px), 1fr)); }
.more { display: flex; justify-content: center; padding: 12px 0 2px; }
.tag { display: inline-block; font-size: 11.5px; font-weight: 600; border-radius: 7px; padding: 1px 8px; background: var(--surface-3); color: var(--muted); white-space: nowrap; }

/* ---------- overview ---------- */
.health { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; margin-bottom: 14px; }
.hc { position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); backdrop-filter: blur(16px); }
.hc::after { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--faint); }
.hc.ok::after { background: var(--ok); } .hc.warn::after { background: var(--warn); } .hc.bad::after { background: var(--bad); }
.hc .k { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
.hc .k svg { width: 17px; height: 17px; }
.hc .v { font: 700 21px/1.2 var(--display); overflow-wrap: anywhere; }
.hc .s { color: var(--muted); font-size: 12.5px; flex: 1; }
.hc .btn { align-self: flex-start; }
.setup { border-color: rgba(124, 244, 255, .3); background: linear-gradient(135deg, rgba(124, 244, 255, .08), rgba(139, 92, 255, .08)); }
.steps { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 8px; }
.steps li { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); }
.steps li .n { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 13px; flex: none; border: 1px solid var(--line-2); }
.steps li.done .n { background: var(--ok); color: #03140d; border: 0; }
.steps li .tx { flex: 1; } .steps li .tx small { display: block; color: var(--muted); }
.steps li.done .tx b { text-decoration: line-through; color: var(--muted); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 10px; }
.kpi { padding: 10px 12px; border-radius: 12px; background: var(--surface-2); min-width: 0; }
.kpi .k { color: var(--muted); font-size: 12px; font-weight: 600; }
.kpi .v { font: 700 22px/1.25 var(--display); font-variant-numeric: tabular-nums; }
.kpi .s { color: var(--faint); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chart { width: 100%; height: auto; display: block; margin-top: 10px; }
.chart .bar-ok { fill: url(#gr-bar); } .chart .bar-no { fill: rgba(255, 107, 147, .55); }
.chart text { fill: var(--faint); font: 10px var(--mono); }
.chart .base { stroke: var(--line); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 11px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
.recent { list-style: none; margin: 0; padding: 0; }
.recent li a { display: grid; grid-template-columns: 74px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 6px; border-bottom: 1px solid var(--line); color: var(--text); text-decoration: none; border-radius: 8px; }
.recent li a:hover { background: var(--surface-2); }
.recent .w { color: var(--faint); font: 12px var(--mono); }
.recent .q { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- analyses ---------- */
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.toolbar input[type=search] { flex: 1 1 220px; }
.toolbar .live { display: inline-flex; gap: 7px; align-items: center; color: var(--muted); font-size: 13px; }
.kpis.a { margin-bottom: 14px; }
.vb { display: inline-block; font-size: 11px; font-weight: 800; border-radius: 6px; padding: 1px 7px; margin-right: 6px; white-space: nowrap; }
.vb.VAR { background: var(--ok-bg); color: var(--ok); } .vb.KISMEN { background: var(--warn-bg); color: var(--warn); }
.vb.BULUNAMADI { background: var(--bad-bg); color: var(--bad); } .vb.none { background: var(--surface-3); color: var(--muted); }
.flow { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.flow.analist { color: var(--ok); } .flow.önbellek { color: var(--accent); } .flow.yapılamadı, .flow.yedek, .flow.kural { color: var(--warn); }
.flow.hata { color: var(--bad); } .flow.durduruldu { color: var(--muted); }
td.when { white-space: nowrap; color: var(--faint); font: 12px var(--mono); }
td.qq .q { font-weight: 600; overflow-wrap: anywhere; }
td.qq .a { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
td.qq .orig { margin-left: 8px; color: var(--faint); font-size: 12px; font-weight: 400; }
td.dur { white-space: nowrap; font: 12.5px var(--mono); text-align: right; }

/* ---------- drawer ---------- */
.drawer { position: fixed; inset: 0; z-index: 40; display: flex; justify-content: flex-end; background: rgba(2, 3, 10, .55); backdrop-filter: blur(3px); animation: fade .15s ease both; }
.drawer-panel { width: min(760px, 100%); height: 100%; display: flex; flex-direction: column; background: #0b0f24; border-left: 1px solid var(--line-2); box-shadow: var(--shadow); animation: slide .22s cubic-bezier(.2, .8, .2, 1) both; }
.drawer.wide .drawer-panel { width: min(1000px, 100%); }
.drawer-h { display: flex; align-items: flex-start; gap: 10px; padding: 16px 20px 12px; border-bottom: 1px solid var(--line); }
.drawer-h .t { flex: 1; min-width: 0; }
.drawer-h h2 { margin: 0; font-size: 18px; overflow-wrap: anywhere; }
.drawer-h .sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; overflow-wrap: anywhere; }
.drawer-b { flex: 1; overflow: auto; padding: 16px 20px 24px; }
.drawer-f { display: flex; align-items: center; gap: 10px; padding: 12px 20px; border-top: 1px solid var(--line); }
.drawer-f .grow { flex: 1; }
@keyframes fade { from { opacity: 0; } }
@keyframes slide { from { transform: translateX(40px); opacity: 0; } }
.sec-t { font: 700 11px var(--mono); letter-spacing: 1.1px; text-transform: uppercase; color: var(--faint); margin: 18px 0 8px; }
.stack { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--surface-2); margin: 8px 0; }
.stack i { display: block; height: 100%; }
.ph-wait { background: #6c75a0; } .ph-check { background: #4ad1c8; } .ph-rules { background: #33b8d6; } .ph-pick { background: #8b5cff; } .ph-write { background: #ff5dd6; }
ul.phases { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 13px; }
ul.phases li { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 10px; align-items: center; }
ul.phases li i { width: 12px; height: 12px; border-radius: 3px; }
ul.phases li small { grid-column: 2 / 3; color: var(--faint); margin-top: -3px; }
ul.phases li span { font: 12.5px var(--mono); color: var(--muted); }
.wf { display: grid; grid-template-columns: minmax(150px, 36%) minmax(0, 1fr) 70px; gap: 3px 10px; align-items: center; font-size: 12.5px; }
.wf .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wf .lane { position: relative; height: 15px; border-radius: 3px; background: repeating-linear-gradient(90deg, transparent 0 calc(25% - 1px), var(--line) calc(25% - 1px) 25%); }
.wf .bar { position: absolute; top: 3px; bottom: 3px; border-radius: 0 3px 3px 0; min-width: 2px; }
.wf .bar.step { background: var(--k-step); } .wf .bar.llm { background: var(--k-llm); }
.wf .bar.event { background: repeating-linear-gradient(45deg, var(--warn) 0 3px, transparent 3px 6px); box-shadow: inset 0 0 0 1px var(--warn); }
.wf .bar.error { box-shadow: 0 0 0 2px var(--bad); }
.wf .ms { font: 11.5px var(--mono); color: var(--muted); text-align: right; white-space: nowrap; }
.wf .why { grid-column: 1 / -1; color: var(--faint); font-size: 11.5px; margin: -2px 0 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wf .err { color: var(--bad); font-weight: 800; margin-right: 4px; }
details.fold { border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; margin: 12px 0; background: var(--surface-2); }
details.fold > summary { cursor: pointer; list-style: none; padding: 10px 0; font-weight: 600; color: var(--muted); display: flex; align-items: center; gap: 8px; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::before { content: "›"; font-size: 17px; line-height: 1; transition: transform .15s; }
details.fold[open] > summary::before { transform: rotate(90deg); }
details.fold[open] > summary { color: var(--text); }
details.fold > :last-child { padding-bottom: 12px; }
.hbars { display: grid; grid-template-columns: minmax(120px, max-content) minmax(0, 1fr) auto; gap: 7px 12px; align-items: center; font-size: 13px; }
.hbars .tr { height: 11px; border-radius: 0 4px 4px 0; background: var(--surface-2); position: relative; }
.hbars .tr i { position: absolute; inset: 0 auto 0 0; border-radius: 0 4px 4px 0; background: var(--k-step); min-width: 2px; }
.hbars .v { font: 12px var(--mono); color: var(--muted); }

/* ---------- settings rows ---------- */
.row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 340px); gap: 14px; padding: 11px 0; border-top: 1px solid var(--line); align-items: center; scroll-margin-top: 90px; }
.row:first-of-type { border-top: 0; }
.row .lab { font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.row .help { color: var(--muted); font-size: 12.5px; margin-top: 1px; }
.ph p, .card > .intro, .row .help, .card > .note, .fold > .note { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .key { font: 11px var(--mono); color: var(--faint); }

function modelState() {

  const r = L.roles.chat;

const PAGES = {};
function parseHash() {
  const parts = location.hash.replace(/^#\/?/, "").split("/");

}
async function route() {
  const { page, arg } = parseHash();

    $$(".page").forEach(p => p.classList.toggle("on", p.id === "p-" + page));
    $$("nav.menu a").forEach(a => { if (a.id === "nav-" + page) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
    const cur = $("#nav-" + page), menu = $("#nav");  // narrow screens: the menu scrolls sideways
    if (cur && menu.scrollWidth > menu.clientWidth) cur.scrollIntoView({ inline: "center", block: "nearest" });
    const n = NAV.find(x => x.id === page);
    document.title = `${n ? n.label : "Yönetim"} · DWH Navigator`;
    CURRENT = page;
    if (Drawer.isOpen()) Drawer.close(true);
    $("#main").scrollTop = 0; scrollTo(0, 0);

  try { await PAGES[page].show(arg); }
  catch (e) { put($("#p-" + page), pageHead(NAV.find(x => x.id === page).label, ""), h("div", { class: "msg bad" }, "Sayfa yüklenemedi: " + e.message)); }
}

// ======================================================================= settings fields (shared by pages)
const Settings = {
  saved: {}, form: {}, fields: {}, rows: {},
  adopt() {
    // New values from the server; edits not saved yet stay in the form.
    const S = DATA.settings, pending = {};
    for (const k of Object.keys(this.fields)) if (this.changed(k)) pending[k] = this.form[k];
    this.saved = { ...S.values }; this.form = { ...S.values }; this.fields = {};
    for (const [k, v] of Object.entries(pending)) if (k in S.values) this.form[k] = v;
    for (const sec of S.sections) for (const f of sec.fields) this.fields[f.key] = { ...f, page: PAGE_OF_SECTION[sec.page] || sec.page, section: sec.title };
    this.rows = {};
  },
  eq: (a, b) => (typeof a === "number" && typeof b === "number" ? Math.abs(a - b) < 1e-9 : a === b),
  changed(k) { return !this.eq(this.form[k], this.saved[k]); },
  changedKeys() { return Object.keys(this.fields).filter(k => this.changed(k)); },
  changedByPage() { const out = {}; for (const k of this.changedKeys()) { const p = this.fields[k].page; out[p] = (out[p] || 0) + 1; } return out; },
  show(f, v) { return f.format === "pct" ? `%${Math.round(v * 100)}` : (typeof v === "number" ? (f.step && f.step < 1 ? Number(v).toFixed(f.step < 0.1 ? 2 : 1) : String(v)) : (v || "boş")); },
  control(f) {
    const key = f.key, v = this.form[key];
    const set = val => { this.form[key] = val; this.mark(key); };
    if (f.type === "bool") {
      const inp = h("input", { type: "checkbox", "aria-label": f.label });
      inp.checked = !!v; inp.onchange = () => set(inp.checked);
      return h("label", { class: "switch" }, inp, h("span"));
    }
    if (f.type === "int" || f.type === "float") {
      const step = f.step || (f.type === "int" ? 1 : 0.05);
      const parse = x => (f.type === "int" ? parseInt(x, 10) : parseFloat(x));
      const range = h("input", { type: "range", min: f.min, max: f.max, step, value: v, "aria-label": f.label });
      if (f.format === "pct") {
        const out = h("span", { class: "readout" }, this.show(f, v));
        range.oninput = () => { const x = parse(range.value); out.textContent = this.show(f, x); set(x); };
        return [range, out];
      }
      const nb = h("input", { type: "number", min: f.min, max: f.max, step, value: this.show(f, v), "aria-label": f.label });
      range.oninput = () => { nb.value = this.show(f, parse(range.value)); set(parse(range.value)); };
      nb.oninput = () => { const x = parse(nb.value); if (!Number.isNaN(x)) { range.value = x; set(x); } };
      return [range, nb];
    }
    const inp = h("input", { type: "text", value: v ?? "", "aria-label": f.label, spellcheck: "false" });
    inp.oninput = () => set(inp.value);
    return inp;
  },
  row(f) {
    const S = DATA.settings;
    const reset = h("button", { class: "reset", type: "button", title: `Varsayılana dön: ${this.show(f, S.defaults[f.key])}`, "aria-label": "Varsayılana dön",
      onclick: () => { this.form[f.key] = S.defaults[f.key]; this.rerender(f.key); } }, "↺");
    const r = h("div", { class: "row", id: "row-" + f.key },
      h("div", {}, h("div", { class: "lab", title: f.key }, f.label, f.effect === "indeks" ? h("span", { class: "eff", title: "Kaydedince arama indeksi yeniden kurulmalı" }, "indeks") : null),
        f.help ? h("div", { class: "help", title: f.help }, f.help) : null),
      h("div", { class: "ctl" }, this.control(f), reset));
    this.rows[f.key] = r;
    this.paint(f.key);
    return r;
  },
  rerender(key) { const old = this.rows[key]; if (old) old.replaceWith(this.row(this.fields[key])); this.mark(key); },
  paint(k) {
    const r = this.rows[k]; if (!r) return;
    r.classList.toggle("changed", this.changed(k));
    r.classList.toggle("nondefault", !this.eq(this.form[k], DATA.settings.defaults[k]));
  },
  mark(k) { this.paint(k); this.bar(); Shell.refresh(); },
  bar() {
    const keys = this.changedKeys();
    $("#savebar").classList.toggle("on", keys.length > 0);
    document.body.classList.toggle("unsaved", keys.length > 0);
    $("#save-msg").textContent = `${keys.length} değişiklik kaydedilmedi`;
    const pages = [...new Set(keys.map(k => this.fields[k].page))].map(p => (NAV.find(n => n.id === p) || {}).label || p);

  // One settings section as a card: plain fields, then its expert fields folded.
  card(sec) {

    return h("section", { class: "card", id: "sec-" + sec.id },
      h("h2", {}, sec.title), sec.intro ? h("p", { class: "intro", title: sec.intro }, sec.intro) : null,
      basic.map(f => this.row(this.fields[f.key])),
      adv.length ? h("details", { class: "fold" }, h("summary", {}, `Uzman ayarları (${adv.length})`), adv.map(f => this.row(this.fields[f.key]))) : null);
  },
  sections(page) { return DATA.settings.sections.filter(s => (PAGE_OF_SECTION[s.page] || s.page) === page); },
  async save() {

    try {
      const r = await post("/api/settings", { values });

        r.reindex_needed.length ? "Arama indeksi yeniden kurulmalı (Bakım → Arama indeksi)." : null]);

  focus(key) {
    const f = this.fields[key]; if (!f) return;

    const find = () => {  // the page may still be loading: wait for the row to be drawn
      const r = this.rows[key];
      if (!r || !r.isConnected) { if (++tries < 40) setTimeout(find, 75); return; }

  },
};

  const t = h("div", { class: "toast" }, h("b", {}, "İçe aktarılıyor…"), h("div", {}, `${f.name} okunuyor, doğrulanıyor ve indeks kuruluyor.`));

addEventListener("dragleave", () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) $("#dropzone").hidden = true; });

const Palette = {
  el: null, items: [], idx: 0,
  catalog() {
    const out = [];
    for (const n of NAV) if (n.id) out.push({ grp: "Sayfalar", icon: n.icon, t: n.label, s: n.desc, run: () => go(n.id) });
    const acts = [
      ["upload", "Sözlüğü Excel'den içe aktar", "Şablondaki Excel sözlüğün yerini alır", () => pickFile()],
      ["download", "Sözlüğü Excel olarak dışa aktar", "Şablona uygun Excel", () => { location.href = "/api/admin/dictionary/export"; }],
      ["file", "Boş sözlük şablonunu indir", "Objeler · Kolonlar", () => { location.href = "/api/admin/dictionary/template"; }],
      ["refresh", "Arama indeksini yeniden kur", "birkaç saniye", () => reindex()],
      ["plus", "Yeni model entegrasyonu", "Yapay zekâ", () => { go("yapay-zeka"); setTimeout(() => AI.editor(null), 150); }],
      ["list", "Model envanteri", "Sunuculardaki modeller", () => { go("yapay-zeka"); setTimeout(() => AI.inventory(), 150); }],
      ["gauge", "Performans ayrıntıları", "Analizler", () => { go("analizler"); setTimeout(() => Analyses.perf(), 300); }],
      ["arrow", "Uygulamaya dön", "Soru sorma ekranı", () => { location.href = "/"; }],
    ];
    for (const [ic, t, s, run] of acts) out.push({ grp: "İşlemler", icon: ic, t, s, run });
    if (DATA.settings) for (const f of Object.values(Settings.fields))
      out.push({ grp: "Ayarlar", icon: "sliders", t: f.label, s: `${(NAV.find(n => n.id === f.page) || {}).label || ""} · ${f.section}${f.help ? " — " + f.help : ""}`, run: () => Settings.focus(f.key) });
    const d = dictState();
    if (d.tables) for (const t of d.tables) out.push({ grp: "Tablolar", icon: "db", t: t.name, s: `${t.group || t.key.split(".").slice(0, 2).join(".")} · ${t.columns} kolon`, key: t.key, run: () => go("sozluk/" + encodeURIComponent(t.key)) });
    if (DATA.analyses) for (const e of DATA.analyses.items.slice(0, 200)) out.push({ grp: "Son sorular", icon: "chart", t: e.query, s: `${when(e.at)} · ${e.verdict || e.flow}`, run: () => go("analizler/" + encodeURIComponent(e.id)) });
    return out;
  },
  open() {
    if (this.el) return;
    const input = h("input", { type: "text", placeholder: "Sayfa, ayar, işlem, tablo ya da soru ara…", "aria-label": "Komut ara", autocomplete: "off", spellcheck: "false" });
    const list = h("div", { class: "palette-list", role: "listbox" });
    this.el = h("div", { class: "palette", onclick: e => { if (e.target === this.el) this.close(); } },
      h("div", { class: "palette-box" }, input, list, h("div", { class: "palette-foot" }, h("span", {}, h("kbd", {}, "↑↓"), " seç"), h("span", {}, h("kbd", {}, "Enter"), " git"), h("span", {}, h("kbd", {}, "Esc"), " kapat"))));
    document.body.append(this.el);
    const all = this.catalog();
    const draw = () => {
      const words = fold(input.value).split(/\s+/).filter(Boolean);
      const score = it => { const hay = fold(it.t + " " + it.s); if (!words.every(w => hay.includes(w))) return -1; return words.reduce((s, w) => s + (fold(it.t).includes(w) ? 3 : 1) + (fold(it.t).startsWith(w) ? 2 : 0), 0); };
      let shown = words.length ? all.map(it => [it, score(it)]).filter(x => x[1] >= 0).sort((a, b) => b[1] - a[1]).map(x => x[0]) : all.filter(it => it.grp === "Sayfalar" || it.grp === "İşlemler");
      shown = shown.slice(0, 60);
      this.items = shown; this.idx = 0;
      const nodes = []; let last = "";
      shown.forEach((it, i) => {
        if (it.grp !== last) { nodes.push(h("div", { class: "grp" }, it.grp)); last = it.grp; }
        nodes.push(h("div", { class: "pi" + (i === 0 ? " on" : ""), role: "option", "data-i": i, onclick: () => this.run(i), onmousemove: () => this.select(i) },
          icon(it.icon), h("div", { class: "tx" }, h("div", {}, it.t), it.s ? h("small", {}, it.s) : null)));
      });
      put(list, nodes.length ? nodes : h("p", { class: "empty" }, "Eşleşen bir şey yok."));
    };
    input.oninput = draw;
    input.onkeydown = e => {
      if (e.key === "ArrowDown") { e.preventDefault(); this.select(Math.min(this.items.length - 1, this.idx + 1)); }
      else if (e.key === "ArrowUp") { e.preventDefault(); this.select(Math.max(0, this.idx - 1)); }
      else if (e.key === "Enter") { e.preventDefault(); this.run(this.idx); }
    };
    draw(); input.focus();
  },
  select(i) {
    this.idx = i;
    $$(".pi", this.el).forEach(n => n.classList.toggle("on", Number(n.dataset.i) === i));
    const on = $(".pi.on", this.el); if (on) on.scrollIntoView({ block: "nearest" });
  },
  run(i) { const it = this.items[i]; if (!it) return; this.close(); it.run(); },
  close() { if (this.el) { this.el.remove(); this.el = null; } },
};
$("#cmdk-open").onclick = () => Palette.open();

// ======================================================================= keyboard and startup
addEventListener("keydown", e => {
  const typing = /^(INPUT|SELECT|TEXTAREA)$/.test((e.target || {}).tagName || "");
  if ((e.ctrlKey || e.metaKey) && (e.key === "k" || e.key === "K")) { e.preventDefault(); Palette.el ? Palette.close() : Palette.open(); return; }
  if (e.key === "Escape") { if (Palette.el) { Palette.close(); return; } if (Drawer.isOpen()) { Drawer.close(); return; } }
  if (!typing && Drawer.isOpen() && CURRENT === "analizler" && (e.key === "ArrowDown" || e.key === "ArrowUp")) { e.preventDefault(); Analyses.step(e.key === "ArrowDown" ? 1 : -1); }
  if (!typing && !Palette.el && !Drawer.isOpen() && e.key === "/") { const s = $(".page.on input[type=search]"); if (s) { e.preventDefault(); s.focus(); } }
});
$("#save").onclick = () => Settings.save();
$("#revert").onclick = () => Settings.revert();
addEventListener("beforeunload", e => { if (Settings.changedKeys && DATA.settings && Settings.changedKeys().length) { e.preventDefault(); e.returnValue = ""; } });
addEventListener("hashchange", route);
Shell.build();
Promise.all([LOAD.settings(), LOAD.llm(), LOAD.dict()].map(p => p.catch(() => null))).then(() => Shell.refresh());
route();
</script>
</body>
