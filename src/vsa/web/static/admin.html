<style>
:root {
  --paper: #f5f3ee; --surface: #ffffff; --surface-2: #f0ede6; --line: #dcd6ca;
  --text: #17223a; --muted: #5d6679; --faint: #8b93a3; --ink-2: #1F3864;
  --accent: #d9962b; --accent-soft: #f7e6c6;
  --high: #1d7a4c; --high-bg: #d8f0e2; --mid: #9a6b00; --mid-bg: #fbeec2; --low: #b3362e; --low-bg: #f9d9d5;
  --shadow: 0 1px 2px rgba(15,28,51,.06), 0 6px 24px rgba(15,28,51,.07); --radius: 14px;
  --mono: "Cascadia Code", Consolas, "SFMono-Regular", Menlo, monospace;
  --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
  --display: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  --primary-bg: #1F3864; --primary-fg: #fff;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark;
  --paper: #0c1322; --surface: #121c30; --surface-2: #19243b; --line: #26324b; --text: #e6e9f0; --muted: #a2abbd; --faint: #6f7a90;
  --accent: #f2b84b; --accent-soft: #3a2f16; --high: #5fd39a; --high-bg: #123526; --mid: #f2c14e; --mid-bg: #3a3012; --low: #ff8a80; --low-bg: #3d1c1a;
  --shadow: 0 8px 28px rgba(0,0,0,.35); --primary-bg: #f2b84b; --primary-fg: #1a1406; } }
:root[data-theme="dark"] { color-scheme: dark;
  --paper: #0c1322; --surface: #121c30; --surface-2: #19243b; --line: #26324b; --text: #e6e9f0; --muted: #a2abbd; --faint: #6f7a90;
  --accent: #f2b84b; --accent-soft: #3a2f16; --high: #5fd39a; --high-bg: #123526; --mid: #f2c14e; --mid-bg: #3a3012; --low: #ff8a80; --low-bg: #3d1c1a;
  --shadow: 0 8px 28px rgba(0,0,0,.35); --primary-bg: #f2b84b; --primary-fg: #1a1406; }
/* Evren skin: same palette as the app's galaxy look (static sky, no canvas here) */
html[data-skin="evren"] { color-scheme: dark;
  --paper: #03040b; --surface: rgba(14,18,40,.72); --surface-2: rgba(130,150,255,.09); --line: rgba(140,165,255,.2);
  --text: #eef1ff; --muted: #a3acd6; --faint: #6f78a3; --ink-2: #8b5cff; --accent: #7cf4ff; --accent-soft: rgba(124,244,255,.13);
  --high: #3dfcb4; --high-bg: rgba(61,252,180,.13); --mid: #ffd166; --mid-bg: rgba(255,209,102,.13); --low: #ff5d8f; --low-bg: rgba(255,93,143,.14);
  --shadow: 0 20px 60px rgba(0,0,0,.5); --radius: 18px; --primary-bg: linear-gradient(120deg,#7cf4ff,#8b5cff 55%,#ff5dd6); --primary-fg: #050a18;
  background: radial-gradient(1100px 600px at 80% -10%, rgba(139,92,255,.22), transparent 60%),
              radial-gradient(900px 600px at -10% 110%, rgba(255,93,214,.13), transparent 60%), #03040b;
  background-attachment: fixed; }
html[data-skin="evren"] body { background: transparent; }
html[data-skin="evren"] .card, html[data-skin="evren"] .top, html[data-skin="evren"] .role, html[data-skin="evren"] .ptile, html[data-skin="evren"] .savebar { backdrop-filter: blur(16px) saturate(140%); }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--text); font: 15px/1.55 var(--sans); -webkit-font-smoothing: antialiased; padding-bottom: 90px; }
button, input, select { font: inherit; color: inherit; }
a { color: inherit; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px; }

.top { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--paper) 86%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 14px; min-height: 60px; flex-wrap: wrap; padding-top: 6px; padding-bottom: 6px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); white-space: nowrap; }
.brand b { font-size: 17px; } .brand span { color: var(--muted); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; background: var(--surface); white-space: nowrap; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); } .dot.on { background: var(--high); box-shadow: 0 0 0 3px var(--high-bg); }
.back { text-decoration: none; font-weight: 600; font-size: 14px; border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; background: var(--surface); white-space: nowrap; }
.back:hover { border-color: var(--accent); }

h1 { font-family: var(--display); font-size: 28px; margin: 4px 0 2px; letter-spacing: -.4px; }
.lead { color: var(--muted); margin: 0 0 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 20px; margin-bottom: 18px; scroll-margin-top: 80px; }
.card h2 { margin: 0; font-family: var(--display); font-size: 19px; }
.card .intro { color: var(--muted); font-size: 13.5px; margin: 4px 0 8px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 330px); gap: 16px; padding: 14px 0; border-top: 1px solid var(--line); align-items: center; }
.row:first-of-type { border-top: 0; }
.row .lab { font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.row .help { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.row .key { font-family: var(--mono); font-size: 11px; color: var(--faint); }
.row.changed .lab::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
.eff { font-size: 10.5px; font-weight: 700; letter-spacing: .3px; border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
.eff.now { background: var(--high-bg); color: var(--high); }
.eff.reindex { background: var(--mid-bg); color: var(--mid); }
.ctl { display: flex; align-items: center; gap: 10px; justify-content: flex-end; min-width: 0; }
.ctl input[type=text], .ctl input[type=password], .ctl select, .ctl input[type=number] {
  width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--surface-2); outline: 0; min-width: 0; }
.ctl input[type=number] { width: 86px; text-align: right; font-family: var(--mono); }
.ctl input:focus, .ctl select:focus { border-color: var(--accent); }
.ctl input[type=range] { flex: 1; accent-color: var(--accent); min-width: 0; }
.reset { border: 0; background: none; cursor: pointer; color: var(--faint); font-size: 16px; padding: 2px 4px; visibility: hidden; }
.row.nondefault .reset { visibility: visible; } .reset:hover { color: var(--accent); }
.switch { position: relative; width: 46px; height: 26px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; position: absolute; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--line); cursor: pointer; transition: background .2s; }
.switch span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .2s; }
.switch input:checked + span { background: var(--high); }
.switch input:checked + span::after { transform: translateX(20px); }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.note { font-size: 12.5px; color: var(--muted); margin-top: 8px; }
.warn { background: var(--mid-bg); color: var(--text); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; margin: 8px 0; }
.err { background: var(--low-bg); color: var(--low); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; margin: 8px 0; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 14px; cursor: pointer; font-weight: 600; font-size: 14px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--primary-bg); color: var(--primary-fg); border: 0; }
.btn:disabled { opacity: .5; cursor: default; }
.scroll { overflow-x: auto; }
.savebar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(10px); border-top: 1px solid var(--line); transform: translateY(100%); transition: transform .25s; }
.savebar.on { transform: none; }
.savebar .wrap { display: flex; align-items: center; gap: 10px; min-height: 64px; flex-wrap: wrap; }
.savebar .msg { margin-right: auto; font-weight: 600; }
.toast { position: fixed; right: 20px; top: 76px; z-index: 30; max-width: 420px; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--high); border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow); font-size: 13.5px; opacity: 0; visibility: hidden; transform: translateY(-8px); transition: opacity .25s, transform .25s, visibility .25s; }
.toast.on { opacity: 1; visibility: visible; transform: none; } .toast.bad { border-left-color: var(--low); }
.toast b { display: block; margin-bottom: 4px; }

/* ---------- admin: views ---------- */
.tabs { display: flex; gap: 4px; padding: 3px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.tabs button { border: 0; background: none; border-radius: 9px; padding: 6px 14px; font-weight: 600; font-size: 14px; color: var(--muted); cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--surface-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
body[data-view="analyses"] #view-settings, body[data-view="analyses"] #savebar,
body[data-view="settings"] #view-analyses, body[data-view="analyses"] #chips { display: none; }

/* ---------- admin: analyses ---------- */
:root { --k-step: #1fa0bf; --k-llm: #8c6cf0; }
#view-analyses { padding-top: 22px; }
.a-head { display: flex; align-items: end; gap: 12px; flex-wrap: wrap; }
.a-head .grow { flex: 1 1 320px; }
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 14px 0 16px; }
.filters select, .filters input { border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; background: var(--surface); color: inherit; font: inherit; font-size: 14px; }
.filters input[type=search] { flex: 1 1 220px; min-width: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 7px 12px; font-size: 13.5px; font-weight: 600; color: var(--muted); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--text); }
.live { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); cursor: pointer; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px; box-shadow: var(--shadow); }
.tile .lbl { font-size: 12px; color: var(--muted); font-weight: 600; }
.tile .val { font-family: var(--display); font-size: 26px; font-weight: 700; letter-spacing: -.4px; font-variant-numeric: tabular-nums; line-height: 1.25; }
.tile .sub { font-size: 12px; color: var(--faint); }
.two { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 18px; }
@media (max-width: 960px) { .two { grid-template-columns: 1fr; } }
.hbars { display: grid; grid-template-columns: minmax(120px, max-content) minmax(0, 1fr) auto; gap: 7px 12px; align-items: center; font-size: 13px; margin-top: 10px; }
.hbars .nm { color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hbars .tr { height: 12px; border-radius: 0 4px 4px 0; background: var(--surface-2); position: relative; }
.hbars .tr i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 4px 4px 0; background: var(--k-step); min-width: 2px; }
.hbars .v { font-family: var(--mono); font-size: 12px; color: var(--muted); text-align: right; white-space: nowrap; }
table.an { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.an th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); padding: 8px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.an td { padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: top; font-variant-numeric: tabular-nums; }
table.an th.r, table.an td.r { text-align: right; }
table.an tr.row-a { cursor: pointer; }
table.an tr.row-a:hover td, table.an tr.row-a.open td { background: var(--surface-2); }
table.an .when { white-space: nowrap; color: var(--muted); font-family: var(--mono); font-size: 12px; }
table.an .qq { max-width: 620px; }
table.an .res { color: var(--muted); font-size: 12.5px; }
table.an .dur { white-space: nowrap; font-family: var(--mono); font-size: 12.5px; }
.flow { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; border-radius: 999px; padding: 1px 9px; white-space: nowrap; }
.flow.analist { background: var(--high-bg); color: var(--high); }
.flow.yedek { background: var(--mid-bg); color: var(--mid); }
.flow.kural { background: var(--surface-2); color: var(--muted); }
.flow.hata { background: var(--low-bg); color: var(--low); }
.flow.önbellek { background: var(--surface-2); color: var(--accent); box-shadow: inset 0 0 0 1px var(--line); }
.flow.durduruldu { background: var(--surface-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
td.detail-cell { padding: 0 !important; background: color-mix(in srgb, var(--surface-2) 60%, transparent); }
.trace { padding: 14px 16px 18px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.legend i { display: inline-block; width: 12px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
.wf { display: grid; grid-template-columns: minmax(180px, 34%) minmax(0, 1fr) 76px; gap: 3px 10px; align-items: center; font-size: 12.5px; }
.wf .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wf .lane { position: relative; height: 16px; border-radius: 3px; background: repeating-linear-gradient(90deg, transparent 0 calc(25% - 1px), var(--line) calc(25% - 1px) 25%); }
.wf .seg-bar { position: absolute; top: 3px; bottom: 3px; border-radius: 0 3px 3px 0; min-width: 2px; }
.wf .seg-bar.step { background: var(--k-step); } .wf .seg-bar.llm { background: var(--k-llm); }
.wf .seg-bar.event { background: repeating-linear-gradient(45deg, var(--mid) 0 3px, transparent 3px 6px); box-shadow: inset 0 0 0 1px var(--mid); }
.wf .seg-bar.error { box-shadow: 0 0 0 2px var(--low); }
.wf .ms { font-family: var(--mono); font-size: 11.5px; color: var(--muted); text-align: right; white-space: nowrap; }
.wf .st { font-weight: 700; margin-right: 4px; } .wf .st.error { color: var(--low); } .wf .st.warn { color: var(--mid); }
.wf .why { grid-column: 1 / -1; color: var(--faint); font-size: 11.5px; margin: -2px 0 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.axis { display: grid; grid-template-columns: minmax(180px, 34%) minmax(0, 1fr) 76px; gap: 10px; font-family: var(--mono); font-size: 10.5px; color: var(--faint); margin-bottom: 4px; }
.axis div:nth-child(2) { display: flex; justify-content: space-between; }
.empty { color: var(--muted); padding: 30px 0; text-align: center; }
.more { display: flex; justify-content: center; padding: 12px 0 0; }
@media (max-width: 700px) { table.an .hide-s { display: none; } .wf, .axis { grid-template-columns: minmax(110px, 40%) minmax(0, 1fr) 60px; } }
/* the analyses view fits the window: summary on top, the question list scrolls */
body[data-view="analyses"] { height: 100vh; overflow: hidden; display: flex; flex-direction: column; padding-bottom: 0; }
body[data-view="analyses"] .top { flex: none; }
body[data-view="analyses"] #view-analyses { flex: 1; min-height: 0; width: 100%; display: flex; flex-direction: column; padding-bottom: 16px; }
body[data-view="analyses"] #a-body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.a-list { flex: 1; min-height: 0; display: flex; flex-direction: column; margin-bottom: 0; }
.a-list-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.a-list-h h2 { margin-right: auto; }
.a-scroll { flex: 1; min-height: 0; overflow: auto; margin: 8px -20px -18px; padding: 0 20px 12px; }
.a-scroll table.an thead th { position: sticky; top: 0; z-index: 1; background: var(--surface); }
html[data-skin="evren"] .a-scroll table.an thead th { background: #0e1228; }
.btn.danger { color: var(--low); }
.btn.danger:hover { border-color: var(--low); }
@media (max-width: 700px), (max-height: 560px) {  /* small screens: the page scrolls as before */
  body[data-view="analyses"] { height: auto; overflow: visible; display: block; }
  .a-scroll { overflow: visible; }
}
body[data-view="analyses"] #view-analyses { padding-top: 14px; }
body[data-view="analyses"] h1 { font-size: 24px; }
body[data-view="analyses"] .filters { margin: 10px 0 10px; }
body[data-view="analyses"] .tiles { margin-bottom: 12px; gap: 10px; }
body[data-view="analyses"] .tile { padding: 8px 14px; }
body[data-view="analyses"] .tile .val { font-size: 21px; }
body[data-view="analyses"] .a-sum { margin: 2px 0 8px; font-size: 15px; }
body[data-view="analyses"] #a-body > div > .warn { margin: 0 0 10px; padding: 7px 12px; }
.a-list .intro { margin: 2px 0 0; }
/* plain reading of the analyses (who answered, what came back) */
.a-sum { font-size: 16px; margin: 4px 0 12px; }
.tile.warn-t .val { color: var(--mid); }
.warn a { color: inherit; font-weight: 700; }
table.an .q { font-weight: 600; overflow-wrap: anywhere; }
table.an .a { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 4px; color: var(--muted); font-size: 12.5px; }
table.an .by .res { margin-top: 4px; font-size: 12px; }
.orig { margin-left: 8px; font-size: 11.5px; font-weight: 500; color: var(--faint); white-space: nowrap; }
.vb { font-size: 10.5px; font-weight: 800; letter-spacing: .5px; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.vb.VAR { background: var(--high-bg); color: var(--high); } .vb.KISMEN { background: var(--mid-bg); color: var(--mid); }
.vb.BULUNAMADI { background: var(--low-bg); color: var(--low); } .vb.none { background: var(--surface-2); color: var(--muted); }
dl.story { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 18px; margin: 0 0 12px; font-size: 14px; }
dl.story dt { color: var(--muted); font-size: 12.5px; padding-top: 2px; }
dl.story dd { margin: 0; overflow-wrap: anywhere; }
.tbls { display: flex; gap: 6px; flex-wrap: wrap; }
.tbl { font-family: var(--mono); font-size: 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 7px; padding: 1px 7px; }
.where { margin: 14px 0 6px; }
.where-h { display: flex; gap: 10px; align-items: baseline; margin-bottom: 6px; font-size: 13.5px; }
.stack { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--surface-2); }
.ph { display: inline-block; }
.stack .ph { height: 100%; }
.ph.wait { background: repeating-linear-gradient(45deg, var(--mid) 0 3px, transparent 3px 6px); }
.ph.check { background: #6f78a3; } .ph.rules { background: var(--k-step); } .ph.pick { background: var(--k-llm); } .ph.write { background: #ff5dd6; }
ul.phases { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 4px; font-size: 13px; }
ul.phases li { display: grid; grid-template-columns: 12px minmax(0, max-content) auto 1fr; gap: 8px; align-items: center; }
ul.phases li .ph { width: 12px; height: 12px; border-radius: 3px; }
ul.phases li span { font-family: var(--mono); font-size: 12px; color: var(--text); }
ul.phases li small { color: var(--faint); }
details.tech { margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 8px; }
details.tech > summary { cursor: pointer; font-size: 13px; color: var(--muted); font-weight: 600; }
details.tech .tl { margin-top: 10px; }
.perf h3 { margin: 0 0 8px; font-size: 14px; }
ul.users { list-style: none; margin: 0; padding: 0; font-size: 13.5px; }
ul.users li { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; border-bottom: 1px solid var(--line); }
ul.users li a { color: inherit; } ul.users li span { color: var(--muted); }
@media (max-width: 700px) { dl.story { grid-template-columns: 1fr; gap: 2px; } dl.story dt { padding-top: 8px; } ul.phases li { grid-template-columns: 12px 1fr auto; } ul.phases li small { display: none; } }
/* ---------- admin: settings (pages, plain rows, LLM integrations) ---------- */
#view-settings { padding-top: 22px; }
.ptiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 16px 0 20px; }
.ptile { position: relative; text-align: left; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; align-items: center;

<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) { if (kid == null || kid === false) continue; e.append(kid instanceof Node ? kid : document.createTextNode(String(kid))); }
  return e;
}
// The app has a single look (Evren, ADR-027).
document.documentElement.dataset.skin = "evren";

async function api(path, opts = {}) {
  const r = await fetch(path, opts);
  const data = await r.json().catch(() => ({ error: "Beklenmeyen yanıt" }));
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}
const post = (path, body) => api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });

let S = null;           // /api/settings payload
let L = null;           // /api/llm payload
let saved = {};         // values as saved on the server
let form = {};          // values in the form
const FIELD = {};       // key -> field schema
const ROW = {};         // key -> row element
let PAGE = "llm";
const EFFECT_NOTE = { "indeks": "Kaydedince indeks yeniden kurulmalı" };
const ICON = {
  llm: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 4.6L18.5 9.5l-4.6 1.9L12 16l-1.9-4.6L5.5 9.5l4.6-1.9z"/><path d="M19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5.5 5.5"/></svg>',
  data: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/></svg>',
};
const eq = (a, b) => (typeof a === "number" && typeof b === "number" ? Math.abs(a - b) < 1e-9 : a === b);
const show = (f, v) => f.format === "pct" ? `%${Math.round(v * 100)}` : (typeof v === "number" ? (f.step && f.step < 1 ? Number(v).toFixed(f.step < 0.1 ? 2 : 1) : String(v)) : (v || "boş"));
const svg = name => { const t = document.createElement("template"); t.innerHTML = ICON[name]; return t.content.firstChild; };
const short = m => (m || "").split("/").pop();

function toast(title, lines, bad = false) {
  const t = $("#toast");
  t.className = "toast on" + (bad ? " bad" : "");
  t.replaceChildren(h("b", {}, title), ...lines.map(l => h("div", {}, l)));
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove("on"), 7000);
}

// ---------------------------------------------------------------- pages
function pageStatus(id) {
  if (id === "llm") {
    if (!L) return "Yükleniyor…";
    const c = L.roles.chat;
    return c ? "Sohbet: " + short(c.model) : "Bağlı model yok";
  }
  if (id === "search") return `Cevap eşiği %${Math.round(saved["scoring.min_answer_score"] * 100)}`;
  return `${S.status.dictionary_version} · ${(S.status.index_built_at || "").slice(0, 10) || "indeks yok"}`;
}
function renderTiles() {
  $("#ptiles").replaceChildren(...S.pages.map(p => {
    const n = p.id === "llm" ? 0 : Object.keys(FIELD).filter(k => FIELD[k].page === p.id && changedKey(k)).length;
    return h("button", { class: "ptile", role: "tab", "aria-selected": String(p.id === PAGE), onclick: () => openPage(p.id) },
      svg(p.id), h("b", {}, p.title), h("small", {}, pageStatus(p.id)), n ? h("span", { class: "cnt" }, String(n)) : null);
  }));
}
function openPage(id) {
  PAGE = id;
  try { sessionStorage.setItem("admin-page", id); } catch (e) { /* storage blocked */ }
  document.querySelectorAll(".page").forEach(p => p.classList.toggle("on", p.id === "page-" + id));
  renderTiles();
  if (id === "llm") loadLLM();
}

// ---------------------------------------------------------------- plain settings
function control(f) {
  const key = f.key, v = form[key];
  const set = val => { form[key] = val; refresh(key); };
  if (f.type === "bool") {
    const inp = h("input", { type: "checkbox", "aria-label": f.label });
    inp.checked = !!v; inp.onchange = () => set(inp.checked);
    return [h("label", { class: "switch" }, inp, h("span"))];
  }
  if (f.type === "int" || f.type === "float") {
    const step = f.step || (f.type === "int" ? 1 : 0.05);
    const parse = x => (f.type === "int" ? parseInt(x, 10) : parseFloat(x));
    const range = h("input", { type: "range", min: f.min, max: f.max, step, value: v, "aria-label": f.label });
    if (f.format === "pct") {
      const out = h("span", { class: "readout" }, show(f, v));
      range.oninput = () => { const x = parse(range.value); out.textContent = show(f, x); set(x); };
      return [range, out];
    }
    const num = h("input", { type: "number", min: f.min, max: f.max, step, value: show(f, v), "aria-label": f.label });
    range.oninput = () => { num.value = show(f, parse(range.value)); set(parse(range.value)); };
    num.oninput = () => { const x = parse(num.value); if (!Number.isNaN(x)) { range.value = x; set(x); } };
    return [range, num];
  }
  const inp = h("input", { type: "text", value: v ?? "", "aria-label": f.label });
  inp.oninput = () => set(inp.value);
  return [inp];
}
function renderRow(f) {
  const reset = h("button", { class: "reset", title: `Varsayılana dön: ${show(f, S.defaults[f.key])}`, "aria-label": "Varsayılana dön",
    onclick: () => { form[f.key] = S.defaults[f.key]; rerender(f.key); } }, "↺");
  const note = EFFECT_NOTE[f.effect];
  const row = h("div", { class: "row", id: "row-" + f.key },
    h("div", {}, h("div", { class: "lab", title: f.key }, f.label, note ? h("span", { class: "eff reindex" }, note) : null),
      f.help ? h("div", { class: "help" }, f.help) : null),
    h("div", { class: "ctl" }, control(f), reset));
  ROW[f.key] = row;
  return row;
}
function rerender(key) { const old = ROW[key]; const fresh = renderRow(FIELD[key]); old.replaceWith(fresh); refresh(key); }
const changedKey = k => ROW[k] && !eq(form[k], saved[k]);
function refresh(key) {
  for (const k of key ? [key] : Object.keys(FIELD)) {
    const row = ROW[k]; if (!row) continue;
    row.classList.toggle("changed", changedKey(k));
    row.classList.toggle("nondefault", !eq(form[k], S.defaults[k]));
  }
  const n = Object.keys(FIELD).filter(changedKey).length;
  $("#savebar").classList.toggle("on", n > 0);
  $("#savemsg").textContent = `${n} değişiklik kaydedilmedi`;
  renderTiles();
}

function sectionCard(sec) {
  const rows = f => { FIELD[f.key] = { ...f, page: sec.page }; return renderRow(FIELD[f.key]); };
  if (sec.advanced) {
    return h("details", { class: "card adv-card", id: "sec-" + sec.id },
      h("summary", {}, sec.title, h("span", { class: "tag" }, `${sec.fields.length} ayar`)),
      sec.intro ? h("p", { class: "sec-intro" }, sec.intro) : null, sec.fields.map(rows));
  }
  const basic = sec.fields.filter(f => !f.advanced), adv = sec.fields.filter(f => f.advanced);
  return h("section", { class: "card", id: "sec-" + sec.id },
    h("h2", {}, sec.title), sec.intro ? h("p", { class: "sec-intro" }, sec.intro) : null,
    basic.map(rows),
    adv.length ? h("details", { class: "adv" }, h("summary", {}, `Uzman ayarları (${adv.length})`), adv.map(rows)) : null,
    sec.id === "cache" ? answersFoot() : null);
}
// Kept analyst answers (ADR-035): how many, how many fit today's dictionary/model/settings.
function answersFoot() {

async function withConflict(path, body) {
  let r = await post(path, body);
  if (r.ok === false && r.conflict) {
    const who = r.conflict.map(c => `“${c.name}” (${c.roles.join(", ")})`).join(", ");
    if (!confirm(`${who} şu an bu rolde aktif. Pasif yapılıp yerine bu entegrasyon kullanılsın mı?`)) return null;
    r = await post(path, { ...body, replace: true });
  }
  return r;
}

async function activate(it, on, sw) {
  sw.disabled = true;
  try {
    const r = await withConflict("/api/llm/activate", { id: it.id, enabled: on });
    if (r) { L = r.state; toast(on ? "Aktif edildi" : "Pasif yapıldı", [`${it.name} — uygulama yeni bağlantıyla çalışıyor.`]); await load(); }
  } catch (e) { toast("Değiştirilemedi", [e.message], true); }
  renderLLM(); renderTiles();
}

async function remove(it) {
  if (!confirm(`“${it.name}” entegrasyonu silinsin mi?${it.enabled ? " Aktif olduğu için kullandığı roller boşta kalır." : ""}`)) return;
  try { const r = await post("/api/llm/delete", { id: it.id }); L = r.state; toast("Silindi", [it.name]); await load(); }
  catch (e) { toast("Silinemedi", [e.message], true); }
}

    const r = await post("/api/llm/test", body);
    out.replaceChildren(stepsList(r.steps));
    if (reloadAfter) {  // the card is redrawn with the new test tag; the steps go to a toast
      toast(r.ok ? "Test başarılı" : "Test başarısız", r.steps.map(s => `${s.ok ? "✓" : "✗"} ${s.name}: ${s.detail}`), !r.ok);

    const r = await api("/api/llm/inventory");

      table.replaceChildren(h("div", { class: "scroll" }, h("table", { class: "mt" },
        h("thead", {}, h("tr", {}, ["Model", "Entegrasyon", "Bağlam", "Durum"].map((t, i) => h("th", { class: i === 2 ? "r" : "" }, t)))),
        h("tbody", {}, shown.map(m => h("tr", {},
          h("td", { class: "m" }, m.id), h("td", {}, m.server.name, m.server.enabled ? "" : h("span", { class: "tag", style: "margin-left:6px" }, "pasif")),
          h("td", { class: "r" }, m.context ? m.context.toLocaleString("tr-TR") : "–"),

  // ---- one analysis: the plain story first, the step-by-step timeline on request
  detailView(e) {

      h("span", {}, h("i", { style: "background:repeating-linear-gradient(45deg,var(--mid) 0 2px,transparent 2px 4px);box-shadow:inset 0 0 0 1px var(--mid)" }), "Bekleme"),

  },

// The steps of the trace, in the words of the person reading the screen.
const PHASES = [
  { name: "Sırada bekleme", cls: "wait", steps: ["Sırada bekleme"], note: "başka bir soru bitene kadar" },
  { name: "Önceki cevap araması", cls: "check", steps: ["Önceki cevap araması"], note: "aynı ya da aynı anlama gelen soru" },
  { name: "Model sunucusu kontrolü", cls: "check", steps: ["Model sunucusu kontrolü"] },
  { name: "Arama (kural motoru)", cls: "rules", steps: ["Kural motoru ipuçları", "Kural akışı", "Kural akışı (yedek)"], note: "sözlükte kelime araması" },
  { name: "Analist: tablo seçimi", cls: "pick", steps: ["1. adım — aday seçimi", "Aile araması"], note: "model katalogdan aday tabloları seçer" },
  { name: "Analist: kolonları okuma ve rapor", cls: "write", steps: ["2. adım — kolon okuma ve rapor"], note: "model adayların kolonlarını okur, cevabı yazar" },
];
function phasesFromSteps(steps) {
  return PHASES.map(p => ({ ...p, ms: p.steps.reduce((s, k) => s + (steps[k] || 0), 0) })).filter(p => p.ms > 0);
}
function phasesOf(spans) {
  const steps = {};
  for (const s of spans) if (s.kind === "step") steps[s.name] = (steps[s.name] || 0) + s.ms;
  return phasesFromSteps(steps).filter(p => p.cls !== "wait" || p.ms >= 1000);
}
function verdictBadge(v, flow) {
  if (!v) return h("span", { class: "vb none" }, flow === "durduruldu" ? "durduruldu" : "cevap yok");
  return h("span", { class: "vb " + v.split(" ")[0] }, v);
}

function quantile(sorted, p) { if (!sorted.length) return 0; const i = (sorted.length - 1) * p, lo = Math.floor(i), hi = Math.ceil(i); return sorted[lo] + (sorted[hi] - sorted[lo]) * (i - lo); }
function num(n) { return Number(n).toLocaleString("tr-TR"); }
function kilo(n) { n = n || 0; return n >= 1e6 ? (n / 1e6).toLocaleString("tr-TR", { maximumFractionDigits: 1 }) + " M" : n >= 1e3 ? (n / 1e3).toLocaleString("tr-TR", { maximumFractionDigits: 1 }) + " k" : String(n); }
function msText(ms) {
  ms = Math.round(ms || 0);
  if (ms < 1000) return ms + " ms";
  if (ms < 60000) return (ms / 1000).toLocaleString("tr-TR", { maximumFractionDigits: ms < 10000 ? 1 : 0 }) + " sn";
  const m = Math.floor(ms / 60000), sec = Math.round((ms % 60000) / 1000);
  return `${m} dk ${String(sec).padStart(2, "0")} sn`;
}
function when(iso) {
  const d = new Date(iso), today = new Date().toDateString() === d.toDateString();
  const t = d.toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" });
  return today ? "bugün " + t : d.toLocaleDateString("tr-TR", { day: "2-digit", month: "2-digit" }) + " " + t;
}
function clip(t, n) { return t.length > n ? t.slice(0, n - 1) + "…" : t; }
function flowChip(f) {
  const t = { analist: ["●", "Analist"], "önbellek": ["↻", "Önceki cevap"], yedek: ["↺", "Kural (yedek)"], kural: ["◇", "Kural motoru"], hata: ["✕", "Hata"], durduruldu: ["■", "Durduruldu"] }[f] || ["", f];
  return h("span", { class: "flow " + f }, t[0], t[1]);
}
