# This file is active only on a bank-managed GitHub Enterprise instance whose Dependabot service
# can reach approved internal mirrors. Proposals remain subject to dependency-admission.json and
# rules/54-bagimlilik-guncelligi.md; they are never permission to bypass the maturity gate.
# The 30-day cooldown applies to version updates only; security updates remain immediate.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/app/frontend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 30
    groups:
      frontend-minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Primary TypeScript stays on the 5.x boundary supported by the ESLint and OpenAPI tools.
    # TypeScript 7 compatibility is verified through the separate `typescript7` alias.
    # `ignore.update-types` does not apply to security-only runs; security updates stay enabled.
    ignore:
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
    open-pull-requests-limit: 5
  - package-ecosystem: "npm"
    directory: "/e2e"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 30
    groups:
      e2e-minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "pip"
    directory: "/app/backend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 30
    groups:
      backend-minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 30
    groups:
      actions-minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
