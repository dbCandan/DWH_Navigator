name: governance-drift
on:
  pull_request:
permissions:
  contents: read
env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INDEX: "1"
jobs:
  drift:
    runs-on: [self-hosted, linux, bank-offline]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - run: scripts/render-clients.sh --check
      - name: Validate local commit guard structure
        run: python3 .kt-scaffold/hooks/commit_governance_guard.py --self-check
      - name: Bind CI evidence to the checked-out tree
        run: |
          test "$(git write-tree)" = "$(git rev-parse 'HEAD^{tree}')"
          test ! -e .kt-scaffold/runtime
          if python3 .kt-scaffold/hooks/commit_governance_guard.py \
            --git-hook pre-commit >guard.out 2>guard.err; then
            exit 1
          fi
          grep -q 'GOVERNED_REVIEW_REQUIRED:' guard.err
          printf 'CI does not claim a full governed-review without an admitted review runner.\n'
      - name: Prove hand edits are rejected
        run: |
          printf '\nmutation\n' >> AGENTS.md
          if scripts/render-clients.sh --check; then exit 1; fi
