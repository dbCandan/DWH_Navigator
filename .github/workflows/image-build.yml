# Generated application image publication. Azure owns the separate Helm deployment.
name: Build & Push

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

concurrency:
  group: "dwhnavigator-image-publication"
  cancel-in-progress: false

jobs:
  build-and-push:
    name: ${{ matrix.image }} (GHCR)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            dockerfile: app/infra/Dockerfile.backend.release
          - image: frontend
            dockerfile: app/infra/Dockerfile.frontend.release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute publication coordinates
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE_REPOSITORY=$REGISTRY/$owner/dwhnavigator-${{ matrix.image }}" >> "$GITHUB_ENV"
          echo "IMAGE_DATE_TAG=$(date -u +'%Y%m%d-%H%M%S')" >> "$GITHUB_ENV"
          echo "IMAGE_SHORT_SHA=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          build-args: |
            DEPENDENCY_MODE=connected
            PYTHON_BASE_IMAGE=python:3.14-alpine3.23@sha256:218761489de417a6eb0808e264cbdd7043ec6659fe5a61898815e9848536541d
            FRONTEND_NODE_BASE_IMAGE=node:22.23.2-alpine3.23@sha256:46825fbbd4e996a78b7a2cdc08d75e38a5a505bdab95dcda55605359bf124bc6
            NGINX_BASE_IMAGE=nginx:1.31.6-alpine-slim@sha256:f761b94f2cb9e8e05e2943d5f773609596113ef69b54e2433a996d109a8f78b7
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:latest
            ${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_DATE_TAG }}
            ${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_SHORT_SHA }}
            ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Log out
        if: always()
        run: docker logout ghcr.io
