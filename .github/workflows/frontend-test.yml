name: frontend-test
on:
  pull_request:
    paths: ["app/frontend/**", "specs/openapi/**", "scripts/generate-types.sh"]
permissions:
  contents: read
env:
  CI: "true"
  DEPENDENCY_MODE: "offline"
  KT_SCAFFOLD_OFFLINE_BUNDLE: ${{ vars.KT_SCAFFOLD_OFFLINE_BUNDLE }}
  KT_SCAFFOLD_OFFLINE_BUNDLE_SHA256: ${{ vars.KT_SCAFFOLD_OFFLINE_BUNDLE_SHA256 }}
  npm_config_audit: "false"
  npm_config_fund: "false"
  npm_config_offline: "true"
jobs:
  frontend:
    runs-on: [self-hosted, linux, bank-offline]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Verify and wire admitted offline inputs
        run: |
          scripts/verify-offline-bundle.sh
          printf '%s\n' \
            "PYTHON_WHEELHOUSE_CONTEXT=$KT_SCAFFOLD_OFFLINE_BUNDLE/wheelhouse/python-fastapi" \
            "NPM_CACHE_CONTEXT=$KT_SCAFFOLD_OFFLINE_BUNDLE/npm-cache" \
            >> "$GITHUB_ENV"
          docker load --input "$KT_SCAFFOLD_OFFLINE_BUNDLE/runtime-images.tar"
      - run: scripts/stack.sh up -d --build --wait frontend
      - run: scripts/quality-gate.sh frontend
      - if: always()
        run: scripts/stack.sh down --volumes
