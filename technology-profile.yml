schema_version: 2
profile_id: kt-vibecoding-python-web-v2
authority: mandatory
status: approved-baseline

application_modes:
  default: separated-web
  allowed:
    separated-web:
      frontend: react-spa
      backend: python-fastapi
      boundary: http-api
    chat-only-fullstack:
      framework: streamlit
      boundary: single-python-application
      eligibility:
        all_of:
          - user_interface_is_limited_to_prompt_chat_and_history
          - no_general_purpose_business_ui
          - no_separate_frontend_required
      approval: accepted-prd-must-declare-this-mode
    desktop:
      language: python
      framework: tkinter
      boundary: single-local-python-application
      runtime_dependencies: standard-library-only
      third_party_runtime_packages: accepted-prd-and-dependency-admission-required
      local_storage: json-or-sqlite3-in-user-data-directory
      tests: pytest-without-display
      runtime_egress: forbidden
      distribution: developer-virtual-environment-only
      eligibility:
        all_of:
          - single_local_user
          - no_network_service
          - no_multi_user_tenant_or_authentication
          - no_server_database
      forbidden:
        - electron
        - tauri
        - pyside-or-pyqt
        - embedded-webview
        - separated-web-stack

architecture:
  frontend_backend_separation: required-in-separated-web
  server_side_rendering: forbidden
  nextjs: forbidden
  realtime:
    server_sent_events: allowed
    web_socket: exception-only

frontend:
  runtime: nodejs-22
  language: typescript-strict
  type_checker: typescript-7-native
  framework: react-19
  build: vite-8
  routing: react-router-8
  rendering: client-side-spa
  api_contract: openapi-typescript-7
  api_contract_compiler_compatibility: typescript-5.9
  testing: vitest-4
  package_manager: npm-with-committed-lockfile

backend:
  language: python
  minimum_language_version: "3.12"
  framework: fastapi
  framework_version: "0.141.1"
  validation: pydantic-2
  server: uvicorn
  concurrency: async
  testing: pytest
  alternatives: forbidden

persistence:
  engine: postgresql-17
  orm: sqlalchemy-2-async
  driver: asyncpg
  migrations: alembic
  schema_authority: app/backend/app/domain/models
  vector:
    status: allowed-with-accepted-prd
    database: same-postgresql-database
    extension: pgvector
    sql_extension_name: vector
    minimum_version: "0.8.5"
    python_binding: pgvector-python-sqlalchemy
    activation: reviewed-alembic-migration
    alternative_vector_database: forbidden
    data_type: vector-with-fixed-dimensions
    distance_metrics:
      - cosine
      - inner-product
      - l2
    search_modes:
      - exact
      - hnsw
      - ivfflat

embeddings:
  status: allowed-with-accepted-prd
  generation_boundary: application-port-with-infrastructure-adapter
  provider: approved-internal-or-on-premise
  runtime_egress: forbidden
  runtime_model_download: forbidden
  prd_contract:
    required:
      - provider
      - model-id
      - model-version
      - dimensions
      - normalization
      - distance-metric
      - index-strategy
      - quality-and-latency-thresholds
  storage:
    vector_store: persistence.pgvector
    model_identity: required-per-row
    source_identity: required-per-row
    content_hash: required-per-row
    tenant_scope: required-in-similarity-query
    sensitive_data: classification-minimization-and-retention-required
  lifecycle:
    reembedding: versioned-backfill-validate-and-cutover
    mixed_model_search: forbidden
    destructive_rebuild: explicit-authorization-required

llm_orchestration:
  status: allowed-with-accepted-prd
  framework: langchain-1
  core: langchain-core-1
  graph_runtime: langgraph-1
  dependency_authority: app/backend/requirements-llm.in
  activation: accepted-prd-includes-requirements-llm
  community_integrations: forbidden
  integration_packages: accepted-prd-and-dependency-admission-required
  hosted_services: forbidden
  langsmith_tracing: forbidden
  generation_boundary: application-port-with-infrastructure-adapter
  provider: approved-internal-or-on-premise
  runtime_egress: forbidden
  runtime_model_download: forbidden

security:
  rsa_minimum_bits: 2048
  loopback_is_network_exposure: false
  authentication: jwt-access-token
  authorization: rbac-with-application-super-admin
  tenant_isolation: required
  secrets: runtime-environment-or-precreated-kubernetes-secret

observability:
  enabled_by_default: true
  logging:
    format: structured-json-to-stdout
    request_correlation: required
    sensitive_data: forbidden
  monitoring:
    collector: opentelemetry-collector
    metrics_store: prometheus
    trace_store: tempo
    log_store: loki
    dashboard: grafana
  application_signals:
    baseline: health-readiness-and-structured-request-logs
    capability_specific_metrics_and_traces: accepted-prd-owned

delivery:
  local: docker-compose
  cluster: kubernetes-with-helm
  runtime_egress: denied
  images: internal-registry-and-digest-pinned

maintenance:
  version_pins: governance-owned-floors
  upgrade_triggers:
    security_scanner_finding: mandatory-upgrade-to-nearest-fixed-release
    upstream_security_advisory: mandatory-upgrade-to-nearest-fixed-release
  adoption_window:
    minimum_release_age_days: 30
    security_fix_exception: immediate-adoption-allowed
    downgrade_to_satisfy_window: forbidden
  evidence:
    - registry-release-date
    - security-advisory-id
    - dependency-admission-ledger
    - compatibility-test-evidence
  scanners:
    - trivy
    - semgrep
    - dependabot
    - osv

forbidden:
  - nextjs
  - server-side-rendering
  - nodejs-backend
  - nestjs
  - prisma
  - mixed-python-and-node-backend
  - agent-selected-backend-framework
