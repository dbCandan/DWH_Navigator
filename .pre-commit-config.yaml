default_install_hook_types: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks offline secret scan
        entry: gitleaks git --pre-commit --staged --config .gitleaks.toml --redact --exit-code 1 .
        language: system
        pass_filenames: false
      - id: kt-governance-drift
        name: kt-scaffold deterministic governance drift
        entry: python3 scripts/check-governance-drift.py
        language: system
        pass_filenames: false
