backend_profile: python-fastapi
persistence_profile: sqlalchemy-alembic
engine: postgresql
schema_authority: app/backend/app/domain/models
migration_adapter: alembic
migration_directory: schema/alembic/versions
vector_capability:
  status: allowed-with-accepted-prd
  extension: pgvector
  sql_extension_name: vector
  minimum_version: "0.8.5"
  activation: reviewed-alembic-migration
  vector_store: same-postgresql-database
  alternative_vector_database: forbidden
  embedding_generation: application-port-with-infrastructure-adapter
commands:
  generate: cd app/backend && alembic revision --autogenerate -m '<name>'
  apply: cd app/backend && alembic upgrade head
  status: cd app/backend && alembic current
  validate: "cd app/backend && alembic check && alembic heads && alembic current --check-heads"
