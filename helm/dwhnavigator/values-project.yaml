# Project-owned deployment layer for the nonprod KT Rancher cluster (rules/45-dagitim-hedefi.md).
# deploy.sh layers it over the factory-managed values.yaml in render and apply; the scaffold never
# writes it. Addressing and non-secret settings only: secrets live in the Secrets that
# deploy-hooks.sh and deploy.sh prepare in the cluster.
# Contract: specs/application-foundation/PRDs/002-kubernetes-delivery/PRD.md (Requirement 8).
backend:
  # Prepared by deploy-hooks.sh: session signing key, settings encryption key and the optional
  # super admin start-up password (kubernetes-delivery Requirement 7, Decision 8).
  existingSecret: dwhnavigator-runtime
  # Single process: the old backend stops before the new one starts (kubernetes-delivery
  # Decision 5). The factory chart option is pending; until it lands this key is ignored and the
  # first nonprod deployment waits (Decision 22).
  strategy: {type: Recreate}
  config:
    # staging is the nonprod environment of application-foundation/DOMAIN.md.
    DWHNAVIGATOR_ENVIRONMENT: staging
    DWHNAVIGATOR_PUBLIC_ORIGIN: https://dwhnavigator.ailab-test.kuveytturk.com.tr
    DWHNAVIGATOR_CORS_ALLOW_ORIGINS: https://dwhnavigator.ailab-test.kuveytturk.com.tr
    # Pod network of the kube-system ingress controller; X-Forwarded-For is trusted only from it.
    DWHNAVIGATOR_TRUSTED_PROXY_CIDRS: 10.42.0.0/16
    # Local super admin the backend creates once when the runtime Secret carries its start-up
    # password (application-foundation/PRDs/001-user-accounts Requirement 17).
    DWHNAVIGATOR_BOOTSTRAP_SUPER_ADMIN_USERNAME: admin
    # The cluster runs no telemetry collector (user-accounts Requirement 19).
    DWHNAVIGATOR_OTEL_EXPORTER_OTLP_ENDPOINT: ""
    # Process-wide model call limit (data-dictionary/PRDs/003-llm-connection Requirement 1,
    # Decision 11); the RunAI capacity owner may change it here.
    DWHNAVIGATOR_LLM_MAX_CONCURRENT_CALLS: 2
    # One running analysis and a queue of 20 (data-dictionary/PRDs/004-question-analysis
    # Requirement 9, Decision 2).
    DWHNAVIGATOR_ANALYSIS_CONCURRENCY: 1
    DWHNAVIGATOR_ANALYSIS_QUEUE_LIMIT: 20
    # No model address, model name or API key here: the super admin adds the model connection in
    # the application, which keeps it in PostgreSQL with the key encrypted (llm-connection).
  # The search index lives in process memory and Excel files are read and written in memory
  # (kubernetes-delivery Requirement 2, Decision 10: the source container ran with mem_limit 2g).
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {cpu: 1000m, memory: 2Gi}
  # The backend leaves the cluster only for the model server (kubernetes-delivery Requirement 10).
  networkPolicy:
    egress:
      - to:
          - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
            podSelector: {matchLabels: {k8s-app: kube-dns}}
        ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
      - to:
          - podSelector:
              matchLabels:
                app.kubernetes.io/instance: dwhnavigator
                app.kubernetes.io/part-of: dwhnavigator
                app.kubernetes.io/component: database
        ports: [{protocol: TCP, port: 5432}]
      # Model server (RunAI inference endpoint), https only.
      - to: [{ipBlock: {cidr: 10.14.3.99/32}}]
        ports: [{protocol: TCP, port: 443}]
frontend:
  ingress:
    className: nginx
    host: dwhnavigator.ailab-test.kuveytturk.com.tr
    tlsSecretName: ailab-tls
    # Request bodies up to 20 MB reach the application (kubernetes-delivery Requirement 11). The
    # factory chart option is pending; until it lands this key is ignored, ingress-nginx keeps its
    # 1 MB default and the first nonprod deployment waits (Decision 22).
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "20m"
postgres:
  enabled: true
  persistence:
    size: 10Gi
    storageClassName: nfs-sc
migration:
  enabled: true
