apiVersion: v1
kind: Service
metadata:
  name: {{ include "generated.resourceName" (list . "frontend") }}
  labels:
    {{- include "generated.workloadLabels" (dict "root" . "component" "frontend") | nindent 4 }}
  annotations:
    {{- include "generated.annotations" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    scaffold.kt.internal/workload: {{ include "generated.resourceName" (list . "frontend") | quote }}
  ports:
    - {name: http, port: {{ .Values.frontend.service.port }}, targetPort: http}
