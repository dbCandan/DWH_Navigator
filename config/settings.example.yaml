# Kopyalayıp config/settings.yaml olarak kullanın (settings.yaml repoya girmez).
# Değerler 2026-10-07 ölçümünün (294 soru, ~%89,8) yapıldığı ayarlardır; Docker kurulumu
# aynılarını docker/settings.yaml'dan alır. Yönetim → Ayarlar ekranı da bu dosyayı yazar.

dictionary:
  store: data/dictionary.jsonl  # uygulamanın tek sözlüğü; Yönetim → Sözlük'ten Excel şablonuyla içe/dışa aktarılır (ADR-050)

index:
  dir: data/index

search:
  candidate_object_columns: 1000  # obje adayı toplamak için taranan kolon sayısı
  top_k_objects: 20
  field_weights:
    name: 3
    synonyms: 2
    description: 1
    object: 1
  bm25:
    k1: 1.2
    b: 0.75

expansion:
  enabled: true                # kurumsal terim sözlüğü
  synonyms: true               # sözlüğün Synonyms kolonu
  weight: 0.6                  # genişletme terimlerinin ağırlığı
  term_dictionary: config/term_dictionary.csv
  stopwords: config/stopwords_tr.txt

# Kural motoru modele ipucu verir ve doğrular; cevabı yazmaz (ADR-038).
scoring:
  min_candidate_score: 0.5     # ipucu listesine girecek en düşük kural skoru
  min_answer_score: 0.6
  min_answer_coverage: 0.3     # (ADR-013)
  rule_only_factor: 0.55       # yalnız ölçümdeki kural cevabı için (ADR-034)
  object:
    best_column: 0.35
    coverage: 0.21
    time: 0.07
    granularity: 0.07
    topic: 0.30   # tablonun bütün olarak konuyla uyumu (ADR-028)

# Model bağlantısı: normalde Yönetim → Yapay zekâ sayfasından (config/llm_integrations.yaml,
# ADR-032); o dosya varsa bu bölümün bağlantı alanları yok sayılır. OpenAI uyumlu her sunucu olur.
llm:
  enabled: false
  endpoint: ""                 # sohbet modeli, ör. http://<spark-adresi>:8000/v1
  model: ""                    # sunucunun bildirdiği model adı
  api_key: ""                  # sunucu anahtar istiyorsa
  temperature: 0.0
  seed: 42                     # tekrarlanabilir cevap; -1 = gönderme
  reasoning_effort: none       # düşünen modellerde gizli düşünmeyi kapatır; "" = gönderme
  timeout: 900                 # analist akışının 2. adımı uzun cevap yazar (ADR-029)

# Analist akışı (ADR-029): önce tüm tablo kataloğundan aday seçer, sonra adayların kolonlarını
# okuyup raporu yazar. Cevabı yalnız analist yazar (ADR-038).
analyst:
  shortlist: 14                # 2. adımda kolon kolon okunan aday tablo sayısı
  confusables: 6               # uyarılar için okunan "benzer ama yanlış" tablo sayısı
  family_tables: 2             # bilgi ailesi başına terim aramasıyla eklenen tablo
  family_extra: 6              # bu yolla en fazla eklenen tablo
  search_tables: 3             # 1. adımın seçmediği, tablo aramasının en iyi tabloları
  evidence_columns: 60         # sözlüğün geri kalanından benzer alan sayısı
  description_chars: 420       # kolon açıklaması başına karakter
  full_table_columns: 90       # daha geniş tablolarda yalnız ilgili kolonların açıklaması
  min_confidence: 0.5          # bu güvenin altındaki öneri gösterilmez (ADR-006)
  max_tokens: 8000             # 2. adımın cevap bütçesi
  catalog_chunks: 1            # 1. adım: katalog tek çağrıda okunur (N = N parçada paralel, sonra kıyaslanır)
  detail_columns: 8            # 2. adım: tablo başına tam açıklamayla giden en ilgili kolon sayısı (diğerleri "Ad [Rol]: özet"; -1 = hepsi)
  catalog_columns: false       # 1. adım kataloğuna kolon adları da eklensin mi
  chunk_candidates: 8          # parça başına en fazla aday
  pool_size: 40                # kıyaslanan aday havuzu
  pool_columns: 12             # havuzda tablo başına gösterilen en ilgili kolon sayısı

# Önceki cevaplar (ADR-035): analist cevapları data/cache/answers.jsonl'de saklanır; aynı
# soru ya da aynı kavramlara çıkan soru tekrar gelince yeniden analiz yapılmaz. Sözlük,
# model veya cevabı etkileyen bir ayar değişince eski cevaplar kullanılmaz.
cache:
  enabled: true
  meaning: true        # aynı anlama gelen (terim sözlüğüne göre) sorularda da
  max_age_days: 30     # 0 = süre sınırı yok

report:
  out_dir: out
