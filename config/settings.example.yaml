# Kopyalayıp config/settings.yaml olarak kullanın (settings.yaml repoya girmez).

dictionary:
  path: data/DataDictionary-Final.xlsx
  sheet: Sheet1
  quality_sheet: Sheet2        # opsiyonel

index:
  dir: data/index

search:
  top_k_columns: 120
  candidate_object_columns: 400  # obje adayı toplamak için taranan kolon sayısı
  top_k_objects: 10
  field_weights:
    name: 3
    synonyms: 2
    description: 1
    object: 1
  bm25:
    k1: 1.2
    b: 0.75

expansion:
  enabled: true                # kurumsal terim sözlüğü
  synonyms: true               # sözlüğün kendi eş anlamlılar bölümü
  weight: 0.6                  # genişletme terimlerinin ağırlığı
  term_dictionary: config/term_dictionary.csv
  stopwords: config/stopwords_tr.txt

scoring:
  w_rule: 0.75                 # ADR-022
  w_llm: 0.25
  min_candidate_score: 0.25
  min_answer_score: 0.35
  min_answer_coverage: 0.5      # en iyi obje talebin bilgi içeriğinin yarısını karşılamalı (ADR-013)
  object:
    best_column: 0.35
    coverage: 0.21
    time: 0.07
    granularity: 0.07
    topic: 0.30   # tablonun bütün olarak konuyla uyumu (ADR-028)
  flag_penalty:
    model_estimated: 0.85
    naming_mismatch: 0.90

llm:
  enabled: false
  endpoint: ""                 # OpenAI uyumlu /v1/chat/completions
  model: ""
  temperature: 0.1
  timeout: 900                 # analist akışının 2. adımı uzun cevap yazar (ADR-029)

# Analist akışı (ADR-029): LLM açıksa "ask" cevabını model yazar — önce tüm tablo kataloğundan
# aday seçer, sonra adayların bütün kolon açıklamalarını okuyup raporu yazar. Kurallar ipucu,
# doğrulayıcı ve yedektir (model yoksa / hata verirse kural tabanlı cevap döner).
analyst:
  enabled: true
  shortlist: 14                # 2. adımda kolon kolon okunan aday tablo sayısı
  confusables: 6               # uyarılar için okunan "benzer ama yanlış" tablo sayısı
  family_tables: 2             # bilgi ailesi başına terim aramasıyla eklenen tablo
  family_extra: 6              # bu yolla en fazla eklenen tablo
  batch: false                 # toplu talep de analistle (ölçümde kuraldan geride; ADR-029)
  evidence_columns: 60         # sözlüğün geri kalanından benzer alan sayısı
  description_chars: 420       # kolon açıklaması başına karakter
  full_table_columns: 90       # daha geniş tablolarda yalnız ilgili kolonların açıklaması
  min_confidence: 0.5          # bu güvenin altındaki öneri gösterilmez (ADR-006)
  max_tokens: 8000             # 2. adımın cevap bütçesi

# Bulut modelleri — YALNIZ Model laboratuvarı ölçümü için (ADR-026). Uygulamanın hakemi
# yerelde kalır. Açıkken ölçüm, test soruları ve aday tablo/kolon açıklamalarını dışarı gönderir.
cloud:
  enabled: false
  endpoint: https://integrate.api.nvidia.com/v1   # NVIDIA API kataloğu (build.nvidia.com)
  api_key: ""        # nvapi-… ; boşsa NVIDIA_API_KEY ortam değişkeni
  rpm: 30            # dakikadaki istek sınırı (ücretsiz katman ~40)
  # Birden çok sağlayıcı yan yana: 'active' bir profil adı seçer; boş = yukarıdaki alanlar.
  # Profil kendi adresini, anahtarını (boşsa GEMINI_API_KEY / NVIDIA_API_KEY) ve model adını taşır.
  active: ''
  profiles:
    google:
      endpoint: https://generativelanguage.googleapis.com/v1beta/openai
      api_key: ''
      model: gemma-4-31b-it
      rpm: 15

report:
  out_dir: out
