schema_version: "1.1"
kind: DeterministicOrchestration
metadata:
  id: governed-review
  version: 1.4.0
  owner: team:ai-governance
  lifecycle: draft
  risk_tier: R1
input:
  contract: schema:review-request
  raw_source_visible_to_aggregator: false
agents:
  - agent: agent:gereksinim-kapsami
    required: true
    output_contract: schema:governance-assessment-report-v1-2
  - agent: agent:kurumsal-mimari
    required: true
    output_contract: schema:governance-assessment-report-v1-2
  - agent: agent:kod-kalitesi
    required: true
    output_contract: schema:governance-assessment-report-v1-2
  - agent: agent:kod-inceleme
    required: true
    output_contract: schema:governance-assessment-report-v1-2
  - agent: agent:bilgi-guvenligi
    required: true
    output_contract: schema:governance-assessment-report-v1-2
  - agent: agent:uygulama-guvenligi
    required: true
    output_contract: schema:governance-assessment-report-v1-2
  - agent: agent:acik-kaynak-lisansi
    required: true
    output_contract: schema:governance-assessment-report-v1-2
  - agent: agent:gizlilik-kvkk
    required: true
    output_contract: schema:governance-assessment-report-v1-2
  - agent: agent:test-otomasyonu
    required: true
    output_contract: schema:governance-assessment-report-v1-2
  - agent: agent:dokumantasyon
    required: true
    output_contract: schema:governance-assessment-report-v1-2
  - agent: agent:devops
    required: true
    output_contract: schema:governance-assessment-report-v1-2
  - agent: agent:gozlemlenebilirlik
    required: true
    output_contract: schema:governance-assessment-report-v1-2
execution:
  strategy: parallel-independent
  max_parallel: 12
  agent_isolation: true
  retries: 0
decision:
  engine: deterministic-policy
  policy_ref: policy:governed-review-aggregation
  verify_result_integrity: true
  missing_result: BLOCKED_INCOMPLETE
  failed_result: BLOCKED_INCOMPLETE
  invalid_result: BLOCKED_INCOMPLETE
output:
  contract: schema:governed-review-decision
  audit_required: true
prohibited_agents:
  - agent:otomatik-duzeltme
  - agent:supervisor
