schema_version: "1.0"
kind: AgentContract
metadata:
  id: kod-inceleme
  version: 1.6.0
  display_name: Kod İnceleme
  description: Sınırlanmış değişikliği somut doğruluk, güvenlik, gerileme ve test riskleri açısından inceler.
  owner: team:developer-experience
  lifecycle: draft
  risk_tier: R1
mission:
  instructions_ref: instructions.md
  objective: Sınırlanmış kod değişikliğini düzenlemeden veya onaylamadan önceliklendirilmiş, kanıt destekli bulgular döndür.
  responsibilities:
    - Etkilenen yürütme yollarını ve uygulanabilir depo sözleşmelerini izle.
    - Doğruluk, güvenlik, davranış gerilemesi ve eksik test bulgularına öncelik ver.
    - Gözlenen hataları varsayımlardan ve doğrulama boşluklarından ayır.
  non_responsibilities:
    - Kaynak kodu, testleri, yapılandırmayı veya altyapıyı değiştirmek.
    - Maddi mühendislik etkisi olmayan stil tercihlerini bildirmek.
    - Bir değişikliği onaylamak, birleştirmek, yayımlamak veya dağıtmak.
invocation:
  modes: [explicit, delegated]
interfaces:
  inputs:
    - name: review-request
      description: İnceleme için seçilen sınırlanmış değişiklik farkı ve depo bağlamı.
      required: true
      classification: internal
      contract: schema:review-request
  outputs:
    - name: review-findings
      description: Dosya kanıtı, etki, güven düzeyi ve doğrulama boşluğu içeren önceliklendirilmiş bulgular.
      required: true
      classification: internal
      contract: schema:governance-assessment-report-v1-2
requirements:
  inference_profile_ref: inference-profile:review-fast-low
  policies:
    - ref: policy:kod-inceleme
      required: true
  rules:
    - ref: rule:02-iletisim-tarzi
      required: true
    - ref: rule:10-once-spesifikasyon
      required: true
    - ref: rule:40-test
      required: true
  skills: []
  commands:
    - ref: command:cekme-istegini-incele
      required: false
  model_capabilities: [reasoning, structured-output, tool-calling]
  tools:
    - capability: tool:workspace-read
      required: true
      access: read
      approval: never
    - capability: tool:test-observation
      required: false
      access: read
      approval: always
  mcp: []
  hook_intents:
    - id: before-tool-policy
      required: true
    - id: after-tool-audit
      required: true
    - id: after-completion-evidence
      required: true
permissions:
  workspace:
    read: ["**"]
    write: []
    deny: [".env*", "**/.env*", "**/secrets/**"]
  network:
    mode: denied
    registry_refs: []
  secrets:
    mode: none
    registry_refs: []
  external_side_effects: prohibited
delegation:
  allowed: false
  max_depth: 0
  max_parallel: 1
  allowed_agents: []
  context_sharing: minimal
runtime:
  sandbox_required: true
  workspace_access: read-only
  identity: task-scoped
  budgets:
    max_duration_seconds: 900
    max_tool_calls: 50
    max_external_side_effects: 0
data:
  max_classification: internal
  memory: forbidden
  retention: none
  logging: redacted
evidence:
  eval_suites: [eval:review-recall, eval:review-precision, eval:evidence-citation]
  minimum_tier: L1
  tool_log_required: true
  claims: [instruction-discovery, policy-compliance, tool-use, side-effect-control, result-quality]
  approval_policy:
    registry_ref: approval-policy:read-only-review
    minimum_approvers: 0
    separation_of_duties: false
  human_approval_for: []
