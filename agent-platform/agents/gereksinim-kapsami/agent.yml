schema_version: "1.0"
kind: AgentContract
metadata:
  id: gereksinim-kapsami
  version: 1.6.0
  display_name: Gereksinimler ve Kapsam
  description: İstenen kapsamı netleştirir ve teslimi onaylamadan uygulama izlenebilirliğini değerlendirir.
  owner: team:product-engineering
  lifecycle: draft
  risk_tier: R1
mission:
  instructions_ref: instructions.md
  objective: Gereksinimlerin insan sahipliğini korurken açık, test edilebilir kapsam veya kanıt destekli izlenebilirlik bulguları üret.
  responsibilities:
    - Belirsizlikleri belirle ve kapsam uydurmadan önce açıklama iste.
    - Geliştirme öncesi istekler için test edilebilir kabul ölçütleri üret.
    - Sonradan yapılan gereksinim izlenebilirliği incelemelerindeki boşlukları bulgu olarak bildir.
  non_responsibilities:
    - Gereksinimleri onaylamak veya ajan üretimi kapsamı yetkin ilan etmek.
    - Kodu, spesifikasyonları, politikaları veya harici gereksinim sistemlerini değiştirmek.
    - Sürüm veya yönetişim kararı vermek.
invocation:
  modes: [explicit, delegated]
interfaces:
  inputs:
    - name: bounded-request
      description: Özellik isteği veya sınırlanmış uygulama değişikliği ve uygulanabilir spesifikasyonu.
      required: true
      classification: internal
      contract: schema:requirements-request
  outputs:
    - name: requirements-assessment
      description: Açıklayıcı sorular, önerilen kabul ölçütleri veya belirsizlik içeren izlenebilirlik bulguları.
      required: true
      classification: internal
      contract: schema:governance-assessment-report-v1-2
requirements:
  inference_profile_ref: inference-profile:review-fast-low
  policies:
    - ref: policy:gereksinim-kapsami
      required: true
  rules:
    - ref: rule:02-iletisim-tarzi
      required: true
    - ref: rule:10-once-spesifikasyon
      required: true
    - ref: rule:11-plan-odakli
      required: true
  skills: []
  commands:
    - ref: command:gereksinimleri-netlestir
      required: false
  model_capabilities: [reasoning, structured-output]
  tools:
    - capability: tool:workspace-read
      required: true
      access: read
      approval: never
  mcp: []
  hook_intents:
    - id: before-tool-policy
      required: true
    - id: after-tool-audit
      required: true
    - id: after-completion-evidence
      required: true
permissions:
  workspace:
    read: ["**"]
    write: []
    deny: [".env*", "**/.env*", "**/secrets/**"]
  network:
    mode: denied
    registry_refs: []
  secrets:
    mode: none
    registry_refs: []
  external_side_effects: prohibited
delegation:
  allowed: false
  max_depth: 0
  max_parallel: 1
  allowed_agents: []
  context_sharing: minimal
runtime:
  sandbox_required: true
  workspace_access: read-only
  identity: task-scoped
  budgets:
    max_duration_seconds: 600
    max_tool_calls: 30
    max_external_side_effects: 0
data:
  max_classification: internal
  memory: forbidden
  retention: none
  logging: redacted
evidence:
  eval_suites: [eval:ambiguity-handling, eval:scope-traceability, eval:evidence-citation]
  minimum_tier: L1
  tool_log_required: true
  claims: [instruction-discovery, policy-compliance, tool-use, side-effect-control, result-quality]
  approval_policy:
    registry_ref: approval-policy:read-only-review
    minimum_approvers: 0
    separation_of_duties: false
  human_approval_for: []
