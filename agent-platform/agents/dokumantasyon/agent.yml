schema_version: "1.0"
kind: AgentContract
metadata:
  id: dokumantasyon
  version: 1.6.0
  display_name: Dokümantasyon
  description: Dokümantasyon bütünlüğünü değerlendirir ve sınırlı dokümantasyon güncellemeleri önerir.
  owner: team:developer-experience
  lifecycle: draft
  risk_tier: R1
mission:
  instructions_ref: instructions.md
  objective: Varsayılan pakette dosya yazmadan dokümantasyon boşluklarını ve önerilen güncellemeyi döndür.
  responsibilities:
    - README, herkese açık API dokümantasyonu, örnekler ve kaynakta belirtilen kapsam eşiklerini değerlendir.
    - Önerilen metni gözlenen davranış ve kabul edilmiş spesifikasyonlarla uyumlu tut.
    - Dokümantasyon değişikliği işlemi için gereken ayrı onayı ve yazma kapsamını belirt.
  non_responsibilities:
    - Varsayılan salt okunur paketten dokümantasyon yazmak veya yayımlamak.
    - Depo kanıtıyla doğrulanmamış davranış, komut, uç nokta veya garanti uydurmak.
    - Dokümantasyon üretimini ürün uygulaması olarak ele almak.
invocation:
  modes: [explicit, delegated]
interfaces:
  inputs:
    - name: dokumantasyon-inceleme-istegi
      description: Sınırlanmış değişiklik ve ilgili dokümantasyon yüzeyleri.
      required: true
      classification: internal
      contract: schema:review-request
  outputs:
    - name: dokumantasyon-onerisi
      description: Dokümantasyon boşlukları, kanıt ve ayrı yazma kabulü gerektiren önerilen metin.
      required: true
      classification: internal
      contract: schema:governance-assessment-report-v1-2
requirements:
  inference_profile_ref: inference-profile:review-fast-low
  policies:
    - ref: policy:dokumantasyon
      required: true
  rules:
    - ref: rule:02-iletisim-tarzi
      required: true
    - ref: rule:10-once-spesifikasyon
      required: true
    - ref: rule:40-test
      required: true
  skills: []
  commands: []
  model_capabilities: [reasoning, structured-output, tool-calling]
  tools:
    - capability: tool:workspace-read
      required: true
      access: read
      approval: never
  mcp: []
  hook_intents:
    - id: before-tool-policy
      required: true
    - id: after-tool-audit
      required: true
    - id: after-completion-evidence
      required: true
permissions:
  workspace:
    read: ["**"]
    write: []
    deny: [".env*", "**/.env*", "**/secrets/**"]
  network:
    mode: denied
    registry_refs: []
  secrets:
    mode: none
    registry_refs: []
  external_side_effects: prohibited
delegation:
  allowed: false
  max_depth: 0
  max_parallel: 1
  allowed_agents: []
  context_sharing: minimal
runtime:
  sandbox_required: true
  workspace_access: read-only
  identity: task-scoped
  budgets:
    max_duration_seconds: 900
    max_tool_calls: 50
    max_external_side_effects: 0
data:
  max_classification: internal
  memory: forbidden
  retention: none
  logging: redacted
evidence:
  eval_suites: [eval:dokumantasyon-soy-zinciri]
  minimum_tier: L1
  tool_log_required: true
  claims: [instruction-discovery, policy-compliance, tool-use, side-effect-control, result-quality]
  approval_policy:
    registry_ref: approval-policy:dokumantasyon
    minimum_approvers: 0
    separation_of_duties: false
  human_approval_for: []
