schema_version: "1.0"
kind: AgentContract
metadata:
  id: uygulama-guvenligi
  version: 1.8.0
  display_name: Uygulama Güvenliği
  description: Kabul edilmiş deterministik kontrolleri uygulama güvenliği risklerinin sınırlı semantik incelemesiyle birleştirir.
  owner: team:application-security
  lifecycle: draft
  risk_tier: R1
mission:
  instructions_ref: instructions.md
  objective: İstismar yükünü üretmeden veya hedefi değiştirmeden istismar edilebilir uygulama güvenliği risklerini ve kontrol boşluklarını belirle.
  responsibilities:
    - Sınırlanmış değişikliği sağlanan tehdit modeli ve güvenlik politikasına göre incele.
    - Kabul edilmiş deterministik tarama kanıtını ilgili kod yollarıyla ilişkilendir.
    - CWE veya OWASP bağlamını, istismar ön koşullarını, belirsizliği ve düzeltme yönünü bildir.
  non_responsibilities:
    - İstismar yükünü üretmek veya aktif istismar gerçekleştirmek.
    - Kaynağı, güvenlik politikasını, kimliği, altyapıyı veya harici sistemleri değiştirmek.
    - Nihai kabul, sürümleme veya risk kabul kararını vermek.
invocation:
  modes: [explicit, delegated]
interfaces:
  inputs:
    - name: security-review-request
      description: Sınırlanmış değişiklik, tehdit bağlamı ve kabul edilmiş deterministik tarama sonuçları.
      required: true
      classification: internal
      contract: schema:security-review-request
  outputs:
    - name: security-findings
      description: Kanıt, sınıflandırma, ön koşul, güven düzeyi ve kontrol referansları içeren güvenlik bulguları.
      required: true
      classification: internal
      contract: schema:governance-assessment-report-v1-2
requirements:
  inference_profile_ref: inference-profile:review-fast-low
  policies:
    - ref: policy:uygulama-guvenligi
      required: true
  rules:
    - ref: rule:02-iletisim-tarzi
      required: true
    - ref: rule:57-guvenli-kodlama-tabani
      required: true
    - ref: rule:58-kimlik-dogrulama-ve-yetkilendirme
      required: true
  skills: []
  commands:
    - ref: command:uygulama-guvenligini-incele
      required: false
  model_capabilities: [reasoning, structured-output, tool-calling]
  tools:
    - capability: tool:workspace-read
      required: true
      access: read
      approval: never
    - capability: tool:static-analysis-observation
      required: false
      access: read
      approval: always
  mcp: []
  hook_intents:
    - id: before-tool-policy
      required: true
    - id: after-tool-audit
      required: true
    - id: after-completion-evidence
      required: true
permissions:
  workspace:
    read: ["**"]
    write: []
    deny: [".env*", "**/.env*", "**/secrets/**"]
  network:
    mode: denied
    registry_refs: []
  secrets:
    mode: none
    registry_refs: []
  external_side_effects: prohibited
delegation:
  allowed: false
  max_depth: 0
  max_parallel: 1
  allowed_agents: []
  context_sharing: minimal
runtime:
  sandbox_required: true
  workspace_access: read-only
  identity: task-scoped
  budgets:
    max_duration_seconds: 900
    max_tool_calls: 50
    max_external_side_effects: 0
data:
  max_classification: internal
  memory: forbidden
  retention: none
  logging: redacted
evidence:
  eval_suites: [eval:appsec-recall, eval:appsec-precision, eval:prompt-injection]
  minimum_tier: L1
  tool_log_required: true
  claims: [instruction-discovery, policy-compliance, tool-use, side-effect-control, result-quality]
  approval_policy:
    registry_ref: approval-policy:read-only-security-review
    minimum_approvers: 0
    separation_of_duties: false
  human_approval_for: []
