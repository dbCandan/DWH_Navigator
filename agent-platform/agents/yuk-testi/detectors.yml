schema_version: "1.5"
kind: DeterministicDetectorPack
metadata:
  id: detector-pack:yuk-testi
  version: 1.0.0
  owner: team:quality-engineering
  lifecycle: draft
agent_ref: agent:yuk-testi
policy_ref: policy:yuk-testi
source_lineage:
  source_role: governance-source:desktop-agents/load-test
  source_authority: governance-authoritative
  implementation_status: implementation-pending
  projection_status: not-projectable
  runtime_admission: not-admitted
  crosswalk_ref: governance-crosswalk:desktop-agents-v1
execution_boundary:
  mode: specification-only
  executor_ref: null
  implementation_status: implementation-pending
  projection_status: not-projectable
  runtime_admission: not-admitted
  calibration_status: uncalibrated
detectors:
  - id: detector:yuk-testi/sabit-hedef-adresi
    source_refs:
      - governance-source:desktop-agents/load-test/detectors.yaml#detector/sabit-hedef-adresi
    control_refs:
      - control:LOAD-102
    severity: critical
    evidence_kind: deterministic-check
    standard_refs: []
    implementation:
      kind: regex
      engine: python-re
      pattern: 'https?://'
      flags: [IGNORECASE]
    limitations: Senaryo hedefi yalnız çalıştırıcının verdiği BASE_URL ortam değişkeninden almalıdır; yorum satırları ve dış modül adresleri de bilinçli olarak eşleşir. Dinamik birleştirilen adresleri yakalamaz, bu nedenle çalıştırıcının izinli ortam denetimi ayrıca zorunludur.
    implementation_status: calibration-pending
    projection_status: not-projectable
    runtime_admission: not-admitted
    lifecycle: draft
  - id: detector:yuk-testi/dis-yan-etkili-uc-nokta
    source_refs:
      - governance-source:desktop-agents/load-test/detectors.yaml#detector/dis-yan-etkili-uc-nokta
    control_refs:
      - control:LOAD-104
    severity: high
    evidence_kind: deterministic-check
    standard_refs: []
    implementation:
      kind: regex
      engine: python-re
      pattern: '/(sms|e-?mail|mail|notification|bildirim|odeme|payment|webhook|callback)s?\b'
      flags: [IGNORECASE]
    limitations: Rota adına dayalı sezgisel desendir. Dış yan etkili uç noktalar OpenAPI'de ayrıca işaretlenmelidir; adı bu desene uymayan dış çağrılar yakalanmaz.
    implementation_status: calibration-pending
    projection_status: not-projectable
    runtime_admission: not-admitted
    lifecycle: draft
  - id: detector:yuk-testi/senaryo-uretilemedi
    source_refs:
      - governance-source:desktop-agents/load-test/detectors.yaml#detector/senaryo-uretilemedi
    control_refs:
      - control:LOAD-109
    severity: medium
    evidence_kind: test-result
    standard_refs: []
    implementation:
      kind: event
      event: test-generation-failed
    limitations: Senaryo üretilemediğinde yürütme başlatılmaz; neden sözleşme eksikliği veya sınıflandırılamayan uç nokta olabilir.
    implementation_status: calibration-pending
    projection_status: not-projectable
    runtime_admission: not-admitted
    lifecycle: draft
  - id: detector:yuk-testi/yuk-testi-zaman-asimi
    source_refs:
      - governance-source:desktop-agents/load-test/detectors.yaml#detector/yuk-testi-zaman-asimi
    control_refs:
      - control:LOAD-106
    severity: high
    evidence_kind: test-result
    standard_refs: []
    implementation:
      kind: event
      event: test-execution-timeout
    limitations: Çalıştırıcının dış zaman aşımıdır; yük aracının kendi eşik nedeniyle durdurması bu olay değildir.
    implementation_status: calibration-pending
    projection_status: not-projectable
    runtime_admission: not-admitted
    lifecycle: draft
  - id: detector:yuk-testi/yuk-testi-tamamlanamadi
    source_refs:
      - governance-source:desktop-agents/load-test/detectors.yaml#detector/yuk-testi-tamamlanamadi
    control_refs:
      - control:LOAD-106
    severity: high
    evidence_kind: test-result
    standard_refs: []
    implementation:
      kind: event
      event: test-execution-failed
    limitations: Test ortamı hazır olmadığında, sonuç özeti eksik veya bozuk olduğunda ya da beklenen senaryo koşmadığında üretilir; sonuç temiz sayılmaz.
    implementation_status: calibration-pending
    projection_status: not-projectable
    runtime_admission: not-admitted
    lifecycle: draft
decision_metadata:
  authoritative_hard_fail_detectors:
    - detector:yuk-testi/sabit-hedef-adresi
  authoritative_non_hard_fail_detectors:
    - detector:yuk-testi/dis-yan-etkili-uc-nokta
    - detector:yuk-testi/senaryo-uretilemedi
    - detector:yuk-testi/yuk-testi-zaman-asimi
    - detector:yuk-testi/yuk-testi-tamamlanamadi
  hard_fail_not_declared_detectors: []
  unresolved_hard_fail_detectors: []
  unresolved_decision_conflicts: []
runtime_profile:
  id: runtime-profile:yuk-testi-yalitilmis
  source_refs:
    - governance-source:desktop-agents/load-test/detectors.yaml#setting/runtime/max-generation-retries
    - governance-source:desktop-agents/load-test/detectors.yaml#setting/runtime/test-timeout-seconds
    - governance-source:desktop-agents/load-test/detectors.yaml#setting/runtime/result-timeout-seconds
  max_generation_retries: 1
  test_timeout_seconds: 1500
  result_timeout_seconds: 60
  network: denied
  inherited_secrets: false
  project_workspace_write: false
  source_authority: governance-authoritative
  implementation_status: implementation-pending
  projection_status: not-projectable
  runtime_admission: not-admitted
