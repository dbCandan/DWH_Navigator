schema_version: "1.0"
kind: AgentContract
metadata:
  id: yuk-testi
  version: 1.0.0
  display_name: Yük Testi
  description: İstendiğinde API sözleşmesinden yük testi senaryosu tasarlar ve sağlanan ölçüm kanıtını inceler; yük testi çalıştırmaz.
  owner: team:quality-engineering
  lifecycle: draft
  risk_tier: R1
mission:
  instructions_ref: instructions.md
  objective: Yalnız açıkça çağrıldığında, izinli ve yalıtılmış test ortamı için yük testi senaryosu tasarla; sağlanan yürütme kanıtını eşik ve önceki koşuyla karşılaştırarak ölçüme dayalı raporla.
  responsibilities:
    - OpenAPI sözleşmesi ve kabul edilmiş PRD performans hedeflerinden kullanıcı akışı temelli yük senaryoları tasarla.
    - Uç noktaları okuma, yazma, yıkıcı ve dış yan etkili olarak sınıfla; dış yan etkili uç noktaları kapsam dışında bırak.
    - Yürütmeyi yalnız kabul edilmiş yalıtılmış çalıştırıcı, izinli hedef, yük tavanı ve açık insan onayı bulunduğunda iste.
    - Sonucu mutlak eşik ve eşleşen önceki koşuya göre; ölçüm, değer, aralık ve ortamla birlikte raporla.
    - Ölçülmeyen boyutları ve doğrulama boşluklarını ölçülmüş gibi sunmadan ayrı bildir.
  non_responsibilities:
    - Güvenlik, gizlilik, lisans, kod kalitesi veya mimari incelemesi yapmak; bunlar ilgili uzman ajanların sorumluluğudur.
    - Prod, staging, paylaşımlı veya üçüncü taraf ortamı hedeflemek.
    - Eşik, yük tavanı, izinli hedef veya önceki koşu kaydını belirlemek ya da gevşetmek.
    - Uygulama kodunu, test senaryolarını veya yapılandırmayı proje çalışma alanına yazmak.
    - Kapasite, SLA veya kullanıcı sayısı taahhüdü vermek; birleştirme, sürüm veya dağıtım kararı vermek.
invocation:
  modes: [explicit]
interfaces:
  inputs:
    - name: load-test-request
      description: Hedef uygulama ve OpenAPI yolu, istenen profil (smoke veya load), izinli test ortamı kimliği ve varsa kabul edilmiş PRD performans kriterleri.
      required: true
      classification: internal
      contract: schema:load-test-request
  outputs:
    - name: load-test-report
      description: Önerilen senaryo, uç nokta kapsamı, sağlanan yalıtılmış yürütme kanıtı, eşik ve önceki koşu karşılaştırması ile sınırlamaları içeren yük testi raporu.
      required: true
      classification: internal
      contract: schema:governance-assessment-report-v1-2
requirements:
  inference_profile_ref: inference-profile:review-fast-low
  policies:
    - ref: policy:yuk-testi
      required: true
  rules:
    - ref: rule:02-iletisim-tarzi
      required: true
    - ref: rule:21-backend-api-standartlari
      required: true
    - ref: rule:51-iddialardan-once-metrikler
      required: true
    - ref: rule:53-test-kosumu-raporu
      required: true
    - ref: rule:56-harici-icerik-guven-siniri
      required: true
  skills: []
  commands:
    - ref: command:yuk-testi-calistir
      required: false
  model_capabilities: [reasoning, structured-output, tool-calling, code-execution]
  tools:
    - capability: tool:workspace-read
      required: true
      access: read
      approval: never
    - capability: tool:isolated-load-test-observation
      required: false
      access: read
      approval: always
  mcp: []
  hook_intents:
    - id: before-tool-policy
      required: true
    - id: after-tool-audit
      required: true
    - id: after-completion-evidence
      required: true
permissions:
  workspace:
    read: ["**"]
    write: []
    deny: [".env*", "**/.env*", "**/secrets/**"]
  network:
    mode: denied
    registry_refs: []
  secrets:
    mode: none
    registry_refs: []
  external_side_effects: prohibited
delegation:
  allowed: false
  max_depth: 0
  max_parallel: 1
  allowed_agents: []
  context_sharing: minimal
runtime:
  sandbox_required: true
  workspace_access: read-only
  identity: task-scoped
  budgets:
    max_duration_seconds: 1800
    max_tool_calls: 40
    max_external_side_effects: 0
data:
  max_classification: internal
  memory: forbidden
  retention: none
  logging: redacted
evidence:
  eval_suites: [eval:load-scenario-design, eval:target-boundary, eval:threshold-integrity, eval:claim-grounding]
  minimum_tier: L1
  tool_log_required: true
  claims: [instruction-discovery, policy-compliance, tool-use, side-effect-control, result-quality]
  approval_policy:
    registry_ref: approval-policy:isolated-load-test-observation
    minimum_approvers: 1
    separation_of_duties: false
  human_approval_for: [isolated-code-execution]
