schema_version: "1.0"
kind: AgentContract
metadata:
  id: gozlemlenebilirlik
  version: 1.6.0
  display_name: Gözlemlenebilirlik
  description: Yerel günlükleme, hata görünürlüğü ve sağlık denetimi gereksinimlerini değerlendirir.
  owner: team:platform-engineering
  lifecycle: draft
  risk_tier: R1
mission:
  instructions_ref: instructions.md
  objective: Dosya yazmadan veya merkezi telemetri iddiasında bulunmadan gözlemlenebilirlik bulguları ve önerilen tanılama yapıtları döndür.
  responsibilities:
    - Yapılandırılmış günlükleme, sessiz hata, sağlık denetimi ve değer yerleştirme gözlemlerini değerlendir.
    - Yerel tanılama gereksinimlerini merkezi telemetri ve değiştirilemez denetim altyapısından ayır.
    - Üretilen dosya önerisini uygulamadan açıkla.
  non_responsibilities:
    - İzleme dosyası yazmak, toplayıcı yapılandırmak veya çalışma zamanı günlüklemesini değiştirmek.
    - Merkezi OpenTelemetry, pano, uyarı veya değiştirilemez denetim teslimi iddia etmek.
    - Yalnız `print` tespitini üretim olayı olarak ele almak.
invocation:
  modes: [explicit, delegated]
interfaces:
  inputs:
    - name: gozlemlenebilirlik-inceleme-istegi
      description: Sınırlanmış değişiklik ve ilgili yerel operasyonel yüzeyler.
      required: true
      classification: internal
      contract: schema:review-request
  outputs:
    - name: gozlemlenebilirlik-bulgulari
      description: Yerel gözlemlenebilirlik bulguları ve uygulanmamış tanılama önerileri.
      required: true
      classification: internal
      contract: schema:governance-assessment-report-v1-2
requirements:
  inference_profile_ref: inference-profile:review-fast-low
  policies:
    - ref: policy:gozlemlenebilirlik
      required: true
  rules:
    - ref: rule:02-iletisim-tarzi
      required: true
    - ref: rule:10-once-spesifikasyon
      required: true
    - ref: rule:40-test
      required: true
  skills: []
  commands: []
  model_capabilities: [reasoning, structured-output, tool-calling]
  tools:
    - capability: tool:workspace-read
      required: true
      access: read
      approval: never
  mcp: []
  hook_intents:
    - id: before-tool-policy
      required: true
    - id: after-tool-audit
      required: true
    - id: after-completion-evidence
      required: true
permissions:
  workspace:
    read: ["**"]
    write: []
    deny: [".env*", "**/.env*", "**/secrets/**"]
  network:
    mode: denied
    registry_refs: []
  secrets:
    mode: none
    registry_refs: []
  external_side_effects: prohibited
delegation:
  allowed: false
  max_depth: 0
  max_parallel: 1
  allowed_agents: []
  context_sharing: minimal
runtime:
  sandbox_required: true
  workspace_access: read-only
  identity: task-scoped
  budgets:
    max_duration_seconds: 900
    max_tool_calls: 50
    max_external_side_effects: 0
data:
  max_classification: internal
  memory: forbidden
  retention: none
  logging: redacted
evidence:
  eval_suites: [eval:gozlemlenebilirlik-soy-zinciri]
  minimum_tier: L1
  tool_log_required: true
  claims: [instruction-discovery, policy-compliance, tool-use, side-effect-control, result-quality]
  approval_policy:
    registry_ref: approval-policy:gozlemlenebilirlik
    minimum_approvers: 0
    separation_of_duties: false
  human_approval_for: []
