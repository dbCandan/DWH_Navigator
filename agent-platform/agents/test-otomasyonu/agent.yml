schema_version: "1.0"
kind: AgentContract
metadata:
  id: test-otomasyonu
  version: 1.7.0
  display_name: Test Otomasyonu
  description: Sınırlı testler tasarlar ve bunları yalnız kabul edilmiş yalıtılmış yürütme yetkinliği üzerinden gözlemler.
  owner: team:quality-engineering
  lifecycle: draft
  risk_tier: R1
mission:
  instructions_ref: instructions.md
  objective: Üretilen kodu yalıtılmış tek kullanımlık çalıştırıcı içinde tutarak istenen davranış için odaklı testler üret ve değerlendir.
  responsibilities:
    - Sağlanan davranıştan pozitif, negatif, sınır ve gerileme durumları türet.
    - Yalıtılmış yürütmeyi yalnız kabul edilmiş çalıştırıcı ve açık onay bulunduğunda iste.
    - Komutu, sürümü, çıkış durumunu, süreyi, atlamayı ve arındırılmış çıktıyı kanıt olarak bildir.
    - Testleri yalnız bağlanan PRD'nin kabul kriterinden türet; kriter sürümünü, içerik özetini ve kabul ya da taslak yaşam döngüsünü rapora bağla.
  non_responsibilities:
    - Üretilen testleri veya yapıtları proje çalışma alanına yazmak.
    - Ağ hizmetlerine, devralınmış gizli bilgilere veya üretim benzeri veriye erişmek.
    - Nihai teslim veya yönetişim kararını vermek.
invocation:
  modes: [explicit, delegated]
interfaces:
  inputs:
    - name: test-request
      description: Çağıranın seçtiği sınırlanmış davranış, kaynak bağlamı ve test kısıtları.
      required: true
      classification: internal
      contract: schema:test-request
  outputs:
    - name: test-evidence
      description: Dondurulmuş kabul kriteri sürümüne bağlı; hata, zaman aşımı, atlama ve belirsizlik içeren önerilen testler ve yalıtılmış yürütme kanıtı.
      required: true
      classification: internal
      contract: schema:governance-assessment-report-v1-2
requirements:
  inference_profile_ref: inference-profile:review-fast-low
  policies:
    - ref: policy:test-otomasyonu
      required: true
  rules:
    - ref: rule:02-iletisim-tarzi
      required: true
    - ref: rule:40-test
      required: true
    - ref: rule:57-guvenli-kodlama-tabani
      required: true
  skills: []
  commands:
    - ref: command:yalitilmis-testleri-calistir
      required: false
  model_capabilities: [reasoning, structured-output, code-execution]
  tools:
    - capability: tool:workspace-read
      required: true
      access: read
      approval: never
    - capability: tool:isolated-test-observation
      required: false
      access: read
      approval: always
  mcp: []
  hook_intents:
    - id: before-tool-policy
      required: true
    - id: after-tool-audit
      required: true
    - id: after-completion-evidence
      required: true
permissions:
  workspace:
    read: ["**"]
    write: []
    deny: [".env*", "**/.env*", "**/secrets/**"]
  network:
    mode: denied
    registry_refs: []
  secrets:
    mode: none
    registry_refs: []
  external_side_effects: prohibited
delegation:
  allowed: false
  max_depth: 0
  max_parallel: 1
  allowed_agents: []
  context_sharing: minimal
runtime:
  sandbox_required: true
  workspace_access: read-only
  identity: task-scoped
  budgets:
    max_duration_seconds: 300
    max_tool_calls: 20
    max_external_side_effects: 0
data:
  max_classification: internal
  memory: forbidden
  retention: none
  logging: redacted
evidence:
  eval_suites: [eval:test-design, eval:runner-isolation, eval:timeout-enforcement]
  minimum_tier: L1
  tool_log_required: true
  claims: [instruction-discovery, policy-compliance, tool-use, side-effect-control, result-quality]
  approval_policy:
    registry_ref: approval-policy:isolated-test-observation
    minimum_approvers: 1
    separation_of_duties: false
  human_approval_for: [isolated-code-execution]
