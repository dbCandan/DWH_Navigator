schema_version: "1.0"
kind: AgentContract
metadata:
  id: otomatik-duzeltme
  version: 1.4.0
  display_name: Otomatik Düzeltme
  description: Değişiklik yetkisi kazanmadan, yetkilendirilmiş başarısız incelemeden sınırlı düzeltme önerileri üretir.
  owner: team:ai-governance
  lifecycle: draft
  risk_tier: R2
mission:
  instructions_ref: instructions.md
  objective: Kod değişikliği işlemini ayrı kabul edilmiş `FixRequest` sınırında tutarak uygun bulgular için türlendirilmiş ve asgari bir `FixProposal` döndür.
  responsibilities:
    - Önerilen her değişikliği uygun kaynak bulguya ve yapılandırılmış düzeltme kuralına izle.
    - Asgari deterministik dönüşümleri tercih et ve güvenli öneri yoksa bunu belirt.
    - Değişiklik öncesinde ayrı yazma kapsamı, insan onayı, geri alma kanıtı ve yeniden tarama iste.
  non_responsibilities:
    - Bu salt okunur paketten dosya değiştirmek, test çalıştırmak veya işlem hattını yeniden çalıştırmak.
    - Devre dışı veya tanınmayan düzeltme kuralını otomatik uygulanabilir olarak önermek.
    - Denetleyici hatasını veya istemini yazma yetkisi olarak ele almak.
invocation:
  modes: [explicit, delegated]
interfaces:
  inputs:
    - name: authorized-failure-report
      description: Özete bağlı başarısız inceleme ve uygun bulgu kümesi.
      required: true
      classification: internal
      contract: schema:review-request
  outputs:
    - name: fix-proposal
      description: Türlendirilmiş önerilen yama, kaynak bulgu referansları, riskler ve gerekli onaylar.
      required: true
      classification: internal
      contract: schema:fix-proposal
requirements:
  inference_profile_ref: inference-profile:otomatik-duzeltme
  policies:
    - ref: policy:otomatik-duzeltme
      required: true
  rules:
    - ref: rule:02-iletisim-tarzi
      required: true
    - ref: rule:10-once-spesifikasyon
      required: true
    - ref: rule:40-test
      required: true
  skills: []
  commands: []
  model_capabilities: [reasoning, structured-output, tool-calling]
  tools:
    - capability: tool:workspace-read
      required: true
      access: read
      approval: never
  mcp: []
  hook_intents:
    - id: before-tool-policy
      required: true
    - id: after-tool-audit
      required: true
    - id: after-completion-evidence
      required: true
permissions:
  workspace:
    read: ["**"]
    write: []
    deny: [".env*", "**/.env*", "**/secrets/**"]
  network:
    mode: denied
    registry_refs: []
  secrets:
    mode: none
    registry_refs: []
  external_side_effects: prohibited
delegation:
  allowed: false
  max_depth: 0
  max_parallel: 1
  allowed_agents: []
  context_sharing: minimal
runtime:
  sandbox_required: true
  workspace_access: read-only
  identity: task-scoped
  budgets:
    max_duration_seconds: 900
    max_tool_calls: 50
    max_external_side_effects: 0
data:
  max_classification: internal
  memory: forbidden
  retention: none
  logging: redacted
evidence:
  eval_suites: [eval:otomatik-duzeltme-soy-zinciri]
  minimum_tier: L2
  tool_log_required: true
  claims: [instruction-discovery, policy-compliance, tool-use, side-effect-control, result-quality]
  approval_policy:
    registry_ref: approval-policy:otomatik-duzeltme
    minimum_approvers: 1
    separation_of_duties: false
  human_approval_for: [privileged-write]
