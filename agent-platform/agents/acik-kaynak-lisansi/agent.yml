schema_version: "1.0"
kind: AgentContract
metadata:
  id: acik-kaynak-lisansi
  version: 1.18.0
  display_name: Açık Kaynak ve Lisans
  description: Kapıyı geçersiz kılmadan deterministik bağımlılık izin listesi ve lisans politikası sonuçlarını açıklar.
  owner: team:open-source-governance
  lifecycle: draft
  risk_tier: R1
mission:
  instructions_ref: instructions.md
  objective: İzin veya ret kararlarını deterministik politika değerlendirmesine bırakarak izlenebilir bağımlılık ve lisans bulguları döndür.
  responsibilities:
    - Paket, teknoloji, sürüm, kaynak ve lisans gözlemlerini yetkin izin listesine ve politikaya izle.
    - Sağlanan izin listesindeki çelişkileri sessizce taraf seçmek yerine koru.
    - Deterministik politika sonuçlarını açıklayıcı model çıktısından ayır.
  non_responsibilities:
    - Listelenmemiş bağımlılığı onaylamak veya deterministik ret sonucunu geçersiz kılmak.
    - İzin listesi varlığından zararlı yazılım yokluğu, hukuki uygunluk veya güvenlik açığı güvencesi iddia etmek.
    - Paket indirmek veya harici kayıt defterini sorgulamak.
invocation:
  modes: [explicit, delegated]
interfaces:
  inputs:
    - name: dependency-review-request
      description: Kaynak beyanlarıyla sınırlanmış bağımlılık ve teknoloji envanteri.
      required: true
      classification: internal
      contract: schema:review-request
  outputs:
    - name: dependency-findings
      description: Deterministik politika referansları, çelişkiler ve açıklayıcı bulgular.
      required: true
      classification: internal
      contract: schema:governance-assessment-report-v1-2
requirements:
  inference_profile_ref: inference-profile:review-fast-low
  policies:
    - ref: policy:acik-kaynak-lisansi
      required: true
  rules:
    - ref: rule:02-iletisim-tarzi
      required: true
    - ref: rule:10-once-spesifikasyon
      required: true
    - ref: rule:40-test
      required: true
  skills: []
  commands: []
  model_capabilities: [reasoning, structured-output, tool-calling]
  tools:
    - capability: tool:workspace-read
      required: true
      access: read
      approval: never
  mcp: []
  hook_intents:
    - id: before-tool-policy
      required: true
    - id: after-tool-audit
      required: true
    - id: after-completion-evidence
      required: true
permissions:
  workspace:
    read: ["**"]
    write: []
    deny: [".env*", "**/.env*", "**/secrets/**"]
  network:
    mode: denied
    registry_refs: []
  secrets:
    mode: none
    registry_refs: []
  external_side_effects: prohibited
delegation:
  allowed: false
  max_depth: 0
  max_parallel: 1
  allowed_agents: []
  context_sharing: minimal
runtime:
  sandbox_required: true
  workspace_access: read-only
  identity: task-scoped
  budgets:
    max_duration_seconds: 900
    max_tool_calls: 50
    max_external_side_effects: 0
data:
  max_classification: internal
  memory: forbidden
  retention: none
  logging: redacted
evidence:
  eval_suites: [eval:acik-kaynak-lisansi-soy-zinciri]
  minimum_tier: L1
  tool_log_required: true
  claims: [instruction-discovery, policy-compliance, tool-use, side-effect-control, result-quality]
  approval_policy:
    registry_ref: approval-policy:acik-kaynak-lisansi
    minimum_approvers: 0
    separation_of_duties: false
  human_approval_for: []
