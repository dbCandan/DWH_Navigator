schema_version: "1.0"
kind: AgentContract
metadata:
  id: kod-kalitesi
  version: 1.6.0
  display_name: Kod Kalitesi
  description: Bakım kolaylığı, okunabilirlik, yapısal kalite ve kaynakta belirtilen mühendislik standartlarını değerlendirir.
  owner: team:developer-experience
  lifecycle: draft
  risk_tier: R1
mission:
  instructions_ref: instructions.md
  objective: Uygulamayı değiştirmeden kanıt destekli kod kalitesi bulguları ve iyileştirme yönlendirmesi döndür.
  responsibilities:
    - Kaynakta belirtilen sözcüksel ve yapısal kalite gereksinimlerini değerlendir.
    - Deterministik gözlemleri semantik iyileştirme önerilerinden ayır.
    - Çakışan güvenlik gözlemlerini, sahibi güvenlik rolünü bastırmadan bildir.
  non_responsibilities:
    - Kodu değiştirmek veya stil tercihini doğruluk hatası olarak sunmak.
    - Yalnız algılayıcı belirtimi varken AST veya karmaşıklık uygulatımı iddiasında bulunmak.
    - Bir değişikliği onaylamak, birleştirmek, yayımlamak veya dağıtmak.
invocation:
  modes: [explicit, delegated]
interfaces:
  inputs:
    - name: quality-review-request
      description: Sınırlanmış kod değişikliği ve ilgili proje bağlamı.
      required: true
      classification: internal
      contract: schema:review-request
  outputs:
    - name: quality-findings
      description: Konum, kanıt, teknik durum ve öneri içeren kalite bulguları.
      required: true
      classification: internal
      contract: schema:governance-assessment-report-v1-2
requirements:
  inference_profile_ref: inference-profile:review-fast-low
  policies:
    - ref: policy:kod-kalitesi
      required: true
  rules:
    - ref: rule:02-iletisim-tarzi
      required: true
    - ref: rule:10-once-spesifikasyon
      required: true
    - ref: rule:40-test
      required: true
  skills: []
  commands: []
  model_capabilities: [reasoning, structured-output, tool-calling]
  tools:
    - capability: tool:workspace-read
      required: true
      access: read
      approval: never
  mcp: []
  hook_intents:
    - id: before-tool-policy
      required: true
    - id: after-tool-audit
      required: true
    - id: after-completion-evidence
      required: true
permissions:
  workspace:
    read: ["**"]
    write: []
    deny: [".env*", "**/.env*", "**/secrets/**"]
  network:
    mode: denied
    registry_refs: []
  secrets:
    mode: none
    registry_refs: []
  external_side_effects: prohibited
delegation:
  allowed: false
  max_depth: 0
  max_parallel: 1
  allowed_agents: []
  context_sharing: minimal
runtime:
  sandbox_required: true
  workspace_access: read-only
  identity: task-scoped
  budgets:
    max_duration_seconds: 900
    max_tool_calls: 50
    max_external_side_effects: 0
data:
  max_classification: internal
  memory: forbidden
  retention: none
  logging: redacted
evidence:
  eval_suites: [eval:kod-kalitesi-soy-zinciri]
  minimum_tier: L1
  tool_log_required: true
  claims: [instruction-discovery, policy-compliance, tool-use, side-effect-control, result-quality]
  approval_policy:
    registry_ref: approval-policy:kod-kalitesi
    minimum_approvers: 0
    separation_of_duties: false
  human_approval_for: []
