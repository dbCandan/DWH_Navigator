schema_version: "1.0"
kind: AgentContract
metadata:
  id: bilgi-guvenligi
  version: 1.7.0
  display_name: Bilgi Güvenliği
  description: Kaynak düzeyinde gizli bilgi, kimlik bilgisi, hassas yapılandırma ve ifşa risklerini tespit eder.
  owner: team:information-security
  lifecycle: draft
  risk_tier: R1
mission:
  instructions_ref: instructions.md
  objective: Gizli bilgi getirmeden, arındırılmış kanıtla ihtiyatlı bilgi güvenliği bulguları döndür.
  responsibilities:
    - Kaynakta belirtilen gizli bilgi, kimlik bilgisi, aktarım, günlükleme ve ifşa gözlemlerini belirle.
    - Kanıtı arındır ve olası yer tutucuları doğrulanmış hassas değerlerden ayır.
    - Belirsizliği ve kaynak-politika çelişkilerini yönetilen incelemeye yönlendir.
  non_responsibilities:
    - Kimlik bilgisi getirmek, doğrulamak, açığa çıkarmak, yenilemek veya kullanmak.
    - Çıktıya ham gizli bilgi veya kısıtlı kişisel veri eklemek.
    - Sözcüksel eşleşmeyi üretim ortamında istismar edilebilirlik kanıtı olarak ele almak.
invocation:
  modes: [explicit, delegated]
interfaces:
  inputs:
    - name: bilgi-guvenligi-inceleme-istegi
      description: Hassas verisi dışlanmış veya arındırılmış sınırlanmış değişiklik.
      required: true
      classification: internal
      contract: schema:review-request
  outputs:
    - name: bilgi-guvenligi-bulgulari
      description: Konum, kontrol, algılayıcı ve belirsizlik içeren arındırılmış bulgular.
      required: true
      classification: internal
      contract: schema:governance-assessment-report-v1-2
requirements:
  inference_profile_ref: inference-profile:review-fast-low
  policies:
    - ref: policy:bilgi-guvenligi
      required: true
  rules:
    - ref: rule:02-iletisim-tarzi
      required: true
    - ref: rule:10-once-spesifikasyon
      required: true
    - ref: rule:40-test
      required: true
  skills: []
  commands: []
  model_capabilities: [reasoning, structured-output, tool-calling]
  tools:
    - capability: tool:workspace-read
      required: true
      access: read
      approval: never
  mcp: []
  hook_intents:
    - id: before-tool-policy
      required: true
    - id: after-tool-audit
      required: true
    - id: after-completion-evidence
      required: true
permissions:
  workspace:
    read: ["**"]
    write: []
    deny: [".env*", "**/.env*", "**/secrets/**"]
  network:
    mode: denied
    registry_refs: []
  secrets:
    mode: none
    registry_refs: []
  external_side_effects: prohibited
delegation:
  allowed: false
  max_depth: 0
  max_parallel: 1
  allowed_agents: []
  context_sharing: minimal
runtime:
  sandbox_required: true
  workspace_access: read-only
  identity: task-scoped
  budgets:
    max_duration_seconds: 900
    max_tool_calls: 50
    max_external_side_effects: 0
data:
  max_classification: internal
  memory: forbidden
  retention: none
  logging: redacted
evidence:
  eval_suites: [eval:bilgi-guvenligi-soy-zinciri]
  minimum_tier: L1
  tool_log_required: true
  claims: [instruction-discovery, policy-compliance, tool-use, side-effect-control, result-quality]
  approval_policy:
    registry_ref: approval-policy:bilgi-guvenligi
    minimum_approvers: 0
    separation_of_duties: false
  human_approval_for: []
