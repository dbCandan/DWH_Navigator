schema_version: "1.0"
kind: AgentContract
metadata:
  id: devops
  version: 1.6.0
  display_name: Platform Operasyonları
  description: Konteyner, CI/CD ve dağıtım yapılandırmasını yönetilen hijyen ve güvenlik riskleri açısından inceler.
  owner: team:platform-engineering
  lifecycle: draft
  risk_tier: R1
mission:
  instructions_ref: instructions.md
  objective: Yapıt oluşturma, yayımlama veya dağıtma işlemi yapmadan kanıt destekli teslim yapılandırması bulguları döndür.
  responsibilities:
    - Konteyner imajı, kimlik, gizli bilgi, ağ erişimi ve veritabanı ayrıcalığı beyanlarını incele.
    - Bulguları kesin yapılandırma konumlarına ve kaynak kontrollere izle.
    - Statik incelemeyi canlı platform ve dağıtım kanıtından ayır.
  non_responsibilities:
    - Konteyner imajı oluşturmak veya yayımlamak, işlem hattını değiştirmek ya da iş yükü dağıtmak.
    - Yalnız yapılandırma metninden çalışma zamanı erişimi veya ayrıcalık iddia etmek.
    - Teslimi başarılı kılmak için TLS, kabul veya güvenlik kontrollerini devre dışı bırakmak.
invocation:
  modes: [explicit, delegated]
interfaces:
  inputs:
    - name: delivery-review-request
      description: Sınırlanmış konteyner, işlem hattı ve dağıtım yapılandırması kümesi.
      required: true
      classification: internal
      contract: schema:review-request
  outputs:
    - name: delivery-findings
      description: Yapılandırma kanıtı ve doğrulama boşlukları içeren teslim bulguları.
      required: true
      classification: internal
      contract: schema:governance-assessment-report-v1-2
requirements:
  inference_profile_ref: inference-profile:review-fast-low
  policies:
    - ref: policy:devops
      required: true
  rules:
    - ref: rule:02-iletisim-tarzi
      required: true
    - ref: rule:10-once-spesifikasyon
      required: true
    - ref: rule:40-test
      required: true
  skills: []
  commands: []
  model_capabilities: [reasoning, structured-output, tool-calling]
  tools:
    - capability: tool:workspace-read
      required: true
      access: read
      approval: never
  mcp: []
  hook_intents:
    - id: before-tool-policy
      required: true
    - id: after-tool-audit
      required: true
    - id: after-completion-evidence
      required: true
permissions:
  workspace:
    read: ["**"]
    write: []
    deny: [".env*", "**/.env*", "**/secrets/**"]
  network:
    mode: denied
    registry_refs: []
  secrets:
    mode: none
    registry_refs: []
  external_side_effects: prohibited
delegation:
  allowed: false
  max_depth: 0
  max_parallel: 1
  allowed_agents: []
  context_sharing: minimal
runtime:
  sandbox_required: true
  workspace_access: read-only
  identity: task-scoped
  budgets:
    max_duration_seconds: 900
    max_tool_calls: 50
    max_external_side_effects: 0
data:
  max_classification: internal
  memory: forbidden
  retention: none
  logging: redacted
evidence:
  eval_suites: [eval:devops-lineage]
  minimum_tier: L1
  tool_log_required: true
  claims: [instruction-discovery, policy-compliance, tool-use, side-effect-control, result-quality]
  approval_policy:
    registry_ref: approval-policy:devops
    minimum_approvers: 0
    separation_of_duties: false
  human_approval_for: []
