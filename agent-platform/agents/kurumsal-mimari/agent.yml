schema_version: "1.0"
kind: AgentContract
metadata:
  id: kurumsal-mimari
  version: 1.7.0
  display_name: Kurumsal Mimari
  description: Dil, çatı, sürüm ve bağımlılık seçimlerini yetkin mimari politikasına göre değerlendirir.
  owner: team:enterprise-architecture
  lifecycle: draft
  risk_tier: R1
mission:
  instructions_ref: instructions.md
  objective: Teknoloji seçimlerini veya proje dosyalarını değiştirmeden izlenebilir mimari uyumluluk değerlendirmesi döndür.
  responsibilities:
    - Onaylı ve izin verilmeyen çatıları, dil hedeflerini, içe aktarmaları ve yapısal kısıtları değerlendir.
    - İzin verilen sürüm, tercih edilen hedef ve kaynak çelişkisi ayrımlarını koru.
    - Proje düzeyi kanıt boşluklarını dosya düzeyi gözlemlerden ayrı bildir.
  non_responsibilities:
    - Bağımlılıkları, paketleme üst verisini veya mimari kararlarını yeniden yazmak.
    - Mimari politika ile OSS izin listesi arasındaki çelişkileri sessizce çözmek.
    - Sınırlanmış depo taramasından kurum çapında uygunluk iddia etmek.
invocation:
  modes: [explicit, delegated]
interfaces:
  inputs:
    - name: architecture-review-request
      description: Sınırlanmış proje değişikliği ile ilgili bağımlılık ve çalışma zamanı beyanları.
      required: true
      classification: internal
      contract: schema:review-request
  outputs:
    - name: architecture-findings
      description: Politika köken zinciri, çelişkiler ve kanıt boşlukları içeren mimari bulgular.
      required: true
      classification: internal
      contract: schema:governance-assessment-report-v1-2
requirements:
  inference_profile_ref: inference-profile:review-fast-low
  policies:
    - ref: policy:kurumsal-mimari
      required: true
  rules:
    - ref: rule:02-iletisim-tarzi
      required: true
    - ref: rule:10-once-spesifikasyon
      required: true
    - ref: rule:40-test
      required: true
  skills: []
  commands: []
  model_capabilities: [reasoning, structured-output, tool-calling]
  tools:
    - capability: tool:workspace-read
      required: true
      access: read
      approval: never
  mcp: []
  hook_intents:
    - id: before-tool-policy
      required: true
    - id: after-tool-audit
      required: true
    - id: after-completion-evidence
      required: true
permissions:
  workspace:
    read: ["**"]
    write: []
    deny: [".env*", "**/.env*", "**/secrets/**"]
  network:
    mode: denied
    registry_refs: []
  secrets:
    mode: none
    registry_refs: []
  external_side_effects: prohibited
delegation:
  allowed: false
  max_depth: 0
  max_parallel: 1
  allowed_agents: []
  context_sharing: minimal
runtime:
  sandbox_required: true
  workspace_access: read-only
  identity: task-scoped
  budgets:
    max_duration_seconds: 900
    max_tool_calls: 50
    max_external_side_effects: 0
data:
  max_classification: internal
  memory: forbidden
  retention: none
  logging: redacted
evidence:
  eval_suites: [eval:kurumsal-mimari-soy-zinciri]
  minimum_tier: L1
  tool_log_required: true
  claims: [instruction-discovery, policy-compliance, tool-use, side-effect-control, result-quality]
  approval_policy:
    registry_ref: approval-policy:kurumsal-mimari
    minimum_approvers: 0
    separation_of_duties: false
  human_approval_for: []
