schema_version: "1.0"
kind: AgentContract
metadata:
  id: gizlilik-kvkk
  version: 1.6.0
  display_name: Mahremiyet ve KVKK
  description: Kaynak düzeyi kişisel ve finansal veri gözlemlerini yetkin mahremiyet gereksinimleri altında değerlendirir.
  owner: team:data-protection
  lifecycle: draft
  risk_tier: R2
mission:
  instructions_ref: instructions.md
  objective: Hukuki duruma karar vermeden veya tespit edilen değerleri açığa çıkarmadan en aza indirilmiş, arındırılmış mahremiyet bulguları döndür.
  responsibilities:
    - Kaynakta belirtilen kişisel, finansal, iletişim, özel nitelikli ve günlükleme gözlemlerini belirle.
    - Sağlama toplamı yardımcılarını yalnız yanlış pozitif adaylarını azaltmak için kullan.
    - Kaynak denetimi köken zincirini ve belirsizliği korurken kanıtı en aza indir ve arındır.
  non_responsibilities:
    - Tespit edilen tanımlayıcıları yinelemek veya bir kişinin kimliğini çıkarsamak.
    - TCKN, Luhn veya düzenli ifade geçerliliğinin özgünlük ya da hukuki sınıflandırma kanıtladığını iddia etmek.
    - Bağlayıcı hukuki, düzenleyici veya üretim kabulü kararı vermek.
invocation:
  modes: [explicit, delegated]
interfaces:
  inputs:
    - name: privacy-review-request
      description: Kısıtlı değerleri dışlanmış, veri minimizasyonlu sınırlanmış değişiklik.
      required: true
      classification: internal
      contract: schema:review-request
  outputs:
    - name: privacy-findings
      description: Arındırılmış gözlemler, yardımcı doğrulama sonuçları ve gerekli insan incelemesi.
      required: true
      classification: internal
      contract: schema:governance-assessment-report-v1-2
requirements:
  inference_profile_ref: inference-profile:review-fast-low
  policies:
    - ref: policy:gizlilik-kvkk
      required: true
  rules:
    - ref: rule:02-iletisim-tarzi
      required: true
    - ref: rule:10-once-spesifikasyon
      required: true
    - ref: rule:40-test
      required: true
  skills: []
  commands: []
  model_capabilities: [reasoning, structured-output, tool-calling]
  tools:
    - capability: tool:workspace-read
      required: true
      access: read
      approval: never
  mcp: []
  hook_intents:
    - id: before-tool-policy
      required: true
    - id: after-tool-audit
      required: true
    - id: after-completion-evidence
      required: true
permissions:
  workspace:
    read: ["**"]
    write: []
    deny: [".env*", "**/.env*", "**/secrets/**"]
  network:
    mode: denied
    registry_refs: []
  secrets:
    mode: none
    registry_refs: []
  external_side_effects: prohibited
delegation:
  allowed: false
  max_depth: 0
  max_parallel: 1
  allowed_agents: []
  context_sharing: minimal
runtime:
  sandbox_required: true
  workspace_access: read-only
  identity: task-scoped
  budgets:
    max_duration_seconds: 900
    max_tool_calls: 50
    max_external_side_effects: 0
data:
  max_classification: internal
  memory: forbidden
  retention: none
  logging: redacted
evidence:
  eval_suites: [eval:gizlilik-kvkk-soy-zinciri]
  minimum_tier: L2
  tool_log_required: true
  claims: [instruction-discovery, policy-compliance, tool-use, side-effect-control, result-quality]
  approval_policy:
    registry_ref: approval-policy:gizlilik-kvkk
    minimum_approvers: 1
    separation_of_duties: false
  human_approval_for: [regulated-decision]
