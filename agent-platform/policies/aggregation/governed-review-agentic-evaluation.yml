schema_version: "1.0"
kind: AgenticEvaluationPolicy
metadata:
  id: policy:governed-review-agentic-evaluation
  version: 2.0.0
  owner: team:ai-governance
  lifecycle: draft
  evaluator_id: evaluator:governed-review-agentic-phase1

# Faz 1 bu değerlerin hiçbirini kopyalamaz veya bellekten üretmez. Her review, güncel dosyanın
# version ve SHA-256 özetini bağlar; `governance_client.py finalize-review` aşağıdaki alanları
# doğrudan o dosyadan okuyup uygular. Bulguları on iki uzman LLM sınıflandırır.
aggregation_source:
  policy_ref: policy:governed-review-aggregation
  policy_version: 1.5.0
  policy_sha256: 7e17ae795f050b4345b3b4074b3a6dab0626d612a37bdf2ccebe8987482f4ccb
  path: policies/aggregation/governed-review.yml
  required_fields:
    - required_agents
    - weights
    - finding_classification.severity_bands
    - thresholds
    - fail_closed
    - security_critical_veto
    - decision_precedence
    - warning_disposition
    - hard_fail_authority
    - hard_fail_non_override
  copy_values: false

mandatory_governed_execution:
  protocol_id: protocol:mandatory-governed-execution-phase1
  version: 1.3.0
  stage_order:
    - exact-snapshot
    - twelve-agent-observations
    - agentic-policy-evaluation
    - decision-evidence-assembly
    - independent-second-pass-validation
    - decision
    - snapshot-bound-receipt
    - review-audit
    - current-receipt-publication
    - same-snapshot-action-retry
  required_observation_count: 12
  missing_or_stale_result: BLOCKED_INCOMPLETE

evaluation:
  mode: code-policy-application
  authority: agentic-advisory
  severity_score_source: finding_classification.severity_bands[].detector_score_basis_points
  per_agent_reduction: maximum-finding-score
  weighted_score_algorithm: normalized-weighted-mean
  weight_scale_micros: 1000000
  weighted_score_rounding: (weighted_sum + total_weight // 2) // total_weight
  threshold_source: thresholds.fail_score-and-warning_score
  threshold_percent_to_basis_points_multiplier: 100
  compliance_score_formula: max(0, compliance_baseline * 100 - weighted_risk_score_basis_points)
  reason_code_map:
    pass: AGG_THRESHOLD_PASS
    warning: AGG_THRESHOLD_WARNING
    fail: AGG_THRESHOLD_FAIL
    hard_fail: AGG_HARD_FAIL
    security_critical_veto: AGG_SECURITY_CRITICAL_VETO
    classification_incomplete: AGG_FINDING_CLASSIFICATION_INVALID
  completeness_requirements:
    observation_status: ok
    observation_fields:
      - component_binding
      - agentic_evaluator
      - snapshot_sha256
      - invocation_id
      - span_id
    finding_fields:
      - controls
      - classification_basis
      - severity
      - source
      - locations
      - evidence_summary
      - confidence
      - hard_fail_binding
    on_missing_or_ambiguous: BLOCKED_INCOMPLETE
  hard_fail:
    authority_source: hard_fail_authority-and-hard_fail_non_override
    binding_required: canonical-detector-policy-and-evidence
    evidence_canonicalization: kt-agentic-hard-fail-evidence-json-v1
    evidence_fields:
      - snapshot_sha256
      - agent_id
      - finding_id
      - detector_id
      - controls
      - locations
      - detector_pack_sha256
      - policy_sha256
    evidence_encoding: sorted-minified-utf8-single-lf
    free_llm_severity_authoritative: false

evidence_bound_replay:
  audit_replay:
    requirement: mandatory
    canonicalization: kt-agentic-decision-evidence-json-v1
    required_bindings:
      - canonical-input
      - exact-snapshot
      - authority
      - orchestration
      - aggregation-policy
      - agentic-evaluator
      - mandatory-governed-execution-harness
      - canonical-rule
      - selected-client-skill
      - twelve-agent-component-manifest
      - client
      - prompt-template
      - redacted-prompt-envelope
      - context-manifest
      - retrieval-manifest
      - tool-result-manifest
      - primary-evaluation
      - second-pass-validator
    manifest_states:
      - available
      - not-used
      - unavailable
    stale_if_changed:
      - canonical-input
      - exact-snapshot
      - authority
      - aggregation-policy
      - agentic-evaluator
      - harness
      - rule
      - skill
      - agent-component-manifest
      - client
      - prompt-template
      - prompt-envelope
      - context-manifest
      - retrieval-manifest
      - tool-result-manifest
    missing_or_mismatch_result: BLOCKED_INCOMPLETE
    digest_recipes:
      canonical_input:
        canonicalization: kt-agentic-review-input-manifest-json-v1
        item_count: 1
        sha256_source: exact-snapshot.snapshot_sha256
      prompt_envelope:
        canonicalization: kt-agentic-redacted-prompt-envelope-json-v1
        version: 1.0.0
        source: exact-clean-prompt-ingress-receipt
        payload_fields:
          - kind
          - version
          - source_event_id
          - source_prompt_turn_id
          - source_receipt_sha256
          - prompt_capture_sha256
          - raw_content_stored
        field_sources:
          source_event_id: PromptIngressReceipt.event_id
          source_prompt_turn_id: PromptIngressReceipt.prompt_turn_id
          source_receipt_sha256: sha256(exact-receipt-file-bytes)
          prompt_capture_sha256: PromptIngressReceipt.prompt_capture.sha256
        encoding: sorted-minified-utf8-single-lf
      supplemental_manifests:
        scope: supplemental-context-retrieval-and-tool-results-only
        governed_inputs_bound_elsewhere: true
        verified_phase1_state: not-used
        empty_payload_fields:
          - canonicalization
          - items
        empty_items: []
        encoding: sorted-minified-utf8-single-lf
        used_or_unobservable_result: BLOCKED_INCOMPLETE
  model_rerun:
    requirement: best-effort
    exact_output_guaranteed: false
    unknown_metadata: explicit-unavailable-never-invent
    optional_metadata_unavailable_blocks_audit_replay: false
    full_content_location: future-controlled-time-bounded-evidence-vault-reference-only
  second_pass_validation:
    method: independent-second-pass-policy-recalculation
    distinct_invocation_and_span: true
    checked_digest_set_required: true
    recalculated_outcome_required: true
    mechanical_provenance: commit-guard-policy-recalculation
    self_attestation_sufficient_for_external_independence: false
    external_independence_proven: false
  data_handling:
    general_audit_content: digest-and-redacted-metadata-only
    full_content_reference: evidence-vault-reference-or-unavailable

native_gate_validation:
  applicability: supported-native-direct-commit-retry
  success_condition: all-required-checks-completed
  failure_result: BLOCKED_INCOMPLETE
  required_failure_classes:
    - tool-unavailable
    - permission-denied
    - tool-error
    - truncated-output
    - unreadable-artifact
    - parse-error
    - schema-error
    - canonicalization-error
    - digest-mismatch
    - snapshot-mismatch
    - recalculation-mismatch
    - stale-or-missing-evidence
  harness_boundary:
    mode: dependency-free-evidence-integrity-command-hook
    installed_runtime_required: true
    agent_invocation: false
    semantic_decision: false
    finding_scoring: false
    evidence_creation_or_repair: false
    claim: conditional-native-guard
  reuse_payload:
    canonicalization: kt-agentic-review-reuse-json-v3
    exact_full_object_required: true
    reduced_object_allowed: false
  timestamp_provenance:
    source: client-observed-utc-clock
    synthetic_values_allowed: false
    future_values_allowed: false
    chronology_required: true
    failure_result: BLOCKED_INCOMPLETE

finalization:
  command: governance-client-finalize-review
  sequence:
    - reports-complete
    - code-policy-application
    - independent-policy-recalculation
    - decision-evidence-assembly
    - decision-and-receipt-write
    - protected-audit-verification
    - idempotent-protected-audit-append
    - atomic-current-receipt-publication
    - same-snapshot-commit-retry
  exact_retry_behavior: return-original-ack
  changed_retry_behavior: reject-record-exists
  audit_event_derivation: bound-artifact-publication-chronology
  user_confirmation_required: false
  new_agent_invocation: false
  performance_target_p95_ms: 10000
  performance_target_is_current_proof: false

claim_boundary:
  deterministic: false
  canonical_conformance: false
  runtime_admission: false
  production_authority: false
