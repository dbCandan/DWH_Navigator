schema_version: "1.0"
kind: DeterministicDecisionExplanationTemplateCatalog
catalog_id: policy:governed-review-decision-explanations
catalog_version: 1.0.0
locale: tr
claim_boundary:
  evidence_tier: L1
  deterministic_contract: true
  runtime_admission: false
  production_decision: false
templates:
  PASS:
    AGG_THRESHOLD_PASS:
      template_id: decision-explanation:threshold-pass
      template_version: 1.0.0
      text: "Karar {decision}: toplam risk puanı uyarı ve başarısızlık eşiklerinin altındadır. Gerekçe: {reason_code}."
    AGG_THRESHOLD_WARNING:
      template_id: decision-explanation:threshold-warning
      template_version: 1.0.0
      text: "Karar {decision}: toplam risk puanı uyarı eşiğine ulaşmış, başarısızlık eşiğinin altında kalmıştır. Gerekçe: {reason_code}."
  HARD-FAIL:
    AGG_HARD_FAIL:
      template_id: decision-explanation:hard-fail
      template_version: 1.0.0
      text: "Karar {decision}: yetkili politika ile doğrulanmış kesin başarısızlık bulgusu vardır. Gerekçe: {reason_code}."
  FAIL:
    AGG_THRESHOLD_FAIL:
      template_id: decision-explanation:threshold-fail
      template_version: 1.0.0
      text: "Karar {decision}: toplam risk puanı başarısızlık eşiğine ulaşmıştır. Gerekçe: {reason_code}."
    AGG_SECURITY_CRITICAL_VETO:
      template_id: decision-explanation:security-critical-veto
      template_version: 1.0.0
      text: "Karar {decision}: bilgi güvenliği, uygulama güvenliği veya KVKK ajanı güven tabanını geçen kritik bulgu bildirdi; toplam risk puanından bağımsız olarak başarısızdır. Gerekçe: {reason_code}."
  BLOCKED_INCOMPLETE:
    AGG_MISSING_AGENT:
      template_id: decision-explanation:missing-agent
      template_version: 1.0.0
      text: "Karar {decision}: zorunlu bir ajan raporu bulunamadı. Gerekçe: {reason_code}."
    AGG_DUPLICATE_AGENT:
      template_id: decision-explanation:duplicate-agent
      template_version: 1.0.0
      text: "Karar {decision}: aynı zorunlu ajan için birden fazla rapor sağlandı. Gerekçe: {reason_code}."
    AGG_INVALID_SCHEMA:
      template_id: decision-explanation:invalid-schema
      template_version: 1.0.0
      text: "Karar {decision}: en az bir ajan raporu sözleşme doğrulamasını geçemedi. Gerekçe: {reason_code}."
    AGG_RAW_SOURCE_REJECTED:
      template_id: decision-explanation:raw-source-rejected
      template_version: 1.0.0
      text: "Karar {decision}: ham kaynak içeriği karar motoruna verildiği için girdi reddedildi. Gerekçe: {reason_code}."
    AGG_INTEGRITY_FAILURE:
      template_id: decision-explanation:integrity-failure
      template_version: 1.0.0
      text: "Karar {decision}: rapor bütünlüğü doğrulanamadı. Gerekçe: {reason_code}."
    AGG_REQUEST_DIGEST_MISMATCH:
      template_id: decision-explanation:request-digest-mismatch
      template_version: 1.0.0
      text: "Karar {decision}: raporun istek özeti beklenen istekle eşleşmedi. Gerekçe: {reason_code}."
    AGG_AGENT_FAILED:
      template_id: decision-explanation:agent-failed
      template_version: 1.0.0
      text: "Karar {decision}: zorunlu bir ajan çalıştırması başarısız oldu. Gerekçe: {reason_code}."
    AGG_TIMEOUT:
      template_id: decision-explanation:timeout
      template_version: 1.0.0
      text: "Karar {decision}: zorunlu bir ajan çalıştırması zaman aşımına uğradı. Gerekçe: {reason_code}."
    AGG_LOW_CONFIDENCE:
      template_id: decision-explanation:low-confidence
      template_version: 1.0.0
      text: "Karar {decision}: en az bir zorunlu raporun güven değeri politika tabanının altındadır. Gerekçe: {reason_code}."
    AGG_PROHIBITED_AGENT:
      template_id: decision-explanation:prohibited-agent
      template_version: 1.0.0
      text: "Karar {decision}: yasaklanmış bir ajan raporu karar girdisine katıldı. Gerekçe: {reason_code}."
    AGG_UNEXPECTED_AGENT:
      template_id: decision-explanation:unexpected-agent
      template_version: 1.0.0
      text: "Karar {decision}: politika envanterinde bulunmayan bir ajan raporu sağlandı. Gerekçe: {reason_code}."
    AGG_UNKNOWN_POLICY_VERSION:
      template_id: decision-explanation:unknown-policy-version
      template_version: 1.0.0
      text: "Karar {decision}: desteklenmeyen bir politika veya orkestrasyon sürümü kullanıldı. Gerekçe: {reason_code}."
    AGG_AUTHORITATIVE_CONFLICT:
      template_id: decision-explanation:authoritative-conflict
      template_version: 1.0.0
      text: "Karar {decision}: yetkili yönetişim kaynakları arasında çözümlenmemiş çelişki vardır. Gerekçe: {reason_code}."
    AGG_DETECTOR_EVIDENCE_INVALID:
      template_id: decision-explanation:detector-evidence-invalid
      template_version: 1.0.0
      text: "Karar {decision}: algılayıcı kanıtı yetkili karar üstverisiyle doğrulanamadı. Gerekçe: {reason_code}."
    AGG_FINDING_CLASSIFICATION_INVALID:
      template_id: decision-explanation:finding-classification-invalid
      template_version: 1.0.0
      text: "Karar {decision}: bulgunun önem derecesi veya risk puanı sürümlü sınıflandırma politikasıyla doğrulanamadı. Gerekçe: {reason_code}."
    AGG_REQUIRED_HUMAN_EVIDENCE_MISSING:
      template_id: decision-explanation:required-human-evidence-missing
      template_version: 1.0.0
      text: "Karar {decision}: zorunlu insan onayı kanıtı bulunamadı. Gerekçe: {reason_code}."
    AGG_REQUIRED_ADMISSION_EVIDENCE_MISSING:
      template_id: decision-explanation:required-admission-evidence-missing
      template_version: 1.0.0
      text: "Karar {decision}: zorunlu çalışma zamanı kabul kanıtı bulunamadı. Gerekçe: {reason_code}."
    AGG_TRACE_CONTEXT_INVALID:
      template_id: decision-explanation:trace-context-invalid
      template_version: 1.0.0
      text: "Karar {decision}: ortak run, trace, benzersiz span veya kök parent bağı geçersizdir. Gerekçe: {reason_code}."
    AGG_RUN_EVIDENCE_INCOMPLETE:
      template_id: decision-explanation:run-evidence-incomplete
      template_version: 1.0.0
      text: "Karar {decision}: zorunlu çalışma kanıtı eksik, başarısız veya bütünlük doğrulamasını geçemedi. Gerekçe: {reason_code}."
