  owner: team:ai-governance
  lifecycle: draft
lineage:
  source_role: governance-source:desktop-agents/supervisor
  source_artifacts:
    - id: governance-source:supervisor:instructions
      sha256: eb3b4386d0c69699274ac0b95012f77f2c8c9e98b96d6d7d7ca9b574903ac16d
    - id: governance-source:supervisor:aggregation-policy
      sha256: 71bce6a470f23b0817406b53717db2a9ec66fad7dfe3f45b5f83be17d998b39b
  source_artifact_ref: governance-source:supervisor:aggregation-policy
  source_locator: governance-source:desktop-agents/supervisor/aggregation_policy.yaml
  source_artifact_sha256: 71bce6a470f23b0817406b53717db2a9ec66fad7dfe3f45b5f83be17d998b39b
  source_version: 1.0.0
  source_authority: governance-authoritative
  implementation_status: implemented
  calibration_status: uncalibrated
  runtime_admission: not-admitted

instructions_ref: policies/aggregation/governed-review-instructions.md

controls:
  - id: SUPERVISOR-101
    statement: Yetkin Denetleyici talimat soy ağacı deterministik orkestrasyon sınırında izlenebilir kalmalı ve istemci ajanı olarak projekte edilmemelidir.
    enforcement: instruction
    on_failure: manual-review
    source_refs:
      - governance-source:desktop-agents/supervisor/agent.md#instruction/document
    implementation_status: implemented
    projection_status: not-projectable
    runtime_admission: not-admitted
  - id: SUPERVISOR-102
    statement: Sağlanan her Denetleyici ağırlığı, eşiği ve uyumluluk tabanı yetkin kaynakla birebir doğrulanarak deterministik uygulanmalıdır.
    enforcement: deterministic-policy
    on_failure: manual-review
    source_refs:
      - governance-source:desktop-agents/supervisor/aggregation_policy.yaml#aggregation-weight/requirements-scope
      - governance-source:desktop-agents/supervisor/aggregation_policy.yaml#aggregation-weight/enterprise-architecture
      - governance-source:desktop-agents/supervisor/aggregation_policy.yaml#aggregation-weight/code-quality
      - governance-source:desktop-agents/supervisor/aggregation_policy.yaml#aggregation-weight/code-review
      - governance-source:desktop-agents/supervisor/aggregation_policy.yaml#aggregation-weight/information-security
      - governance-source:desktop-agents/supervisor/aggregation_policy.yaml#aggregation-weight/application-security
      - governance-source:desktop-agents/supervisor/aggregation_policy.yaml#aggregation-weight/oss-license
      - governance-source:desktop-agents/supervisor/aggregation_policy.yaml#aggregation-weight/privacy-kvkk
      - governance-source:desktop-agents/supervisor/aggregation_policy.yaml#aggregation-weight/test-automation
      - governance-source:desktop-agents/supervisor/aggregation_policy.yaml#aggregation-weight/documentation
      - governance-source:desktop-agents/supervisor/aggregation_policy.yaml#aggregation-weight/devops
      - governance-source:desktop-agents/supervisor/aggregation_policy.yaml#aggregation-weight/observability
      - governance-source:desktop-agents/supervisor/aggregation_policy.yaml#aggregation-threshold/fail-score
      - governance-source:desktop-agents/supervisor/aggregation_policy.yaml#aggregation-threshold/warning-score
      - governance-source:desktop-agents/supervisor/aggregation_policy.yaml#aggregation-threshold/confidence-floor
      - governance-source:desktop-agents/supervisor/aggregation_policy.yaml#aggregation-setting/compliance-baseline
    implementation_status: implemented
    projection_status: not-projectable
    runtime_admission: not-admitted
  - id: SUPERVISOR-103
    statement: Eksik kanıt, geçersiz sonuç, kabul eksikliği veya harici insan kapısı gereksinimi yetki üretmeden BLOCKED_INCOMPLETE sonucuna yönelmelidir.
    enforcement: human-gate
    on_failure: manual-review
    source_refs:
      - governance-source:desktop-agents/supervisor/agent.md#instruction/document
    implementation_status: externally-enforced
    projection_status: not-projectable
    runtime_admission: not-admitted

claim_boundary:
  thresholds_calibrated: false
  runtime_admission: false
  production_decision: false
  note: Yetkin kaynak değerleri deterministik uygulanır; ancak kalibre edilmemiş, kabul edilmemiş ve üretim için yetkin olmayan durumda kalır.

required_agents:
  - agent:gereksinim-kapsami
  - agent:kurumsal-mimari
  - agent:kod-kalitesi
  - agent:kod-inceleme
  - agent:bilgi-guvenligi
  - agent:uygulama-guvenligi
  - agent:acik-kaynak-lisansi
  - agent:gizlilik-kvkk
  - agent:test-otomasyonu
  - agent:dokumantasyon
  - agent:devops
  - agent:gozlemlenebilirlik

weights:
  agent:gereksinim-kapsami: 0.6
  agent:kurumsal-mimari: 1.0
  agent:kod-kalitesi: 0.8
  agent:kod-inceleme: 0.8
  agent:bilgi-guvenligi: 1.4
  agent:uygulama-guvenligi: 1.4
  agent:acik-kaynak-lisansi: 1.3
  agent:gizlilik-kvkk: 1.4
  agent:test-otomasyonu: 0.6
  agent:dokumantasyon: 0.3
  agent:devops: 1.0
  agent:gozlemlenebilirlik: 0.5

finding_classification:
  schema_version: "1.0"
  authority: implementation-policy
  calibration_status: uncalibrated
  runtime_admission: not-admitted
  severity_bands:
    - severity: info
      label_tr: Bilgi
      minimum_score_basis_points: 0
      maximum_score_basis_points: 999
      detector_score_basis_points: 0
    - severity: low
      label_tr: Düşük
      minimum_score_basis_points: 1000
      maximum_score_basis_points: 2499
      detector_score_basis_points: 1000
    - severity: medium
      label_tr: Orta
      minimum_score_basis_points: 2500
      maximum_score_basis_points: 4999
      detector_score_basis_points: 2500
    - severity: high
      label_tr: Yüksek
      minimum_score_basis_points: 5000
      maximum_score_basis_points: 7499
      detector_score_basis_points: 5000
    - severity: critical
      label_tr: Kritik
      minimum_score_basis_points: 7500
      maximum_score_basis_points: 10000
      detector_score_basis_points: 7500
  # Bu sürümde exact finding/report/control/policy bağına sahip, dışarıdan çözülebilen ve kabul
  # edilmiş bir anlamsal değerlendirme yapıtı yoktur. Rapor içi evaluator kimliği/özet öz beyanı
  # puan otoritesi değildir; böyle bulgular BLOCKED_INCOMPLETE sonucuna kapanır.
  semantic_evaluators: []
  unclassified_result: BLOCKED_INCOMPLETE
  mismatch_result: BLOCKED_INCOMPLETE

thresholds:
  fail_score: 60
  warning_score: 25
  confidence_floor: 0.55
  compliance_baseline: 100

fail_closed:
  missing_agent: BLOCKED_INCOMPLETE
  duplicate_agent: BLOCKED_INCOMPLETE
  agent_failed: BLOCKED_INCOMPLETE
  timeout: BLOCKED_INCOMPLETE
  invalid_schema: BLOCKED_INCOMPLETE
  raw_source_rejected: BLOCKED_INCOMPLETE
  integrity_failure: BLOCKED_INCOMPLETE
  request_digest_mismatch: BLOCKED_INCOMPLETE
  low_confidence: BLOCKED_INCOMPLETE
  prohibited_agent: BLOCKED_INCOMPLETE
  unexpected_agent: BLOCKED_INCOMPLETE
  unknown_policy_version: BLOCKED_INCOMPLETE
  authoritative_conflict: BLOCKED_INCOMPLETE
  detector_evidence_invalid: BLOCKED_INCOMPLETE
  finding_classification_invalid: BLOCKED_INCOMPLETE
  required_human_evidence_missing: BLOCKED_INCOMPLETE
  required_admission_evidence_missing: BLOCKED_INCOMPLETE

# Kaynak Denetleyici politikası önem vetosu tanımlamaz; bu blok proje sahibinin 2026-09-21 kararıyla
# eklenen uygulama politikasıdır. Güvenlik ajanlarının güven tabanını geçen kritik bulgusu, ağırlıklı
# skor eşiğin altında kalsa bile kararı FAIL yapar. Ağırlık ve eşikler kaynakla birebir kalır.
security_critical_veto:
  schema_version: "1.0"
  authority: implementation-policy
  covered_agents:
    - agent:bilgi-guvenligi
    - agent:uygulama-guvenligi
    - agent:gizlilik-kvkk
  minimum_severity: critical
  confidence_source: thresholds.confidence_floor
  decision: FAIL
  reason_code: AGG_SECURITY_CRITICAL_VETO

decision_precedence: [BLOCKED_INCOMPLETE, HARD-FAIL, FAIL, PASS]
warning_disposition: PASS_WITH_ADVISORY_REASON
hard_fail_authority: canonical-detector-source-policy-and-evidence
hard_fail_non_override:
  schema_version: "1.0"
  non_overridable_decisions: [HARD-FAIL]
  covered_agent_namespaces:
    - agent:bilgi-guvenligi
    - agent:uygulama-guvenligi
    - agent:gizlilik-kvkk
  covered_detector_namespaces:
    - detector:bilgi-guvenligi/
    - detector:uygulama-guvenligi/
    - detector:gizlilik-kvkk/
  allowed_resolution: remediate-and-rerun
  decision_override_changes_decision: false
  prompt_or_instruction_changes_decision: false
  human_approval_changes_decision: false
  risk_acceptance_changes_decision: false
  score_or_weight_changes_decision: false

decisions: [PASS, HARD-FAIL, FAIL, BLOCKED_INCOMPLETE]
