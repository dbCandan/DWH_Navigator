schema_version: "1.0"
kind: InferenceProfileCatalog
profiles:
  - id: inference-profile:review-fast-low
    purpose: governed-review-specialist
    bindings:
      claude-code:
        model_class: smallest-capable
        model: haiku
        model_disposition: native
        effort: low
        effort_disposition: native
        limitation: null
      codex:
        model_class: smallest-capable
        model: gpt-5.6-luna
        model_disposition: native
        effort: low
        effort_disposition: native
        limitation: null
      cursor:
        model_class: smallest-capable
        model: null
        model_disposition: external-control
        effort: null
        effort_disposition: external-control
        limitation: >-
          Cursor'ın proje ajan dosyası için taşınabilir en küçük-model veya effort alanı
          doğrulanmadı; etkin model ve düşünme kipi istemci çalışma zamanında seçilir.
      github-copilot-vscode:
        model_class: smallest-capable
        model: Claude Haiku 4.5 (copilot)
        model_disposition: native
        effort: null
        effort_disposition: external-control
        limitation: >-
          VS Code özel ajanı modeli sabitleyebilir; effort düzeyi model seçicisindeki oturum
          ayarıdır ve ajan dosyasında taşınabilir bir alan olarak doğrulanmadı.
  - id: inference-profile:otomatik-duzeltme
    purpose: automated-fix
    bindings:
      claude-code: &inherit_binding
        model_class: inherited
        model: null
        model_disposition: external-control
        effort: null
        effort_disposition: external-control
        limitation: Otomatik Düzeltme governed-review uzman kümesinde değildir; etkin profil devralınır.
      codex: *inherit_binding
      cursor: *inherit_binding
      github-copilot-vscode: *inherit_binding
