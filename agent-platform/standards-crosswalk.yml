schema_version: "1.0"
kind: AgentPlatformStandardsCrosswalk
as_of: "2026-08-18"
status: design-mapping

claim_boundary:
  certification_claimed: false
  conformance_claimed: false
  mapping_completeness: partial
  statement: >-
    Bu Taslak, kamuya açık çerçeve dayanaklarını önerilen Ajan Platformu gereksinimleri,
    uygulatım noktaları, kanıtlar ve sorumlu rollerle eşler. Tam normatif kontrol değerlendirmesi,
    belgelendirme, denetim görüşü veya SLSA düzeyi iddiası değildir. ISO madde düzeyindeki
    bütünlük, lisanslı standart metnine göre sınırlı inceleme gerektirir.

entries:
  - id: aims-management-system
    authority:
      name: ISO/IEC 42001:2023
      url: https://www.iso.org/standard/42001
      version: "2023"
      nature: Yönetim sistemi gereksinimleri
      control_refs:
        - clauses 4-10 management-system lifecycle
      mapping_completeness: partial-pending-licensed-text-review
    requirement_ids:
      - Requirement 12
      - Requirement 15
      - Requirement 16
    enforcement_points:
      - Kurum AI yönetim sistemi ve sorumlu sahiplik
      - Harici risk katmanı kabulü ve süre sınırlı istisna iş akışı
      - Yönetim incelemesi, olay ele alma ve kullanımdan kaldırma
    evidence:
      - Sınırlı AI kullanım senaryosu, model, ajan, araç, MCP ve tedarikçi envanteri
      - Sorumlu sahip ve RACI
      - Risk ele alma, istisna, olay ve yönetim incelemesi kayıtları
    accountable_role: platform-governance-owner
    implementation_status: proposed
    assessment_status: not_assessed

  - id: ai-risk-and-impact
    authority:
      name: ISO/IEC 23894:2023 and ISO/IEC 42005:2025
      url: https://www.iso.org/standard/77304.html
      supplemental_url: https://www.iso.org/standard/42005?browse=ics
      version: "2023/2025"
      nature: AI riski ve yaşam döngüsü etki değerlendirmesi rehberliği
      control_refs:
        - AI risk-management process guidance
        - lifecycle AI impact-assessment guidance
      mapping_completeness: partial-pending-licensed-text-review
    requirement_ids:
      - Requirement 12
      - Requirement 14
      - Requirement 15
      - Requirement 16
    enforcement_points:
      - En yüksek tetiklenen risk katmanı ve yasak kullanım kararı
      - R2/R3 etki, mahremiyet, tehdit ve tedarikçi değerlendirmesi
      - Artık risk sahipliği ve dönemsel yeniden doğrulama
    evidence:
      - Etkilenen taraflar ve veri sınıflarıyla amaçlanan ve yasak kullanım
      - Ele alma sorumlusu ve son tarih içeren etki ve tehdit değerlendirmeleri
      - Geçerlilik sonu içeren artık risk ve kabul kararı
    accountable_role: ai-risk-owner
    implementation_status: proposed
    assessment_status: not_assessed

  - id: nist-ai-risk
    authority:
      name: NIST AI RMF 1.0 and NIST AI 600-1 Generative AI Profile
      url: https://www.nist.gov/itl/ai-risk-management-framework
      supplemental_url: https://doi.org/10.6028/NIST.AI.600-1
      version: "1.0/1.0"
      nature: Gönüllü AI risk yönetimi çerçevesi ve GenAI profili
      control_refs:
        - GOVERN
        - MAP
        - MEASURE
        - MANAGE
      mapping_completeness: framework-function
    requirement_ids:
      - Requirement 5
      - Requirement 12
      - Requirement 14
      - Requirement 15
      - Requirement 16
    enforcement_points:
      - Yönetişim envanteri, sorumluluk ve risk iştahı
      - Risk katmanına göre bağlam ve etki eşlemesi
      - Uygunluk, hasımlı değerlendirme ve çalışma zamanı izleme
      - Kabul, ele alma, olay, geri alma ve kullanımdan kaldırma
    evidence:
      - Sürümlenmiş risk kaydı ve kullanım senaryosu bağlamı
      - Değerlendirme veri kümesi, saldırı izi, sonuç ve atlanan kontrol
      - Çalışma zamanı alarmı, olay tatbikatı ve artık risk kararı
    accountable_role: ai-risk-owner
    implementation_status: proposed
    assessment_status: not_assessed

  - id: secure-software-development
    authority:
      name: NIST SP 800-218 SSDF 1.1 and NIST SP 800-218A
      url: https://csrc.nist.gov/pubs/sp/800/218/final
      supplemental_url: https://csrc.nist.gov/pubs/sp/800/218/a/final
      version: "1.1/final"
      nature: Güvenli yazılım geliştirme pratikleri ve AI model profili
      control_refs:
        - PO Prepare the Organization
        - PS Protect the Software
        - PW Produce Well-Secured Software
        - RV Respond to Vulnerabilities
      mapping_completeness: practice-group
    requirement_ids:
      - Requirement 4
      - Requirement 9
      - Requirement 10
      - Requirement 11
      - Requirement 15
    enforcement_points:
      - Korumalı kaynak, eş incelemesi ve harici zorunlu denetimler
      - Yalıtılmış deterministik bağdaştırıcı derlemesi ve bağımlılık kabulü
      - SAST, SCA, gizli bilgi, IaC, konteyner ve olumsuz politika testleri
      - Güvenlik açığı önceliklendirme, düzeltme, bildirim ve olay müdahalesi
    evidence:
      - İncelenmiş değişmez kaynak ve zorunlu denetim alındısı
      - Atlananları içeren sürümlenmiş tarama ve test raporları
      - İstisna sahibi, geçerlilik sonu, düzeltme SLA'sı ve olay kaydı
    accountable_role: secure-engineering-owner
    implementation_status: proposed
    assessment_status: not_assessed

  - id: genai-and-agent-threats
    authority:
      name: OWASP GenAI LLM Top 10 2026 and Agentic Applications Top 10 2026
      url: https://genai.owasp.org/resource/owasp-genai-llm-top-10-2026/
      supplemental_url: https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/
      version: "2026"
      nature: Tehdit rehberliği; belgelendirme standardı değildir
      control_refs:
        - all LLM Top 10 2026 risk categories
        - all Agentic Applications Top 10 2026 risk categories
      mapping_completeness: category-set
    requirement_ids:
      - Requirement 10
      - Requirement 12
      - Requirement 13
      - Requirement 14
      - Requirement 15
    enforcement_points:
      - Güvenilmeyen istem, getirim, bellek, araç çıktısı ve üretilen kod sınırı
      - En az özerklik, deterministik bağımsız değişken politikası, yalıtım alanı, dış ağ çıkışı ve bütçeler
      - İnsan onayı, değişmez araç günlüğü, geri alma ve acil durdurma
    evidence:
      - Enjeksiyon, zehirleme, veri sızdırma, ayrıcalık ve güvensiz özerklik saldırı izleri
      - Araç reddi, onay, bütçe, yetki devri ve koruma önlemi kurcalama sonuçları
      - İnceleyen kararı, artık risk, alarm ve olay tatbikatı
    accountable_role: agent-security-owner
    implementation_status: proposed
    assessment_status: not_assessed

  - id: mcp-tool-boundary
    authority:
      name: Model Context Protocol 2026-07-28
      url: https://modelcontextprotocol.io/specification/2026-07-28
      supplemental_url: https://modelcontextprotocol.io/specification/2026-07-28/basic/authorization
      version: "2026-07-28"
      nature: Güvenlik rehberliği içeren protokol ve yetkilendirme belirtimi
      control_refs:
        - Basic Authorization
        - OAuth resource and audience binding
        - Security Best Practices
      mapping_completeness: protocol-boundary
    requirement_ids:
      - Requirement 3
      - Requirement 10
      - Requirement 12
      - Requirement 13
      - Requirement 14
      - Requirement 15
    enforcement_points:
      - Güvenilen kayıt defteri ve sabitlenmiş sunucu, araç ve şema özeti
      - Açık rıza, en dar kapsam, birebir `issuer`/`redirect` doğrulaması ve belirteç aktarma yasağı
      - İşlem başına onay, yalıtım alanı, dış ağ çıkışı, köken ve çağrı günlüğü
    evidence:
      - Onaylı araç manifesti, sahibi, özeti, kapsamı ve geçerlilik sonu
      - Yetkilendirme uygunluğu ve olumsuz test raporu
      - Rıza, onay, çağrı, köken ve dış ağ çıkışı alındıları
    accountable_role: tool-platform-owner
    implementation_status: proposed
    assessment_status: not_assessed

  - id: supply-chain-provenance
    authority:
      name: SLSA 1.2
      url: https://slsa.dev/spec/v1.2/
      version: "1.2"
      nature: Kaynak ve derleme tedarik zinciri bütünlüğü belirtimi
      control_refs:
        - Source L1-L4
        - Build L1-L3
      mapping_completeness: level-target-design
    requirement_ids:
      - Requirement 9
      - Requirement 11
      - Requirement 15
    enforcement_points:
      - Korumalı kaynak geçmişi ve deterministik bağdaştırıcı sürümü
      - Kaynak ve yapıt özetine bağlı imzalı köken kaydı içeren yalıtılmış derleyici
      - Kimlik, imza, köken ve politika doğrulayan dağıtım kabulü
    evidence:
      - Değişmez kaynak ve yapıt özetleri
      - İmzalı köken ve doğrulama alındısı
      - Yayımlanan bağdaştırıcıya bağlı kabul politikası sonucu
    accountable_role: software-supply-chain-owner
    implementation_status: proposed
    assessment_status: not_assessed

  - id: component-and-ai-inventory
    authority:
      name: CycloneDX 1.7 / ECMA-424 and SPDX 3.0.1
      url: https://cyclonedx.org/specification/overview/
      supplemental_url: https://spdx.github.io/spdx-spec/
      version: "1.7/3.0.1"
      nature: Bileşen, hizmet, AI, veri kümesi ve derleme envanteri belirtimleri
      control_refs:
        - CycloneDX component, service, dependency, formulation, and AI/ML model data
        - SPDX software, AI, dataset, and build profiles
      mapping_completeness: profile-selection-design
    requirement_ids:
      - Requirement 9
      - Requirement 13
      - Requirement 15
    enforcement_points:
      - Bağdaştırıcı, bağımlılık, model profili, veri kümesi ve araç envanteri üretimi
      - Güvenlik açığı, VEX, lisans, tedarikçi ve köken incelemesi
      - Değişmez özetle sürüm ve dağıtım kabulü
    evidence:
      - Doğrudan ve geçişli ilişki içeren yeterli SBOM/AIBOM
      - Lisans, güvenlik açığı ve VEX durumu
      - Köken ve kabul alındısına bağlı imzalı envanter özeti
    accountable_role: software-supply-chain-owner
    implementation_status: proposed
    assessment_status: not_assessed
