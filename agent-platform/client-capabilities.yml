clients:
  - id: codex
    vendor: OpenAI
    product: Codex CLI ve IDE eklentisi
    surfaces:
      - cli
      - ide-extension
    adapter:
      id: codex
      version: 1.11.0
      generation_status: implemented
      client_version_range: "==0.147.0"
      candidate_inventory_ref: client:codex
    admission:
      state: research
      reason: Yalnız dokümantasyon eşlemesi; hiçbir birebir istemci/model/araç bileşimi uygunluk paketini çalıştırmadı.
    conformance:
      status: not_run
      runtime_version: null
      model_profile_digest: null
      projection_digest: null
      test_run_id: null
    mappings:
      - capability: project-instructions
        applies_to_surfaces: [cli, ide-extension]
        status: supported
        projection: native
        maturity: unspecified
        lifecycle: current
        volatile: true
        adapter_strategy: emit
        format: Belgelenmiş hiyerarşi ve geçersiz kılma önceliği içeren AGENTS.md
        lossiness: none
        discovery:
          - scope: project
            location: AGENTS.md
          - scope: nested
            location: "`AGENTS.override.md` veya iç içe `AGENTS.md`"
        limitations:
          - Üretilen `.codex/config.toml` içindeki `project_doc_max_bytes`, yönetilen kök ve alt dizin `AGENTS.md` zincirlerinin UTF-8 boyutunu kapsar ve kural üretiminde yeniden hesaplanır. Proje yapılandırması yalnız güvenilen projede yüklenir; kullanıcı/genel talimatları, yönetilmeyen ek dosyalar ve daha yüksek öncelikli yapılandırma bu boyut güvencesinin dışındadır. Kesilmeden yükleme, LLM'in her talimata uyduğunun veya istemciye özgü kabulün kanıtı değildir.
        source_ids: [codex-instructions]
        conformance_status: not_run
      - capability: path-scoped-rules
        applies_to_surfaces: [cli, ide-extension]
        status: degraded
        projection: transformed
        maturity: unspecified
        lifecycle: current
        volatile: true
        adapter_strategy: translate
        format: İç içe AGENTS.md hiyerarşisi
        lossiness: bounded
        discovery:
          - scope: directory
            location: İç içe `AGENTS.md`
        limitations:
          - Keyfi glob koşulları dizin hiyerarşisine ayrıştırılmalıdır ve her örtüşmeyi korumayabilir.
        source_ids: [codex-instructions]
        conformance_status: not_run
      - capability: agent-skills
        applies_to_surfaces: [cli, ide-extension]
        status: supported
        projection: native
        maturity: unspecified
        lifecycle: current
        volatile: true
        adapter_strategy: emit
        format: Ajan Becerileri paketi
        lossiness: none
        discovery:
          - scope: project
            location: .agents/skills/<name>/SKILL.md
        limitations: []
        source_ids: [codex-skills]
        conformance_status: not_run
      - capability: reusable-commands
        applies_to_surfaces: [cli, ide-extension]
        status: degraded
        projection: transformed
        maturity: unspecified
        lifecycle: current
        volatile: true
        adapter_strategy: translate
        format: Açıkça çağrılan beceri
        lossiness: bounded
        discovery:
          - scope: project
            location: .agents/skills/<name>/SKILL.md
        limitations:
          - Ayrı bir güncel proje özel komut dosyası yüzeyi kabul edilmez; komut niyeti bir beceriye çevrilir.
        source_ids: [codex-skills]
        conformance_status: not_run
      - capability: custom-agents
        applies_to_surfaces: [cli, ide-extension]
        status: supported
        projection: native
        maturity: unspecified
        lifecycle: current
        volatile: true
        adapter_strategy: emit
        format: Codex ajan TOML'i
        lossiness: none
        discovery:
          - scope: project
            location: .codex/agents/*.toml
        limitations: []
        source_ids: [codex-agents]
        conformance_status: not_run
      - capability: inference-profile
        applies_to_surfaces: [cli, ide-extension]
        status: supported
        projection: native
        maturity: unspecified
        lifecycle: current
        volatile: true
        adapter_strategy: emit
        format: Özel ajan TOML'inde `model` ve `model_reasoning_effort`
        lossiness: none
        discovery:
          - scope: project
            location: .codex/agents/*.toml
        limitations: []
        source_ids: [codex-agents]
        conformance_status: not_run
      - capability: lifecycle-hooks
        applies_to_surfaces: [cli, ide-extension]
        status: degraded
        projection: native
        maturity: unspecified
        lifecycle: current
        volatile: true
        adapter_strategy: emit
        format: Codex kanca JSON'u veya satır içi TOML yapılandırması
        lossiness: bounded
        discovery:
          - scope: project
            location: .codex/hooks.json
          - scope: configuration
            location: .codex/config.toml
        limitations:
          - Üretilen `PreToolUse/Bash` komut kancası kurulu veya içe aktarılabilir `kt_scaffold` paketi gerektirmeyen, depo içi ve yalnız Python standart kitaplığını kullanan kanıt-bütünlüğü koşum takımıdır; istemci makinesinde `python3` gerektirir. Yalnız görünür üst seviye `git`/`/usr/bin/git` doğrudan `commit` çağrısında birebir hazırlanmış anlık görüntü ile tam v3 makbuz, rapor, karar, ikinci geçiş ve denetim zincirini doğrular; eksik, bayat, yanlış özet ya da araç/Git tesisatı hatasında exit 2 ile reddeder. Koşum takımı ajan çağırmaz, bulguları puanlamaz veya anlamsal karar üretmez. Proje ve kanca özeti güveni gerekir; özelleşmiş araç/atlatma ile çökme/zaman aşımı için belgelenmiş `failClosed` yoktur. Bu nedenle iddia `conditional-native-guard`, uygunluk `not_run`; manuel terminal/SCM/kapalı sarmalayıcı kapsam dışıdır ve Claude/Cursor eşdeğerliği iddia edilmez.
          - Codex komut olayı `session_id` ve `cwd` taşır fakat istemci sürümü taşımaz. Makbuz sürümü istemciye özgü olay tarafından doğrulanmaz; istem girişiyle aynı mahremiyeti koruyan oturum özeti doğrulanır. Yalın `git`, PATH üzerindeki çalıştırılabilir dosya çözümüne; `alias`/`function` ise kapsam dışı güven varsayımına tabidir. `/usr/bin/git` birebir çalıştırılabilir dosyaya bağlı şekildir.
          - Proje içi kancalar yalnız projeye güvenildikten ve her kanca tanımı kullanıcının Codex yapılandırmasında onaylı olduktan sonra çalışır; tanım değişince onay yeniden gerekir. Fabrika, Codex seçili projeyi oluştururken ve kancaları değiştiren güncellemede yalnız o projenin kanonik kancaları için Codex'in kendi onay kaydını yazar; başka yerden kopyalanan projede onay Codex Settings → Hooks sayfasındadır. IDE eklentisinde `/hooks` komutu yoktur ve eklenti onaylanmamış kancayı uyarısız atlar. Yönetilen (`managed`) kancalar politika gereği güvenilir sayılır; fabrika yönetilen kanca dağıtmaz ve onay atlatma yolu kullanmaz.
          - Üretilen `UserPromptSubmit` kancası yalnız kullanıcı istem metnini tarar; temiz metni birebir, hassas eşleşmeli metni kanonik alan redaksiyonundan sonra `2.0` şemalı makbuza yazar. Ham hassas metni/özetini ve dosya, ek, akıl yürütme, yardımcı yanıtı, konuşma dökümü veya araç bağlamını kaydetmez. Makbuz servis sahipli korumalı makine deposuna yazılır; proje içinde yalnız içeriksiz konum üst verisi kalır. Kayıt uyarlaması sağlayıcı kaynağına değil fabrika uyarlamasına dayanır ve yalnız mevcut `UserPromptSubmit` makbuzundan izin verilen istemin hazırlık olayını aynı oturum/tur, çağrı, koşum ve iz bağlarıyla alır; bu olay tek başına model bağlantısının kurulduğunu kanıtlamaz; ayrı bir `StopFailure` veya alt ajan hata kancası üretilmez. Bu sınır sağlayıcının diğer yeteneklerinin yokluğu iddiası değildir. `complete_llm_attempt_coverage=false`; dahili model denemeleri ve tekrarlarının eksiksiz kaydı kanıtlanmaz.
          - Yerel birim ve sözleşme testleri CLI, IDE eklentisi veya Codex uygulamasında çalışma zamanı uygunluk kanıtı değildir; hata ve zaman aşımı davranışı birebir istemci koşumunda doğrulanmalıdır.
        source_ids: [codex-hooks]
        conformance_status: not_run
      - capability: mcp-tools
        applies_to_surfaces: [cli, ide-extension]
        status: supported
        projection: native
        maturity: unspecified
        lifecycle: current
        volatile: true
        adapter_strategy: emit
        format: Codex MCP yapılandırması
        lossiness: none
        discovery:
          - scope: project
            location: .codex/config.toml
        limitations: []
        source_ids: [codex-mcp]
        conformance_status: not_run
      - capability: permission-policy
        applies_to_surfaces: [cli, ide-extension]
        status: degraded
        projection: transformed
        maturity: unspecified
        lifecycle: current
        volatile: true
        adapter_strategy: translate
        format: Kararlı yalıtım alanı ve onay isteği ile harici yetkilendirme politikası
        lossiness: bounded
        discovery:
          - scope: configuration
            location: "`.codex/config.toml` ve daha yüksek öncelikli yönetilen politika"
        limitations:
          - Deneysel yürütme kuralları üretim bağdaştırıcısı tarafından üretilmez ve yalnız haricidir.
          - Çalışma alanı okumaları salt okunur yalıtım alanı altında devralınan yerel kabuk/araç yüzeyini kullanır; etkin araç kullanılabilirliği ve üst kapsam geçersiz kılmaları çalışma zamanı kanıtı gerektirir.
          - Etkin politika yalıtım alanına, onay kipine ve daha yüksek öncelikli yönetilen yapılandırmaya bağlıdır.
        source_ids: [codex-sandboxing, codex-rules]
        conformance_status: not_run
