schema_version: "1.0"
kind: ClientCapabilityMatrix
as_of: "2026-08-18"
status: research

contract:
  schema_version: "1.0"
  schema_path: agent-platform/agent-contract.schema.json

runtime_candidate_inventory:
  schema_path: agent-platform/runtime-candidate.schema.json
  data_path: agent-platform/conformance/candidates/macos-arm64-2026-08-19.yml
  claim_boundary: >-
    Envanter yalnız birebir istemci yapıtlarının kurulduğunu ve tanımlandığını kanıtlar.
    Bağdaştırıcı üretimini, yerel keşfi, etkin izinleri, çalışma zamanı uygunluğunu veya
    sahip kabulünü kanıtlamaz; bu durumlar bağımsız değerlendirilir ve kaydedilir.

policy:
  mapping_claim_only: true
  support_values:
    - supported
    - degraded
    - unmapped
    - forbidden
  projection_values:
    - native
    - compatible
    - transformed
    - none
  maturity_values:
    - ga
    - preview
    - beta
    - experimental
    - unspecified
  lifecycle_values:
    - current
    - legacy
    - deprecated
  adapter_strategy_values:
    - emit
    - import-wrapper
    - translate
    - omit
  lossiness_values:
    - none
    - bounded
    - material
  conformance_values:
    - not_run
    - passed
    - failed
    - expired
  admission_values:
    - research
    - candidate
    - admitted
    - denied
  generation_values:
    - not_implemented
    - candidate
    - implemented
  semantics:
    supported: Belgelenmiş yerel veya uyumlu yüzey vardır ve tanımlanmış anlamsal kayıp yoktur; çalışma zamanı kabulü ayrıdır.
    degraded: Güvenli izdüşüm bulunabilir; sınırlamalar ve sıfırdan farklı anlamsal kayıp beyan edilmelidir.
    unmapped: Güvenilir izdüşüm yoktur; yetkinlik gerekli olduğunda üretim başarısız olur.
    forbidden: Kurumsal politika izdüşümü yasaklar; üretim ve kabul her zaman başarısız olur.
  external_controls:
    - çıkarım profili çözümleme ve sağlayıcı/model kabulü
    - kimlik, kimlik bilgisi ve gizli bilgi aracılığı ile veri kaybı önleme
    - dosya sistemi yalıtım alanı ve dış ağ çıkışı uygulatımı
    - sabitlenmiş köken kaydıyla araç ve MCP kayıt defteri kabulü
    - ayrıcalıklı ve harici yan etki onayı
    - CI kural kümesi, sürüm imzalama ve dağıtım kabulü
  admission_rule: >-
    Gerekli yetkinlik `unmapped` veya `forbidden` ise, gerekli eşleme `material` kayıp taşıyorsa,
    gerekli uygunluk vakalarından biri geçmemişse, kanıt süresi dolmuşsa veya harici politika
    istenen risk katmanını reddediyorsa bileşim kabul edilemez.
  requirement_semantics: >-
    Aşağıda `required` işaretlenen yetkinlik platform varsayılanıdır. Manifest düzeyindeki zorunlu
    kural, beceri, komut, araç, MCP kayıt defteri, yaşam döngüsü kancası niyeti, izin, yetki devri,
    veri veya kanıt gereksinimi bu varsayılanı yalnız güçlendirebilir ve ilgili eşlemeyle
    değerlendirilmelidir. Zorunlu yaşam döngüsü niyeti, yalnız izdüşüm manifesti atlamayı
    kaydedip niyeti zorunlu, başarısızlıkta güvenli kapanan harici kontrole bağladığında sınırlı
    `degraded` eşleme kullanabilir; `unmapped` veya yalnız talimatla karşılanan zorunlu yaşam
    döngüsü niyeti yine üretimi başarısız kılar.
  maturity_rule: >-
    `ga` yalnız birebir satıcı sürüm kaynağı yüzeyi açıkça kararlı veya GA olarak
    etiketlediğinde kullanılır. Bu kanıtı olmayan belgelenmiş yüzey `unspecified` ve değişkendir.
  lifecycle_rule: >-
    `current`, yüzeyin tarihli dokümantasyon anında yer aldığı anlamına gelir; doğrulanmış
    istemci sürümü garantisi değildir. Aday eşleme ayrıca birebir istemci sürümü, kaynak konumu
    veya özet ve gerçek çalışma zamanı uygunluk kanıtı gerektirir.
  state_boundary: >-
    Bağdaştırıcı üretim durumu, kurulu aday kanıtı, çalışma zamanı uygunluğu ve sahip kabulü
    bağımsız durumlardır. `implemented` üretim ve birebir kurulu yapıt, `not_run` uygunluk sonucunu
    veya `research` kabul durumunu değiştirmez.
  manifest_capability_bindings:
    mission.instructions_ref: custom-agents
    requirements.inference_profile_ref: inference-profile
    requirements.policies: permission-policy
    requirements.rules: project-instructions
    requirements.skills: agent-skills
    requirements.commands: reusable-commands
    requirements.hook_intents: lifecycle-hooks
    requirements.mcp: mcp-tools
    delegation: custom-agents
    permissions: permission-policy

capabilities:
  - id: project-instructions
    required: true
    intent: Proje genelindeki kanonik talimatları deterministik öncelikle keşfet.
  - id: path-scoped-rules
    required: true
    intent: Ek kuralları yalnız amaçlanan depo yollarına uygula.
  - id: agent-skills
    required: true
    intent: Talimat ve sınırlı kaynak içeren yeniden kullanılabilir beceri paketlerini keşfet.
  - id: reusable-commands
    required: false
    intent: Gizli yetki vermeden, kullanıcının açıkça çağırdığı iş akışı giriş noktalarını sun.
  - id: custom-agents
    required: true
    intent: Uzman ajan rolleriyle yalıtım, çağırma ve yetki devri davranışını tanımla.
  - id: inference-profile
    required: true
    intent: Uzman ajan için model sınıfı ve destekleniyorsa düşük effort isteğini istemci yüzeyine eşle.
  - id: lifecycle-hooks
    required: false
    intent: Anlamsal yaşam döngüsü niyetlerini kabul edilmiş istemci kolaylık kancalarına bağla; yetkilendirme harici kalır.
  - id: mcp-tools
    required: true
    intent: Onaylı MCP yetkinliklerini ortam üzerinden çözümlenen kayıt defteri girdileriyle yapılandır.
  - id: permission-policy
    required: true
    intent: Kalıcı önleme için harici uygulatıma dayanırken en az ayrıcalığı iste.

