agent: supervisor
version: "1.0.0"

# Her worker agent'ın toplam risk skoruna katkı ağırlığı.
# Güvenlik agent'ları (infosec/appsec) daha yüksek ağırlığa sahiptir çünkü
# bankacılık/regüle ortamda güvenlik bulguları iş etkisi bakımından
# kalite bulgularından daha kritik kabul edilir.
agent_weights:
  requirements_scope: 0.6
  enterprise_architecture: 1.0
  code_quality: 0.8
  code_review: 0.8
  information_security: 1.4
  application_security: 1.4
  oss_license: 1.3
  privacy_kvkk: 1.4
  test_automation: 0.6
  documentation: 0.3
  devops: 1.0
  observability: 0.5

thresholds:
  fail_score: 60          # risk_score >= 60 -> FAIL (hard-fail yoksa bile)
  warning_score: 25       # 25 <= risk_score < 60 -> WARNING
  confidence_floor: 0.55  # herhangi bir agent confidence < 0.55 ise -> MANUAL_REVIEW

compliance_baseline: 100  # compliance_score = baseline - risk_score (0'da taban)
