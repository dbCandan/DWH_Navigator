agent: devops
version: "1.0.0"

weights:
  critical: 30
  high: 15
  medium: 7
  low: 3
  info: 0

rules:
  - id: DEVOPS-001
    category: container_hygiene
    severity: medium
    hard_fail: false
    message: "Docker imajı ':latest' tag'i ile sabitlenmiş — reprodüksiyon edilebilirlik (SLSA) riski, sabit versiyon kullanılmalı."
    pattern: "^\\s*FROM\\s+[\\w./-]+:latest\\b"

  - id: DEVOPS-002
    category: container_hardening
    severity: high
    hard_fail: false
    message: "Container açıkça root kullanıcısıyla (USER root / USER 0) çalıştırılıyor — least privilege ihlali."
    pattern: "^\\s*USER\\s+(root|0)\\b"

  - id: DEVOPS-003
    category: secret_in_config
    severity: critical
    hard_fail: true
    message: "CI/CD veya container yapılandırmasında (yaml) sabit kodlanmış şifre/anahtar tespit edildi."
    pattern: "(?m)^\\s*(password|api_key|secret)\\s*:\\s*['\"]?[A-Za-z0-9_\\-]{8,}"

  - id: DEVOPS-004
    category: network_exposure
    severity: low
    hard_fail: false
    message: "Servis tüm arayüzlere (0.0.0.0) bind ediliyor — ağ maruziyeti gözden geçirilmeli."
    pattern: "0\\.0\\.0\\.0"

  # "AI Agent Güvenlik ve Kodlama Talimatları" (kurumsal standart) Bölüm 5,
  # "Veri Güvenliği Yönetimi" Bölüm 9 — en az yetki (least privilege) DB erişimi.
  - id: DEVOPS-005
    category: least_privilege
    severity: critical
    hard_fail: true
    message: "Ayrıcalıklı/yönetici veritabanı hesabı (sa/root/admin/dbo) runtime bağlantısında kullanılıyor — kurumsal standart bu hesapların runtime'da kullanılmasını yasaklar (Bölüm 9)."
    pattern: "(?i)(user|uid|username)\\s*[:=]\\s*['\"]?(sa|root|admin|dbo)['\"]?\\b"
