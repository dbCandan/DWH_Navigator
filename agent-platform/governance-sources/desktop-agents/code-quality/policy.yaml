agent: code_quality
version: "1.1.0"

weights:
  critical: 40
  high: 18
  medium: 8
  low: 3
  info: 0

rules:
  - id: QUAL-001
    category: complexity
    severity: medium
    hard_fail: false
    message: "Aşırı derin iç içe blok (nesting) tespit edildi (>=4 seviye) — okunabilirlik ve SOLID/KISS ihlali riski."
    pattern: "^( {16,}|\\t{4,})\\S"

  - id: QUAL-002
    category: dead_code
    severity: low
    hard_fail: false
    message: "TODO/FIXME/HACK işareti — tamamlanmamış iş kalıntısı, teknik borç."
    pattern: "\\b(TODO|FIXME|HACK|XXX)\\b"

  - id: QUAL-003
    category: naming
    severity: low
    hard_fail: false
    message: "Tek harfli / anlamsız değişken adı (örn. x, tmp, foo) — naming standardı ihlali."
    pattern: "\\b(def|function)\\s+\\w+\\([^)]*\\b(x|tmp|foo|bar)\\b"

  - id: QUAL-004
    category: anti_pattern
    severity: high
    hard_fail: false
    message: "Yakalanan istisna sessizce yutuluyor (bare except / empty catch) — hata gizleme anti-pattern'i."
    pattern: "except\\s*:\\s*\\n\\s*pass"

  - id: QUAL-005
    category: anti_pattern
    severity: medium
    hard_fail: false
    message: "eval()/exec() kullanımı — dinamik kod çalıştırma, maintainability ve güvenlik riski (bkz. AppSec)."
    pattern: "\\b(eval|exec)\\s*\\("

  - id: QUAL-006
    category: dry
    severity: low
    hard_fail: false
    message: "Sihirli sayı (magic number) kullanımı — sabitlere (constant) çıkarılması önerilir."
    pattern: "(?<![\\w.])(?:[2-9]\\d{2,}|1\\d{3,})(?![\\w.])"

  # --- Aşağıdaki kurallar "AI Agent Yazılım Standartları ve Kalite
  # Talimatları" (kurumsal standart) referans alınarak eklenmiştir.
  - id: QUAL-007
    category: anti_pattern
    severity: low
    hard_fail: false
    message: "'== None' / '!= None' kullanımı — Python'da kimlik (identity) karşılaştırması için 'is None' / 'is not None' zorunludur (Bölüm 3)."
    pattern: "[=!]=\\s*None\\b"

  - id: QUAL-008
    category: anti_pattern
    severity: low
    hard_fail: false
    message: "Boolean değerle '== True/False' (Python) veya '== true/false' (TS/JS) karşılaştırması — doğrudan koşul ('if x:' / 'if (x)') kullanılmalı (Bölüm 3)."
    pattern: "[=!]=\\s*(True|False|true|false)\\b"

  - id: QUAL-009
    category: naming
    severity: low
    hard_fail: false
    message: "Hungarian notation (tip önekli isimlendirme, örn. strName/arrItems) kullanımı — kurumsal standart tip bilgisini isme dahil etmeyi yasaklar (Bölüm 2)."
    pattern: "\\b(str|arr|int|bool|obj)[A-Z]\\w*\\s*="

  - id: QUAL-010
    category: dead_code
    severity: low
    hard_fail: false
    message: "Sahipsiz TODO/FIXME (issue/ticket referansı yok) — kurumsal standart her TODO/FIXME'nin bir referans içermesini zorunlu kılar, örn. '# TODO(#1234): ...' (Bölüm 3)."
    pattern: "#\\s*(TODO|FIXME)\\b(?!.*#\\d+)"

  - id: QUAL-011
    category: solid_srp
    severity: medium
    hard_fail: false
    message: "Tek dosyada birden fazla sınıf (>=3) tanımlanmış — SOLID Single Responsibility ve modülerlik ilkesi ihlali (her sınıf ayrı modülde olmalıdır)."
    pattern: ""

# ---------------------------------------------------------------------
# YAPISAL / SOLID İYİLEŞTİRME KRİTERLERİ (analiz modu — AST tabanlı)
# ---------------------------------------------------------------------
# Bu kısıtlar regex ile DEĞİL, gerçek Python AST'si ile değerlendirilir
# (bkz. agents/code_quality/agent.py: _check_structural_quality). Amaç:
# var olan kodun SOLID prensiplerine (özellikle Single Responsibility)
# ve sürdürülebilirlik standardına ne kadar uyduğunu somut, ölçülebilir
# bulgulara dökmek — bu bir "kod üretim kısıtı" DEĞİL, "iyileştirme
# önerisi" kaynağıdır.
structural_quality:
  require_type_hints: true
  require_docstrings: true
  max_classes_per_file: 2    # Tek dosyada maks 2 sınıf; 3 ve üzeri SOLID SRP ihlali
  max_class_public_methods: 7
  max_function_lines: 50   # Kurumsal standart: "AI Agent Yazılım Standartları" Bölüm 3
  max_function_parameters: 3   # Kurumsal standart Bölüm 3: "3'ü geçmesin, fazlası için DTO/dataclass kullan"
  max_cognitive_complexity: 15   # Bölüm 3: "SonarQube cognitive complexity 15'in üzerine çıkmamalı"
  boolean_naming_prefixes: ["is_", "has_", "can_", "should_"]   # Bölüm 2: boolean fonksiyon adlandırma

structural_quality_weights:
  missing_docstring: low
  missing_type_hints: low
  too_many_public_methods: medium
  function_too_long: medium
  too_many_parameters: medium
  high_complexity: high
  boolean_naming: low
  ts_loose_equality: medium
  ts_missing_braces: low

# Kural motoruna beslenmez; agent.md üzerinden model'e bağlam olarak
# verilir (reasoning_summary'nin SOLID farkındalıklı olması için).
solid_reference:
  - "Single Responsibility Principle: Her sınıfın yalnızca tek bir sorumluluğu ve tek bir değişim nedeni olmalı; birden fazla iş yapan 'god class' kod kokusu (code smell) olarak işaretlenmeli."
  - "Open/Closed Principle: Sınıflar genişlemeye açık, değişikliğe kapalı olmalı; her yeni özellik için mevcut sınıfın değiştirilmesi bir iyileştirme fırsatı olarak not edilmeli."
  - "Liskov Substitution Principle: Alt sınıfların üst sınıfın davranış sözleşmesini bozmadığından emin olunmalı."
  - "Interface Segregation Principle: Büyük, çok amaçlı sınıflar/arayüzler yerine küçük, amaca özel olanlar önerilmeli."
  - "Dependency Inversion Principle: Somut bağımlılıklar yerine soyutlamalara (interface/abstract base class) ve constructor injection'a öncelik verilmeli."

semantic_check:
  enabled: false
  min_findings_to_trigger: 0
  focus: "SOLID prensiplerine (ozellikle Single Responsibility) semantik uygunluk"
