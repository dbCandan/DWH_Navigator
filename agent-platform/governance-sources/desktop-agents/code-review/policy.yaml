agent: code_review
version: "1.0.0"

weights:
  critical: 30
  high: 16
  medium: 7
  low: 3
  info: 0

thresholds:
  max_function_lines: 50   # Kurumsal standart ile senkronize (bkz. policies/quality/policy.yaml)
  min_commented_code_block_lines: 3

