agent: autofix
version: "1.0.0"

max_retries: 2

# Yalnızca burada "enabled: true" olan, GÜVENLİ ve deterministik
# dönüşümler otomatik uygulanır. Davranışı değiştirebilecek veya
# riskli olan bulgular (örn. SQL/command injection mantığı) OTOMATİK
# düzeltilmez — yalnızca MANUAL_REVIEW için işaretlenir.
enabled_fix_rules:
  SEC-001: true        # hardcoded secret -> os.environ.get(...)
  QUAL-004: true        # bare except: pass -> logging.exception
  APPSEC-004: true       # hashlib.md5/sha1 -> hashlib.sha256
  APPSEC-002: false      # command injection: davranış değişikliği riski yüksek, otomatik düzeltilmez
  APPSEC-001: false      # SQL injection: davranış değişikliği riski yüksek, otomatik düzeltilmez
