agent: enterprise_architecture
version: "1.0.0"

weights:
  critical: 35
  high: 18
  medium: 8
  low: 3
  info: 0

# Kurumsal onaylı framework/dil versiyonu stratejisi. Bu liste kurumsal
# mimari standardına göre güncellenir (policy değişir, kod değişmez).
approved_frameworks:
  - fastapi
  - pydantic

disallowed_frameworks:
  - flask
  - django

# Kurumun izin verdiği hedef Python çalışma zamanı sürümü. Kod ÜRETİMİ
# (ileride eklenirse) bu sürümü hedeflemeli; paketleme dosyalarında
# (pyproject.toml/setup.py/setup.cfg) beyan edilen `python_requires`
# bu sürümle uyumlu olmalıdır — bkz. ARCH-006.
target_python_version: "3.12.12"

rules:
  - id: ARCH-001
    category: dependency_strategy
    severity: medium
    hard_fail: false
    message: "Wildcard import ('from X import *') — dependency strategy ve okunabilirlik standardı ihlali."
    pattern: "^\\s*from\\s+[\\w.]+\\s+import\\s+\\*"

  - id: ARCH-002
    category: language_version
    severity: high
    hard_fail: false
    message: "Python 2 stili print ifadesi tespit edildi — desteklenen dil versiyonu standardına aykırı."
    pattern: "^\\s*print\\s+[\"'][^()]"

  - id: ARCH-003
    category: approved_framework
    severity: medium
    hard_fail: false
    message: "Kurumun onaylı framework listesinde olmayan bir framework import edilmiş (approved_frameworks bkz. policy)."
    pattern: "^\\s*(import|from)\\s+(flask|django)\\b"

  - id: ARCH-004
    category: language_version
    severity: low
    hard_fail: false
    message: "Python 2'ye özgü modül (urllib2) kullanımı — dil/versiyon standardı ihlali."
    pattern: "\\burllib2\\b"

  # Kullanıcının belirlediği hedef sürüm (target_python_version: 3.12.12)
  # ile uyumsuz bir `python_requires` beyanı — yalnızca paketleme
  # dosyaları (pyproject.toml/setup.py/setup.cfg) tarandığında anlamlıdır.
  - id: ARCH-006
    category: language_version
    severity: medium
    hard_fail: false
    message: "'python_requires' beyanı hedef sürümle (3.12) uyumsuz görünüyor — kurumsal standart Python 3.12.12'yi zorunlu kılar."
    pattern: "python_requires\\s*=\\s*[\"'](?:(?!3\\.12)[^\"'])*[\"']"

# "AI Agent Yazılım Standartları" (kurumsal standart) Bölüm 4 —
# "Composition over Inheritance: Derin miras hiyerarşileri (3+ seviye)
# yasak". Regex ile güvenilir kontrol edilemez (sınıf hiyerarşisi
# izlenmesi gerekir) — bkz. agents/enterprise_architecture/agent.py:
# _check_inheritance_depth (AST tabanlı).
structural_checks:
  max_inheritance_depth: 2   # 2 = A -> B izinli (depth 2); A -> B -> C (depth 3) ihlal
