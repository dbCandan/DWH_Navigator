agent: requirements_scope
version: "1.0.0"

weights:
  critical: 30
  high: 15
  medium: 6
  low: 2
  info: 0

rules:
  - id: REQ-001
    category: incomplete_requirement
    severity: high
    hard_fail: false
    message: "NotImplementedError bırakılmış — acceptance criteria/gereksinim tam karşılanmamış olabilir."
    pattern: "raise\\s+NotImplementedError"

  - id: REQ-002
    category: scope_traceability
    severity: medium
    hard_fail: false
    message: "TODO/FIXME, gereksinim veya kapsam (requirement/scope) referansı ile birlikte bırakılmış — izlenebilirlik açığı."
    pattern: "#.*\\b(TODO|FIXME)\\b.*\\b(requirement|scope|spec|gereksinim|kapsam)\\b"

  - id: REQ-003
    category: placeholder_implementation
    severity: medium
    hard_fail: false
    message: "Yalnızca 'pass' içeren fonksiyon gövdesi — user story/gereksinim implementasyonu eksik olabilir."
    pattern: "def\\s+\\w+\\([^)]*\\)\\s*:\\s*\\n\\s*pass\\s*(\\n|$)"

  - id: REQ-004
    category: scope_creep
    severity: low
    hard_fail: false
    message: "'kapsam dışı / out of scope' işaretli kod bloğu — scope analizi için gözden geçirilmeli."
    pattern: "#.*\\b(out of scope|kapsam d[ıi][şs][ıi]nda)\\b"

  # "Veri Güvenliği Yönetimi" (kurumsal standart) Bölüm 12.2 — "AI
  # tarafından üretilen kritik fonksiyonlar (yetkilendirme, veri işleme,
  # kimlik doğrulama, kriptografik işlemler) bir insan geliştirici
  # tarafından manuel incelenmeli ve tehdit modelleme aşamasından
  # geçirilmelidir." Bu, HARD bir ihlal değil — bir HATIRLATMADIR
  # (severity: info), bu yüzden risk skoruna neredeyse hiç katkı vermez.
  - id: REQ-005
    category: threat_modeling_reminder
    severity: info
    hard_fail: false
    message: "Güvenlik-kritik bir fonksiyon (auth/encrypt/decrypt) tanımlanmış — kurumsal standart bu tür fonksiyonların insan tarafından manuel tehdit modellemesinden geçmesini zorunlu kılar (Bölüm 12.2)."
    pattern: "def\\s+\\w*(authenticate|encrypt|decrypt|authorize|verify_password|hash_password)\\w*\\s*\\("
