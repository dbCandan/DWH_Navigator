# Geliştirme ekibi için not — BP detector-pack.schema.json 1.1 ile farklar:
#   BP şeması yük testine özgü ölçütleri tanımıyor. Bu paketin geçmesi için şemaya şunlar eklenmelidir
#   (önerilen sürüm 1.2):
#   1. implementation.kind: "load-metric"  (metric, statistic, operator, threshold, unit?, per?, minimum_samples?)
#   2. implementation.kind: "load-limit"   (limit, operator, threshold)
#   3. load-metric için baseline karşılaştırması: comparison "baseline-relative" + minimum_absolute_delta
#   4. event enum'una: "application-component-crashed"
#   5. runtime_profile.id şu an test-otomasyonu'na sabit; profil kimliği ajan başına serbest bırakılmalı
#      ve isteğe bağlı load_limits / load_profiles alanları eklenmelidir.
#   Bunların dışındaki her alan BP şemasıyla birebir uyumludur. "regex" ve "event" (ilk üç olay)
#   dedektörleri mevcut şemadan geçer.
# Bu dosya VERİDİR; dedektörleri ajan değil, belirlenimci yürütücü/değerlendirici çalıştırır.
schema_version: "1.1"
kind: DeterministicDetectorPack
metadata:
  id: detector-pack:yuk-testi
  version: 0.3.0
  owner: team:quality-engineering
  lifecycle: draft
agent_ref: agent:yuk-testi
policy_ref: policy:yuk-testi
source_lineage:
  source_role: governance-source:desktop-agents/load-test
  source_authority: governance-authoritative
  implementation_status: implementation-pending
  projection_status: not-projectable
  runtime_admission: not-admitted
  crosswalk_ref: governance-crosswalk:desktop-agents-v1
execution_boundary:
  mode: specification-only
  executor_ref: null
  implementation_status: implementation-pending
  projection_status: not-projectable
  runtime_admission: not-admitted
  calibration_status: uncalibrated
detectors:
  # ═══ Yürütme ÖNCESİ — senaryo betiği üzerinde (BP şemasıyla uyumlu) ═══════════════════════════
  - id: detector:yuk-testi/sabit-hedef-adresi
    source_refs:
      - governance-source:desktop-agents/load-test/policy.yaml#rule/LOAD-001
    control_refs:
      - control:LOAD-102
    severity: critical
    evidence_kind: deterministic-check
    standard_refs: []
    implementation:
      kind: regex
      engine: python-re
      pattern: 'https?://'
      flags: [IGNORECASE]
    limitations: Senaryo hedefi yalnız çalıştırıcının verdiği BASE_URL ortam değişkeninden almalıdır; yorum satırları ve dış modül adresleri de bilinçli olarak eşleşir. Dinamik birleştirilen adresleri yakalamaz, bu nedenle çalıştırıcının izinli ortam denetimi ayrıca zorunludur.
    implementation_status: calibration-pending
    projection_status: not-projectable
    runtime_admission: not-admitted
    lifecycle: draft

  - id: detector:yuk-testi/izinsiz-yikici-uc-nokta
    source_refs:
      - governance-source:desktop-agents/load-test/policy.yaml#rule/LOAD-002
    control_refs:
      - control:LOAD-104
    severity: high
    evidence_kind: deterministic-check
    standard_refs: []
    implementation:
      kind: regex
      engine: python-re
      pattern: '^(?!.*destructive\s*:\s*[''"`]izinli[''"`]).*(http\.del\s*\(|http\.request\s*\(\s*[''"`]DELETE[''"`]|/admin/|/bulk|/purge)'
      flags: [IGNORECASE, MULTILINE]
    limitations: İzin etiketi aynı satırda olmalıdır. Etiket beyandır; kaydın senaryonun kendi oluşturduğu sentetik kayıt olduğunu kanıtlamaz.
    implementation_status: calibration-pending
    projection_status: not-projectable
    runtime_admission: not-admitted
    lifecycle: draft

  - id: detector:yuk-testi/dis-yan-etkili-uc-nokta
    source_refs:
      - governance-source:desktop-agents/load-test/policy.yaml#rule/LOAD-003
    control_refs:
      - control:LOAD-104
    severity: high
    evidence_kind: deterministic-check
    standard_refs: []
    implementation:
      kind: regex
      engine: python-re
      pattern: '/(sms|e-?mail|mail|notification|bildirim|odeme|payment|webhook|callback)s?\b'
      flags: [IGNORECASE]
    limitations: Rota adına dayalı sezgisel desendir. Dış yan etkili uç noktalar OpenAPI'de ayrıca işaretlenmelidir; adı bu desene uymayan dış çağrılar yakalanmaz.
    implementation_status: calibration-pending
    projection_status: not-projectable
    runtime_admission: not-admitted
    lifecycle: draft

  - id: detector:yuk-testi/yuk-tavani-asimi
    source_refs:
      - governance-source:desktop-agents/load-test/policy.yaml#setting/runtime/max-vus
      - governance-source:desktop-agents/load-test/policy.yaml#setting/runtime/max-arrival-rate-per-second
      - governance-source:desktop-agents/load-test/policy.yaml#setting/runtime/max-duration-seconds
    control_refs:
      - control:LOAD-103
    severity: critical
    evidence_kind: deterministic-check
    standard_refs: []
    implementation:
      kind: load-limit                       # ŞEMA UZANTISI GEREKİR
      limit: [max-vus, max-arrival-rate-per-second, max-duration-seconds]
      operator: greater-than
      threshold: runtime_profile.load_limits
    limitations: Senaryo seçenekleri yürütmeden önce yük aracının kendi inceleme çıktısından okunmalıdır; çalışma anında hesaplanan ve önceden görülemeyen değer varsa yürütme reddedilir.
    implementation_status: calibration-pending
    projection_status: not-projectable
    runtime_admission: not-admitted
    lifecycle: draft

  # ═══ Yürütme SIRASINDA — olaylar ═══════════════════════════════════════════════════════════════
  - id: detector:yuk-testi/senaryo-uretilemedi
    source_refs:
      - governance-source:desktop-agents/load-test/policy.yaml#rule/LOAD-006
    control_refs:
      - control:LOAD-109
    severity: medium
    evidence_kind: test-result
    standard_refs: []
    implementation:
      kind: event
      event: test-generation-failed
    limitations: Senaryo üretilemediğinde yürütme başlatılmaz; neden sözleşme eksikliği veya sınıflandırılamayan uç nokta olabilir.
    implementation_status: calibration-pending
    projection_status: not-projectable
    runtime_admission: not-admitted
    lifecycle: draft

  - id: detector:yuk-testi/yuk-testi-zaman-asimi
    source_refs:
      - governance-source:desktop-agents/load-test/policy.yaml#setting/runtime/load-test-timeout-seconds
    control_refs:
      - control:LOAD-106
    severity: high
    evidence_kind: test-result
    standard_refs: []
    implementation:
      kind: event
      event: test-execution-timeout
    limitations: Çalıştırıcının dış zaman aşımıdır; yük aracının kendi eşik nedeniyle durdurması bu olay değildir.
    implementation_status: calibration-pending
    projection_status: not-projectable
    runtime_admission: not-admitted
    lifecycle: draft

  - id: detector:yuk-testi/yuk-testi-tamamlanamadi
    source_refs:
      - governance-source:desktop-agents/load-test/policy.yaml#rule/LOAD-004
    control_refs:
      - control:LOAD-106
    severity: high
    evidence_kind: test-result
    standard_refs: []
    implementation:
      kind: event
      event: test-execution-failed
    limitations: Test ortamı hazır olmadığında, sonuç özeti eksik veya bozuk olduğunda ya da beklenen senaryo koşmadığında üretilir; sonuç temiz sayılmaz.
    implementation_status: calibration-pending
    projection_status: not-projectable
    runtime_admission: not-admitted
    lifecycle: draft

  - id: detector:yuk-testi/uygulama-bileseni-coktu
    source_refs:
      - governance-source:desktop-agents/load-test/policy.yaml#rule/LOAD-007
    control_refs:
      - control:LOAD-109
    severity: critical
    evidence_kind: test-result
    standard_refs: []
    implementation:
      kind: event
      event: application-component-crashed   # ŞEMA UZANTISI GEREKİR
    limitations: Test sırasında uygulama bileşeninin yeniden başlaması veya bellek nedeniyle sonlanmasıdır; test ortamı kaynaklarına bağlıdır, prod'da aynı yükte tekrarlanacağını kanıtlamaz.
    implementation_status: calibration-pending
    projection_status: not-projectable
    runtime_admission: not-admitted
    lifecycle: draft

  # ═══ Yürütme SONRASI — ölçüm sonuçları ═════════════════════════════════════════════════════════
  - id: detector:yuk-testi/http-hata-orani
    source_refs:
      - governance-source:desktop-agents/load-test/policy.yaml#setting/threshold/http-error-rate-max
    control_refs:
      - control:LOAD-107
    severity: high
    evidence_kind: test-result
    standard_refs: []
    implementation:
      kind: load-metric                      # ŞEMA UZANTISI GEREKİR
      metric: http_req_failed
      statistic: rate
      operator: greater-than
      threshold: 0.01
    limitations: Senaryonun bilerek beklediği 4xx yanıtları beklenen yanıt olarak tanımlanmazsa hata sayılır.
    implementation_status: calibration-pending
    projection_status: not-projectable
    runtime_admission: not-admitted
    lifecycle: draft

  - id: detector:yuk-testi/p95-gecikme
    source_refs:
      - governance-source:desktop-agents/load-test/policy.yaml#setting/threshold/p95-ms-max
    control_refs:
      - control:LOAD-107
    severity: high
    evidence_kind: test-result
    standard_refs: []
    implementation:
      kind: load-metric                      # ŞEMA UZANTISI GEREKİR
      metric: http_req_duration
      statistic: p95
      unit: ms
      operator: greater-than
      threshold: 500
    limitations: Test ortamında ölçülür; prod gecikmesini temsil etmez. Eşik kalibre edilmemiştir.
    implementation_status: calibration-pending
    projection_status: not-projectable
    runtime_admission: not-admitted
    lifecycle: draft

  - id: detector:yuk-testi/p99-gecikme
    source_refs:
      - governance-source:desktop-agents/load-test/policy.yaml#setting/threshold/p99-ms-max
    control_refs:
      - control:LOAD-107
    severity: medium
    evidence_kind: test-result
    standard_refs: []
    implementation:
      kind: load-metric                      # ŞEMA UZANTISI GEREKİR
      metric: http_req_duration
      statistic: p99
      unit: ms
      operator: greater-than
      threshold: 1500
      minimum_samples: 1000
    limitations: Örnek sayısı alt sınırın altındaysa p99 güvenilmezdir; bulgu yerine yetersiz örnek bilgisi üretilir.
    implementation_status: calibration-pending
    projection_status: not-projectable
    runtime_admission: not-admitted
    lifecycle: draft

  - id: detector:yuk-testi/check-basari-orani
    source_refs:
      - governance-source:desktop-agents/load-test/policy.yaml#setting/threshold/checks-rate-min
    control_refs:
      - control:LOAD-107
    severity: high
    evidence_kind: test-result
    standard_refs: []
    implementation:
      kind: load-metric                      # ŞEMA UZANTISI GEREKİR
      metric: checks
      statistic: rate
      operator: less-than
      threshold: 0.99
    limitations: Yalnız durum kodunu kontrol eden senaryo yanlış yanıt gövdesini yakalamaz; ölçüm check kalitesine bağlıdır.
    implementation_status: calibration-pending
    projection_status: not-projectable
    runtime_admission: not-admitted
    lifecycle: draft

  - id: detector:yuk-testi/p95-gerileme
    source_refs:
      - governance-source:desktop-agents/load-test/policy.yaml#setting/threshold/regression-p95-relative-percent
      - governance-source:desktop-agents/load-test/policy.yaml#setting/threshold/regression-p95-minimum-delta-ms
    control_refs:
      - control:LOAD-108
    severity: high
    evidence_kind: test-result
    standard_refs: []
    implementation:
      kind: load-metric                      # ŞEMA UZANTISI GEREKİR
      metric: http_req_duration
      statistic: p95
      unit: ms
      comparison: baseline-relative
      operator: greater-than
      threshold: 20                          # yüzde artış
      minimum_absolute_delta: 50             # ms; ikisi birlikte aşılmalı
    limitations: Yalnız aynı senaryo, çalıştırıcı profili ve yük aracı sürümüyle alınmış önceki başarılı koşuya karşı geçerlidir; eşleşme yoksa bulgu üretilmez. Tek koşudaki fark ortam gürültüsü olabilir.
    implementation_status: calibration-pending
    projection_status: not-projectable
    runtime_admission: not-admitted
    lifecycle: draft

decision_metadata:
  authoritative_hard_fail_detectors:
    - detector:yuk-testi/sabit-hedef-adresi
    - detector:yuk-testi/yuk-tavani-asimi
  authoritative_non_hard_fail_detectors:
    - detector:yuk-testi/izinsiz-yikici-uc-nokta
    - detector:yuk-testi/dis-yan-etkili-uc-nokta
    - detector:yuk-testi/senaryo-uretilemedi
    - detector:yuk-testi/yuk-testi-zaman-asimi
    - detector:yuk-testi/yuk-testi-tamamlanamadi
    - detector:yuk-testi/uygulama-bileseni-coktu
    - detector:yuk-testi/http-hata-orani
    - detector:yuk-testi/p95-gecikme
    - detector:yuk-testi/p99-gecikme
    - detector:yuk-testi/check-basari-orani
    - detector:yuk-testi/p95-gerileme
  hard_fail_not_declared_detectors: []
  unresolved_hard_fail_detectors: []
  unresolved_decision_conflicts: []

runtime_profile:
  id: runtime-profile:yuk-testi-yalitilmis   # ŞEMA UZANTISI GEREKİR (şu an test-otomasyonu'na sabit)
  source_refs:
    - governance-source:desktop-agents/load-test/policy.yaml#setting/runtime/max-test-generation-retries
    - governance-source:desktop-agents/load-test/policy.yaml#setting/runtime/load-test-timeout-seconds
    - governance-source:desktop-agents/load-test/policy.yaml#setting/runtime/result-timeout-seconds
  max_generation_retries: 1
  test_timeout_seconds: 1500
  result_timeout_seconds: 60
  network: denied                            # dış ağ kapalı; trafik yalnız yalıtılmış test ortamı içinde
  inherited_secrets: false
  project_workspace_write: false
  load_limits:                               # ŞEMA UZANTISI GEREKİR — kurumsal tavan, proje yalnız düşürebilir
    max_vus: 50
    max_arrival_rate_per_second: 200
    max_duration_seconds: 900
  load_profiles:                             # ŞEMA UZANTISI GEREKİR
    smoke: {vus: 2, duration_seconds: 60}
    load: {warmup_seconds: 60, steady_vus: 20, steady_seconds: 300, rampdown_seconds: 30}
  source_authority: governance-authoritative
  implementation_status: implementation-pending
  projection_status: not-projectable
  runtime_admission: not-admitted
