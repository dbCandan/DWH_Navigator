agent: oss_license
version: "1.0.0"

weights:
  critical: 45
  high: 22
  medium: 10
  low: 4
  info: 0

rules:
  - id: LICENSE-URL-001
    category: unapproved_download_source
    severity: high
    hard_fail: true
    message: "Onaylı olmayan bir kaynaktan doğrudan paket indirme/kurulum tespit edildi (approved_domains dışı) — supply chain riski."
    pattern: "pip install\\s+git\\+https?://(?!github\\.com)"

  - id: LICENSE-URL-002
    category: unapproved_download_source
    severity: high
    hard_fail: false
    message: "Şifrelenmemiş (http://) kaynaktan paket indirme tespit edildi."
    pattern: "pip install\\s+http://"

  # "AI Agent Yazılım Standartları" (kurumsal standart) Bölüm 10 —
  # bağımlılık pinning zorunluluğu.
  - id: LICENSE-003
    category: dependency_pinning
    severity: medium
    hard_fail: false
    message: "Bağımlılık versiyonu 'latest' veya '*' ile sabitlenmemiş — kurumsal standart pinned versiyon zorunlu kılar; supply chain saldırılarına (versiyon değişikliği ile enjeksiyon) karşı risklidir (Bölüm 10)."
    pattern: "(?i)[\"']?version[\"']?\\s*[:=]\\s*[\"']?(latest|\\*)[\"']?"

  # "AI Agent Yazılım Standartları" Bölüm 10 — copyleft lisans riski.
  - id: LICENSE-005
    category: license_compliance
    severity: high
    hard_fail: false
    message: "Copyleft lisans (GPL/AGPL) beyanı tespit edildi — kurumsal standart bu lisansların ticari yazılıma bulaşma riskini değerlendirmeyi zorunlu kılar; onaysız kullanım production'a alınamaz (Bölüm 10, Veri Güvenliği Bölüm 12.3)."
    pattern: "(?i)\\b(GPL|AGPL)[-\\s]?v?[123]?(\\.\\d)?\\b"
