agent: application_security
version: "1.0.0"

weights:
  critical: 45
  high: 22
  medium: 10
  low: 4
  info: 0

rules:
  - id: APPSEC-001
    category: injection
    severity: critical
    hard_fail: true
    message: "SQL sorgusu string birleştirme/format ile kuruluyor — SQL Injection (CWE-89 / OWASP A03) riski."
    pattern: "(execute|cursor\\.execute|query)\\s*\\(\\s*(f['\"]|['\"].*%s.*['\"]\\s*%|['\"].*\\+)"

  - id: APPSEC-001B
    category: injection
    severity: critical
    hard_fail: true
    message: "SQL anahtar kelimesi içeren bir string, bir değişkene birleştirme (+) ile atanıyor — bu değişken daha sonra execute() içinde kullanılırsa SQL Injection (CWE-89) riski taşır. APPSEC-001'i tamamlayan kural: sorgunun ayrı bir değişkende kurulup SONRA execute edildiği (çok yaygın) durumu yakalar."
    pattern: "\\w+\\s*=\\s*['\"].*\\b(SELECT|INSERT|UPDATE|DELETE)\\b.*['\"]\\s*\\+"

  - id: APPSEC-002
    category: injection
    severity: critical
    hard_fail: true
    message: "os.system/subprocess çağrısında kullanıcı girdisi ile shell komutu birleştirme — Command Injection (CWE-78) riski."
    pattern: "(os\\.system|subprocess\\.(Popen|call|run))\\s*\\([^)]*\\+"

  - id: APPSEC-003
    category: deserialization
    severity: high
    hard_fail: false
    message: "Güvensiz deserialization (pickle.loads / yaml.load без Loader) — CWE-502 riski."
    pattern: "(pickle\\.loads|yaml\\.load\\((?!.*Loader))"

  - id: APPSEC-004
    category: crypto
    severity: high
    hard_fail: false
    message: "Zayıf / kırık kriptografik algoritma kullanımı (MD5/SHA1/DES) — CWE-327 riski."
    pattern: "\\b(hashlib\\.md5|hashlib\\.sha1|DES\\.new)\\b"

  - id: APPSEC-005
    category: input_validation
    severity: medium
    hard_fail: false
    message: "Doğrulanmamış kullanıcı girdisinin doğrudan dosya yoluna kullanılması — Path Traversal (CWE-22) riski."
    pattern: "open\\(\\s*[^,)]*request\\.[^,)]*\\)"

  - id: APPSEC-006
    category: authn
    severity: high
    hard_fail: false
    message: "Sabit kodlanmış (hardcoded) kimlik doğrulama bypass / karşılaştırması — Authentication ihlali riski (CWE-798)."
    pattern: "if\\s+\\w*(password|token|auth)\\w*\\s*==\\s*['\"][^'\"]+['\"]"

  # --- Aşağıdaki kurallar "AI Agent Güvenlik ve Kodlama Talimatları v3.0"
  # (kurumsal standart) referans alınarak eklenmiştir — bkz. Bölüm 4, 6, 7.
  - id: APPSEC-007
    category: authn
    severity: critical
    hard_fail: true
    message: "JWT imzalama için zayıf/güvensiz algoritma (HS256 veya 'none') kullanılıyor — yalnızca RS256/ES256 kurumsal standarttır (Bölüm 4)."
    pattern: "(?i)(algorithm\\s*=\\s*['\"]?(HS256|none)['\"]?|[\"']alg[\"']\\s*:\\s*[\"'](HS256|none)[\"'])"

  - id: APPSEC-008
    category: crypto
    severity: critical
    hard_fail: true
    message: "TLS sertifika doğrulaması devre dışı bırakılmış (verify=False / rejectUnauthorized=false) — MITM saldırısına açık kapı (Bölüm 7)."
    pattern: "(verify\\s*=\\s*False|rejectUnauthorized\\s*:\\s*false|ssl\\._create_unverified_context)"

  - id: APPSEC-009
    category: session_http
    severity: high
    hard_fail: false
    message: "CORS politikasında wildcard (*) origin kullanılıyor — kurumsal standart origin allowlist zorunlu kılar (Bölüm 6)."
    pattern: "(Access-Control-Allow-Origin['\"]?\\]?\\s*[:=]\\s*['\"]\\*|origin\\s*:\\s*['\"]\\*['\"])"

  - id: APPSEC-010
    category: crypto
    severity: high
    hard_fail: false
    message: "Token/OTP/secret üretimi için kriptografik olmayan rastgelelik (random modülü) kullanılıyor — os.urandom()/secrets modülü zorunludur (Bölüm 7)."
    pattern: "(token|otp|secret|password|session_id)\\w*\\s*=\\s*[^=\\n]*\\brandom\\.(random|randint|choice)\\("

  # --- "AI Agent Güvenlik ve Kodlama Talimatları v3.0" ve "Veri Güvenliği
  # Yönetimi" (kurumsal standartlar) — kapsamlı ikinci geçiş eklemeleri.
  - id: APPSEC-011
    category: crypto
    severity: critical
    hard_fail: true
    message: "ECB şifreleme modu kullanılıyor — blok tekrarı deseni sızdırır, yasaklı algoritma (Bölüm 7)."
    pattern: "(?i)(MODE_ECB|CipherMode\\.ECB|mode\\s*=\\s*['\"]?ecb['\"]?)"

  - id: APPSEC-012
    category: crypto
    severity: high
    hard_fail: false
    message: "Zayıf RSA anahtar boyutu (512/1024 bit) — kurumsal standart minimum RSA 3072 bit zorunlu kılar (Bölüm 7)."
    pattern: "(?i)(rsa\\.generate_private_key|RSA\\.generate)\\s*\\([^)]*\\b(512|1024)\\b"

  - id: APPSEC-013
    category: crypto
    severity: critical
    hard_fail: true
    message: "Yasaklı simetrik şifreleme algoritması (DES/3DES/RC4) kullanılıyor (Bölüm 7)."
    pattern: "(?i)\\b(DES3?\\.new|ARC4\\.new|Cipher\\.DES|CryptoJS\\.DES|CryptoJS\\.RC4)\\b"

  - id: APPSEC-014
    category: injection
    severity: critical
    hard_fail: true
    message: "eval()/exec() ile dinamik kod çalıştırma — RCE (Remote Code Execution) riski (Bölüm 3). Not: aynı bulgu kod kalitesi açısından QUAL-005'te de raporlanır; burada güvenlik/RCE perspektifiyle ayrıca işaretlenir."
    pattern: "\\b(eval|exec)\\s*\\("

  - id: APPSEC-015
    category: injection
    severity: critical
    hard_fail: true
    message: "Template Injection (SSTI) riski: kullanıcı girdisi doğrudan template motoruna geçiriliyor (Bölüm 3)."
    pattern: "(render_template_string\\s*\\(|Template\\s*\\(\\s*\\w+\\s*\\)\\.render)"

  - id: APPSEC-016
    category: crypto
    severity: high
    hard_fail: false
    message: "Parola için düz SHA-256 kullanılıyor — yalnızca Argon2id/bcrypt/PBKDF2-SHA256 (iter≥100k) izinlidir, düz hash brute-force'a açıktır (Bölüm 5, Veri Güvenliği Bölüm 5)."
    pattern: "(?i)(password|pwd|passwd)\\w*\\s*=\\s*hashlib\\.sha256\\("

  - id: APPSEC-017
    category: session_http
    severity: high
    hard_fail: false
    message: "Session ID/token URL query string üzerinden taşınıyor — loglara/tarayıcı geçmişine sızabilir (Bölüm 6)."
    pattern: "[?&](session_?id|sessionid|jsessionid|token)="

  - id: APPSEC-018
    category: authn
    severity: critical
    hard_fail: true
    message: "Authentication/authorization bypass bayrağı (skip_auth/disable_auth/bypass_login) tespit edildi — kurumsal standart bu tür kodun üretilmesini/bulunmasını mutlak yasaklar (Bölüm 2)."
    pattern: "(?i)\\b(skip_auth|disable_auth|bypass_login|skip_authentication|disable_check)\\w*\\s*=\\s*True\\b"

  - id: APPSEC-019
    category: business_logic
    severity: high
    hard_fail: false
    message: "Kod içinde ham DDL ifadesi (DROP/ALTER/TRUNCATE TABLE) tespit edildi — kurumsal standart bu işlemlerin insan onayından (İnsan Onay Kapısı, Bölüm 13) geçmeden script'e dökülmemesini zorunlu kılar."
    pattern: "(?i)\\b(DROP\\s+TABLE|ALTER\\s+TABLE|TRUNCATE\\s+TABLE)\\b"

semantic_check:
  enabled: false
  min_findings_to_trigger: 1
  focus: "SQL/Command Injection ve diger OWASP Top 10 zafiyetlerinin gercek somurulebilirligi"
