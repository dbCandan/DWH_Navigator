agent: observability
version: "1.0.0"

weights:
  critical: 15
  high: 8
  medium: 4
  low: 1
  info: 0

rules:
  - id: OBS-001
    category: logging
    severity: low
    hard_fail: false
    message: "print() ile debug çıktısı bırakılmış — yapılandırılmış (structured) logging kullanılmalı (bkz. Observability Architecture)."
    pattern: "^\\s*print\\s*\\("

  - id: OBS-002
    category: silent_failure
    severity: medium
    hard_fail: false
    message: "İstisna yakalanmış ama loglanmıyor (sessiz hata) — izlenebilirlik/alerting kaybı."
    pattern: "except[^:]*:\\s*\\n\\s*pass\\b"

  - id: OBS-003
    category: health_check
    severity: medium
    hard_fail: false
    message: "Web uygulaması tanımlanmış ama health-check endpoint'i ('/health' veya '/healthz') tespit edilemedi."
    pattern: "(Flask|FastAPI)\\s*\\(\\s*__name__\\s*\\)(?!.*['\"]/health)"

  # "AI Agent Yazılım Standartları" (kurumsal standart) Bölüm 6 —
  # yapılandırılmış (structured) loglama zorunluluğu.
  - id: OBS-004
    category: logging
    severity: low
    hard_fail: false
    message: "Log çağrısında f-string/string-interpolation kullanılmış — kurumsal standart yapılandırılmış (key-value, structured) loglama zorunlu kılar; f-string hem performans hem log-parsing/analiz kaybına yol açar (Bölüm 6)."
    pattern: "log(ger)?\\.\\w+\\(\\s*f['\"]"
