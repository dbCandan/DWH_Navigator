agent: privacy_kvkk
version: "1.0.0"

weights:
  critical: 50
  high: 24
  medium: 10
  low: 4
  info: 0

rules:
  - id: PRIV-001
    category: pii_national_id
    severity: critical
    hard_fail: true
    message: "Olası T.C. Kimlik Numarası deseni (11 haneli) kod içine gömülü — KVKK ihlali riski, gerçek veri kaynak koda ASLA gömülmemeli."
    pattern: "(?<!\\d)[1-9]\\d{10}(?!\\d)"

  - id: PRIV-002
    category: pci_financial
    severity: critical
    hard_fail: true
    message: "Olası IBAN numarası kod içine gömülü — PCI/finansal veri ihlali riski."
    pattern: "\\bTR\\d{2}\\s?\\d{4}\\s?\\d{4}\\s?\\d{4}\\s?\\d{4}\\s?\\d{4}\\s?\\d{2}\\b"

  - id: PRIV-003
    category: pci_financial
    severity: critical
    hard_fail: true
    message: "Olası kredi kartı numarası deseni (16 hane) kod içine gömülü — PCI-DSS ihlali riski."
    pattern: "\\b(?:\\d[ -]?){13,16}\\b"

  - id: PRIV-004
    category: pii_contact
    severity: medium
    hard_fail: false
    message: "Olası Türkiye cep telefonu numarası kod içine gömülü — PII ihlali riski."
    pattern: "\\b0?5\\d{2}[\\s.-]?\\d{3}[\\s.-]?\\d{2}[\\s.-]?\\d{2}\\b"

  - id: PRIV-005
    category: pii_contact
    severity: medium
    hard_fail: false
    message: "Olası e-posta adresi (gerçek müşteri verisi olabilir) kod içine gömülü."
    pattern: "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}"

  - id: PRIV-006
    category: special_category_kvkk
    severity: high
    hard_fail: false
    message: "KVKK özel nitelikli veri kategorisine (sağlık/din/biyometrik/ceza mahkûmiyeti/sendika üyeliği) ilişkilendirilebilecek anahtar kelime kod içinde sabit veriyle birlikte kullanılmış."
    pattern: "\\b(diagnosis|hasta_no|tani_kodu|din|dini_inanc|biyometrik|ceza_mahkumiyeti|sabika|sendika_uyeligi)\\b\\s*[:=]\\s*['\"]"

  # "Veri Güvenliği Yönetimi" (kurumsal standart) Bölüm 2 — Kritik PII
  # kapsamına giren CVV/CVC/PIN, PAN'dan bağımsız olarak da (örn. ayrı bir
  # alanda) hardcoded bulunabilir; PRIV-003 (kart numarası) bunu yakalamaz.
  - id: PRIV-007
    category: pci_financial
    severity: critical
    hard_fail: true
    message: "CVV/CVC/PIN kod içine sabit olarak gömülmüş — PCI-DSS'in en katı yasakladığı veri kategorisi (asla saklanamaz, Bölüm 2)."
    pattern: "(?i)\\b(cvv|cvc|pin)\\b\\s*[:=]\\s*['\"]?\\d{3,6}['\"]?"

  # "Veri Güvenliği Yönetimi" Bölüm 4 (Loglama) — PII scrubber allowlist.
  - id: PRIV-008
    category: log_disclosure
    severity: critical
    hard_fail: true
    message: "PII (TCKN/IBAN/kart numarası/CVV) doğrudan bir log çağrısına geçiriliyor — kurumsal standart bu alanların maskeleme helper'ından geçmeden loglanmamasını zorunlu kılar (Veri Güvenliği Bölüm 4)."
    pattern: "log(ger)?\\.\\w+\\([^)]*\\b(tckn|iban|cardnumber|card_number|cvv)\\b"

semantic_check:
  enabled: false
  min_findings_to_trigger: 1
  focus: "tespit edilen verinin gercek/canli musteri verisi mi yoksa sentetik/test verisi mi oldugu (KVKK kapsami)"
